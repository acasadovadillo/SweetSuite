/*
 * webkit_asociaciones — Tema: claro, oscuro o el del sistema («auto»).
 *
 * Se carga en <head>, ANTES que el CSS, a propósito: si se aplicara después de
 * pintar, quien use el tema oscuro vería un fogonazo blanco en cada carga.
 * Es una preferencia del dispositivo (no un dato de la asociación), así que
 * vive en localStorage, fuera de los datos cifrados.
 *
 * Adaptado de tema.js de Solvento.
 */
(function () {
  "use strict";
  var CLAVE = "webkit_asociaciones_tema";
  var VALIDOS = ["auto", "claro", "oscuro"];
  var sistema = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

  function guardado() {
    try { var v = localStorage.getItem(CLAVE); return VALIDOS.indexOf(v) >= 0 ? v : "auto"; }
    catch (e) { return "auto"; }
  }
  function efectivo(pref) {
    return pref === "auto" ? (sistema && sistema.matches ? "oscuro" : "claro") : pref;
  }
  function aplicar() {
    document.documentElement.setAttribute("data-tema", efectivo(guardado()));
  }
  function poner(pref) {
    if (VALIDOS.indexOf(pref) < 0) pref = "auto";
    try { localStorage.setItem(CLAVE, pref); } catch (e) { /* sin almacenamiento: dura la sesión */ }
    aplicar();
  }

  aplicar();
  if (sistema && sistema.addEventListener) sistema.addEventListener("change", aplicar);

  window.WA = window.WA || {};
  window.WA.Tema = { poner: poner, actual: guardado, VALIDOS: VALIDOS };
})();
</script>

.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.saltar { position: absolute; left: 0.5rem; top: -3rem; background: var(--acento); color: var(--acento-texto); padding: 0.5rem 1rem; border-radius: var(--radio-pequeno); z-index: 100; }
.saltar:focus { top: 0.5rem; }

/* ── Estructura ─────────────────────────────────────────────────────── */
.cabecera {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 0.75rem;
  height: var(--alto-cabecera); padding: 0 1rem;
  background: var(--superficie); border-bottom: 1px solid var(--borde);
}
.marca { font-weight: 700; color: var(--texto); text-decoration: none; letter-spacing: -0.01em; }
.cabecera-acciones { margin-left: auto; display: flex; gap: 0.5rem; }

.cuerpo { display: flex; min-height: calc(100vh - var(--alto-cabecera)); }
.menu {
  width: var(--ancho-menu); flex-shrink: 0;
  background: var(--superficie); border-right: 1px solid var(--borde);
  padding: 1rem 0.75rem;
}
.menu ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(var(--alto-cabecera) + 1rem); }
.menu a {
  display: flex; align-items: center; gap: 0.7rem;
  padding: 0.6rem 0.75rem; border-radius: var(--radio-pequeno);
  color: var(--texto-2); text-decoration: none; font-weight: 500;

.menu a svg { width: 20px; height: 20px; flex-shrink: 0; }
.menu a:hover { background: var(--superficie-2); color: var(--texto); }
.menu a[aria-current="page"] { background: var(--acento-suave); color: var(--texto); font-weight: 700; }
.menu a[aria-current="page"] svg { color: var(--acento); }

.principal { flex: 1; min-width: 0; padding: 2rem clamp(1rem, 4vw, 3rem) 4rem; max-width: 1100px; }
.principal:focus { outline: none; }
.intro { color: var(--texto-2); max-width: 65ch; margin-bottom: 1.5rem; }
.detalle { color: var(--texto-3); font-size: 0.9rem; }
.cargando { color: var(--texto-3); }

/* Doble clase para ganar a .btn-icono, que se define después. */
.solo-movil.solo-movil { display: none; }
.velo { display: none; }

/* ── Móvil: el menú se convierte en un panel lateral ───────────────── */
@media (max-width: 800px) {
  .solo-movil.solo-movil { display: inline-flex; }
  .solo-ancho { display: none; }
  .menu {
    position: fixed; top: var(--alto-cabecera); bottom: 0; left: 0; z-index: 30;

    box-shadow: var(--sombra); overflow-y: auto;

  .principal { padding-top: 1.25rem; }

}
@media (max-width: 420px) {
  .marca { font-size: 0.9rem; }
  #btn-bloquear { display: none; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }

/*
 * webkit_asociaciones — Impresión (y «Guardar como PDF» del navegador).
 * Se quita todo lo que es de manejo (menú, botones, avisos) y queda el contenido.

@media print {
  :root { --fondo: #fff; --superficie: #fff; --texto: #000; --texto-2: #222; --texto-3: #444; --borde: #bbb; }
  body { background: #fff; color: #000; font-size: 11pt; }
  .cabecera, .menu, .velo, .franja, .avisos, .saltar, .acciones, .btn, .celda-acciones, .no-imprimir { display: none !important; }
  .cuerpo { display: block; min-height: 0; }
  .principal { padding: 0; max-width: none; }
  .tarjeta { box-shadow: none; border: none; padding: 0; margin: 0 0 1.5rem; break-inside: avoid; }
  a { color: #000; text-decoration: none; }

 * webkit_asociaciones — Sesión: abrir, guardar y cerrar los datos.
 *
 * Une las piezas: Cripto (cifrar), Bóveda (guardar en el navegador), Esquema
 * (migrar) y Repositorio (la puerta que usan los módulos).
 *
 * Estados:
 *   · cerrada       no hay datos en memoria; se ve la pantalla de acceso
 *   · abierta       datos reales descifrados en memoria; cada cambio se cifra y se guarda
 *   · demostración  datos inventados en memoria; NADA se guarda

 * Al bloquear o cerrar, se suelta (y con él la clave).

  "use strict";
  var WA = raiz.WA;

  var oyentes = [];

  var pendientes = 0;             // guardados en curso (para avisar si cierras la pestaña)

    pendientes++;
    cola = cola.then(function () {
      return WA.Cripto.cifrar(doc, llave).then(WA.Boveda.escribir);
    }).catch(function (e) {
      console.error(e);
      WA.UI && WA.UI.aviso("No se ha podido guardar en el navegador. Descarga una copia de seguridad ahora.", "error");

    estado.doc = doc;
    estado.llave = llave;
    estado.modo = modo;
    estado.repo = WA.Repositorio.crearRepositorio(doc, modo === "abierta" ? persistir : null);
    avisar();

    get modo() { return estado.modo; },
    get datos() { return estado.repo; },

     * Recupera una copia de seguridad. Si va cifrada hace falta SU contraseña;
     * a partir de ahí, los datos quedan protegidos con «contrasenaNueva» (que
     * puede ser la misma). Sustituye lo que hubiera en el navegador.
     */

  <script>/* js/nucleo/app.js */
/*
 * webkit_asociaciones — Esqueleto de la aplicación: módulos, navegación y avisos.
 *
 * CÓMO SE AÑADE UN MÓDULO (p. ej. «Socios» en la Fase 2):
 *   1. Crea src/js/modulos/socios.js
 *   2. Dentro, llama a:
 *        WA.App.registrar({
 *          id: "socios",                 // aparece en la dirección: #/socios
 *          titulo: "Socios",             // texto del menú y título de la página
 *          icono: "<path d=…/>",          // trazos SVG de 24×24 (opcional)
 *          orden: 20,                    // posición en el menú
 *          pintar: async function (contenedor, datos) { … }  // datos = WA.Sesion.datos
 *        });
 *   3. Añade su <script> en src/index.html (antes de arranque.js).
 *
 * La navegación usa el «#» de la dirección (#/inicio, #/asociacion…) porque
 * funciona abriendo el archivo directamente, sin servidor.
 */
(function (raiz) {
  "use strict";
  var WA = raiz.WA;
  var modulos = [];
  var actual = null;
  var temporizadorBloqueo = null;

  var $ = function (id) { return document.getElementById(id); };

  function registrar(m) {
    modulos.push(m);
    modulos.sort(function (a, b) { return (a.orden || 0) - (b.orden || 0); });
  }

  function rutaActual() {
    var id = (location.hash || "").replace(/^#\/?/, "").split("/")[0];
    return modulos.some(function (m) { return m.id === id; }) ? id : "inicio";
  }

  function pintarMenu() {
    var lista = $("menu-lista");
    lista.innerHTML = modulos.filter(function (m) { return !m.oculto; }).map(function (m) {
      return '<li><a href="#/' + m.id + '" data-modulo="' + m.id + '">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + (m.icono || "") + "</svg>" +
        "<span>" + WA.UI.esc(m.titulo) + "</span></a></li>";

  /** Pinta el módulo de la dirección actual. */
  async function navegar(opciones) {

    actual = id;
    Array.prototype.forEach.call(document.querySelectorAll("#menu-lista a"), function (a) {
      if (a.getAttribute("data-modulo") === id) a.setAttribute("aria-current", "page");

      await m.pintar(principal, WA.Sesion.datos);
    } catch (e) {
      console.error(e);
      principal.innerHTML = '<div class="tarjeta tarjeta-error"><h1>Algo ha fallado</h1><p>' + WA.UI.esc(e.message) +

        contenido: "<p>Este navegador está configurado para <strong>borrar los datos al cerrar la sesión</strong>. " +
          "Si sales sin descargar una copia, perderás los cambios desde la última.</p>",
        botones: [
          { texto: "Cancelar", valor: "cancelar" },
          { texto: "Salir sin copia", valor: "sin", estilo: "btn-peligro" },
          { texto: "Descargar copia y salir", valor: "copia", estilo: "btn-primario" },
        ],
      });
      if (r.valor === "cancelar") return;
      if (r.valor === "copia") await WA.Copias.descargar(true);

  <script>/* js/modulos/asociacion.js */
/*
 * webkit_asociaciones — Módulo «Asociación»: datos de la entidad y junta directiva.
 *
 * Los datos de la asociación (nombre, NIF, domicilio…) se usan después en
 * convocatorias, actas, recibos y la memoria anual, así que conviene rellenarlos
 * primero.
 *
 * La junta guarda también a quienes ya salieron (con fecha «hasta»): sirve de
 * histórico de cargos, que a menudo se pide al tramitar cambios en el registro.
 * Qué cargos debe haber y cómo se renuevan lo dicen los ESTATUTOS de cada
 * asociación (verificar con asesoría); aquí solo se anotan.
 */
(function (raiz) {
  "use strict";

  // ── Datos de la asociación ───────────────────────────────────────────────

      '<fieldset><legend>Identificación</legend><div class="rejilla">' +
      UI.campo({ nombre: "nombre", etiqueta: "Nombre completo", valor: a.nombre, requerido: true, ancho: "completo", ayuda: "Tal y como figura en los estatutos." }) +
      UI.campo({ nombre: "siglas", etiqueta: "Siglas o nombre corto", valor: a.siglas }) +
      UI.campo({ nombre: "nif", etiqueta: "NIF de la asociación", valor: a.nif, ayuda: "Antes llamado CIF. Suele empezar por G.", atributos: 'autocapitalize="characters"' }) +
      UI.campo({ nombre: "registro", etiqueta: "Registro donde está inscrita", valor: a.registro, ayuda: "Nacional o de tu comunidad autónoma." }) +

      UI.campo({ nombre: "telefono", etiqueta: "Teléfono", tipo: "tel", valor: a.telefono }) +
      UI.campo({ nombre: "web", etiqueta: "Web", tipo: "url", valor: a.web, ayuda: "Con https://" }) +
      UI.campo({ nombre: "iban", etiqueta: "IBAN de la cuenta", valor: a.iban, ayuda: "Se usará para las remesas de cuotas.", atributos: 'autocapitalize="characters"' }) +

  /*
   * Domicilio social, por partes (ver nucleo/direccion.js). Solo son necesarios

  function camposDomicilio(d) {

      .map(function (p) { return [p, p]; }));
    return '<fieldset><legend>Domicilio social</legend><div class="rejilla-12">' +
      UI.campo({ nombre: "tipoVia", etiqueta: "Tipo de vía", tipo: "select", valor: d.tipoVia, opciones: tipos, clase: "col-3" }) +
      UI.campo({ nombre: "nombreVia", etiqueta: "Nombre de la vía", valor: d.nombreVia, clase: "col-7 col-movil-completo", atributos: 'autocomplete="address-line1"' }) +
      UI.campo({ nombre: "numero", etiqueta: "Número", valor: d.numero, clase: "col-2", ayuda: "o s/n", atributos: 'inputmode="text"' }) +
      UI.campo({ nombre: "km", etiqueta: "Km", valor: d.km, clase: "col-2", ayuda: "En carreteras" }) +
      UI.campo({ nombre: "bloque", etiqueta: "Bloque", valor: d.bloque, clase: "col-2" }) +
      UI.campo({ nombre: "portal", etiqueta: "Portal", valor: d.portal, clase: "col-2" }) +
      UI.campo({ nombre: "escalera", etiqueta: "Escalera", valor: d.escalera, clase: "col-2" }) +
      UI.campo({ nombre: "planta", etiqueta: "Planta o piso", valor: d.planta, clase: "col-2", lista: Dir.PLANTAS, ayuda: "1, 2… Bajo, Ático" }) +
      UI.campo({ nombre: "puerta", etiqueta: "Puerta", valor: d.puerta, clase: "col-2", ayuda: "A, B, Izda…" }) +
      UI.campo({ nombre: "complemento", etiqueta: "Otros datos de la dirección", valor: d.complemento, clase: "col-12",
        ayuda: "Lo que no encaje arriba: local, centro cívico, urbanización, «a/a de…»." }) +
      UI.campo({ nombre: "codigoPostal", etiqueta: "Código postal", valor: d.codigoPostal, clase: "col-3",
        atributos: 'inputmode="numeric" autocomplete="postal-code" maxlength="5"' }) +
      UI.campo({ nombre: "municipio", etiqueta: "Municipio", valor: d.municipio, clase: "col-5", atributos: 'autocomplete="address-level2"' }) +
      UI.campo({ nombre: "provincia", etiqueta: "Provincia", tipo: "select", valor: d.provincia, opciones: provincias, clase: "col-4 col-movil-completo",
        ayuda: "Se rellena sola con el código postal." }) +
      '<p class="vista-previa" aria-live="polite"><strong>Así se escribirá en los documentos</strong><span id="dom-previa"></span></p>' +
      "</div></fieldset>";
  }

  /** Lee los campos del domicilio de un formulario ya convertido en objeto. */
  function domicilioDe(datos) {

      var m = datos[nombre] && !resultado.valido ? resultado.mensaje : "";

      if (m) avisos++;
    }
    UI.marcarError(form, "nombre", datos.nombre ? "" : "El nombre es obligatorio.");

    if (datos.email) comprobar("email", V.email(datos.email)); else UI.marcarError(form, "email", "");

  // ── Junta directiva ─────────────────────────────────────────────────────
  var nombreCargo = function (m) { return m.cargo === "Otro" && m.cargoOtro ? m.cargoOtro : m.cargo; };
  var vigente = function (m) { return !m.hasta || m.hasta >= F.hoy(); };

  function tablaJunta(junta) {
    var orden = WA.Esquema.CARGOS;
    var actuales = junta.filter(vigente).sort(function (a, b) { return orden.indexOf(a.cargo) - orden.indexOf(b.cargo); });
    var anteriores = junta.filter(function (m) { return !vigente(m); }).sort(function (a, b) { return (b.hasta || "").localeCompare(a.hasta || ""); });

          (m.telefono ? "<br><span class=\"detalle\">" + esc(m.telefono) + "</span>" : "") + "</td>" +
          "<td>" + esc(F.corta(m.desde)) + (m.hasta ? " – " + esc(F.corta(m.hasta)) : "") + "</td>" +
          '<td class="celda-acciones"><button type="button" class="btn btn-pequeno btn-secundario" data-editar="' + esc(m.id) + '" aria-label="Editar a ' + esc(m.nombre) + '">Editar</button></td></tr>';
      }).join("");
    }

    return (actuales.length
      ? '<div class="tabla-envoltorio"><table class="tabla"><caption class="sr">Junta directiva actual</caption>' + cabecera + "<tbody>" + filas(actuales) + "</tbody></table></div>"

      (anteriores.length

    var r = await UI.dialogo({

      contenido: '<form class="formulario" novalidate><div class="rejilla">' +

        UI.campo({ nombre: "telefono", etiqueta: "Teléfono", tipo: "tel", valor: m.telefono }) +

        UI.marcarError(form, "nombre", d.nombre ? "" : "Escribe el nombre."); if (!d.nombre) bien = false;

      },
    });

      var ok = await UI.confirmar("Se eliminará a " + m.nombre + " (" + nombreCargo(m) + ") de la junta. Si ha dejado el cargo, es mejor poner la fecha «hasta» y así queda en el histórico.",
        { titulo: "Eliminar de la junta", aceptar: "Eliminar", peligro: true });

        if (p && (!datosForm.provincia || datosForm.provincia === provinciaAuto)) {

      cont.querySelector("#dom-previa").textContent = Dir.formatear(domicilioDe(datosForm)).completa || "—";

    form.addEventListener("change", actualizarDireccion);

        domicilio: domicilioDe(d),
        email: d.email, telefono: d.telefono, web: d.web, iban: V.normalizar(d.iban),
      }));

    });

    async function trasEditar(cambio) {

    }
    cont.querySelector("#j-anadir").addEventListener("click", function () { editarMiembro(datos).then(trasEditar); });
    cont.querySelector("#j-tabla").addEventListener("click", async function (e) {
      var b = e.target.closest("[data-editar]");
      if (!b) return;
      var m = await datos.obtener("junta", b.getAttribute("data-editar"));
      if (m) trasEditar(await editarMiembro(datos, m));

  <script>/* js/modulos/copias.js */
/*
 * webkit_asociaciones — Módulo «Copia de seguridad».
 *
