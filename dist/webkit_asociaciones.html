      if (el.name === "asistio") await guardarAct(A.cambiarInscripcion(a, insId, { asistio: el.value === "" ? null : el.value === "si" }));
      if (el.name === "autorizacion") await guardarAct(A.cambiarInscripcion(a, insId, { autorizacion: el.checked }), el.checked ? "Autorización marcada." : "");
    });
    cont.querySelector("#i-tabla").addEventListener("click", async function (e) {
      var b = e.target.closest("[data-accion]");
      if (!b) return;
      var insId = b.getAttribute("data-ins"), ins = a.inscripciones.filter(function (i) { return i.id === insId; })[0];
      if (b.getAttribute("data-accion") === "cobrar") {
        var pago = await pedirPago(ins, porId[ins.socioId], c.config);
        if (pago) await guardarAct(A.cobrar(a, insId, pago), "Inscripción cobrada.");
      } else await masOpciones(datos, c, a, ins, enlazadas, guardarAct);
    });
    cont.querySelector("#i-csv").addEventListener("click", function () { exportarCsv(a, porId); });
    cont.querySelector("#i-correos").addEventListener("click", async function () {
      var correos = a.inscripciones.filter(function (i) { return i.estado !== "cancelada" && /@/.test(i.contacto); }).map(function (i) { return i.contacto; });
      try { await navigator.clipboard.writeText(correos.join(", ")); UI.aviso(correos.length + " correos copiados. Pégalos en «CCO» para que nadie vea los de los demás."); }
      catch (err) { UI.aviso("No se han podido copiar: " + correos.join(", "), "info"); }
    });
    cont.querySelector("#b-gasto").addEventListener("click", async function () {
      if (await U.editarMovimiento(datos, c, null, { tipo: "gasto", actividadId: a.id, proyectoId: a.proyectoId, categoriaId: "actividades", concepto: a.titulo + ": " })) WA.App.repintar();
    });
    cont.querySelector("#a-duplicar").addEventListener("click", async function () {
      var g = await datos.guardar("actividades", A.duplicar(a));
      UI.aviso("Copia creada sin inscripciones. Cambia la fecha.");
      location.hash = "#/actividades/ficha/" + encodeURIComponent(g.id);
    });
    cont.querySelector("#a-ics1").addEventListener("click", function () { descargarIcs(c, [a], "actividad-" + A.fechaDe(a) + ".ics"); });
    cont.querySelector("#a-borrar").addEventListener("click", async function () {
      var pagadas = a.inscripciones.filter(function (i) { return i.pago; }).length;
      if (pagadas) { UI.aviso("Tiene " + pagadas + " inscripciones cobradas: márcala como cancelada en vez de borrarla, para que el dinero siga constando.", "error"); return; }
      if (!(await UI.confirmar("Se borrará la actividad con sus inscripciones.", { titulo: "Borrar actividad", aceptar: "Borrar", peligro: true }))) return;
      await datos.borrar("actividades", a.id);
      location.hash = "#/actividades";
    });
  }

  function tablaInscripciones(a, porId, enlazadas) {
    var lista = a.inscripciones.filter(function (i) { return vista.canceladas || i.estado !== "cancelada"; })
      .sort(function (x, y) { var o = { inscrita: 0, espera: 1, cancelada: 2 }; return o[x.estado] - o[y.estado] || String(x.fecha).localeCompare(String(y.fecha)); });
    if (!lista.length) return '<p class="vacio">Nadie inscrito todavía.</p>';
    var espera = A.enEspera(a).map(function (i) { return i.id; });
    return '<div class="tabla-envoltorio"><table class="tabla"><caption class="sr">Inscripciones</caption><thead><tr><th scope="col">Persona</th><th scope="col">Estado</th>' +
      (a.autorizacionMenores ? '<th scope="col">Autorización</th>' : "") + '<th scope="col">Pago</th><th scope="col">¿Vino?</th><th scope="col"><span class="sr">Acciones</span></th></tr></thead><tbody>' +
      lista.map(function (i) {
        var socio = porId[i.socioId], menor = A.esMenor(i, socio, a);
        var estado = i.estado === "inscrita" ? '<span class="estado estado-ok">Inscrita</span>' : i.estado === "espera"
          ? '<span class="estado estado-aviso">En espera (' + (espera.indexOf(i.id) + 1) + ".º)</span>" : '<span class="estado estado-neutro">Cancelada</span>';
        var pago = i.pago ? '<span class="estado estado-ok">Pagada</span><br><span class="detalle">' + esc(F.corta(i.pago.fecha)) + " · " + esc(i.pago.forma) + "</span>"
          : i.importe > 0 ? (i.estado === "cancelada" ? '<span class="detalle">' + esc(D.formatear(i.importe)) + "</span>"
            : '<button type="button" class="btn btn-pequeno btn-primario" data-accion="cobrar" data-ins="' + esc(i.id) + '">Cobrar ' + esc(D.formatear(i.importe)) + "</button>")
          : '<span class="detalle">Gratis</span>';
        return '<tr><th scope="row">' + (socio ? '<a href="#/socios/ficha/' + encodeURIComponent(socio.id) + '">' + esc(i.nombre) + '</a> <span class="etiqueta">Socio n.º ' + esc(socio.numero) + "</span>" : esc(i.nombre)) +
          (menor ? ' <span class="etiqueta">Menor</span>' : "") + (i.contacto ? '<br><span class="detalle">' + esc(i.contacto) + "</span>" : "") + "</th>" +
          "<td>" + estado + "</td>" +
          (a.autorizacionMenores ? "<td>" + (menor ? '<label class="casilla en-linea"><input type="checkbox" name="autorizacion" data-ins="' + esc(i.id) + '"' + (i.autorizacion ? " checked" : "") +
            '><span class="sr">Autorización de ' + esc(i.nombre) + "</span></label>" + (i.autorizacion ? "" : ' <span class="estado estado-error">Falta</span>') : '<span class="detalle">—</span>') + "</td>" : "") +
          "<td>" + pago + "</td>" +
          "<td>" + (i.estado === "inscrita" ? '<label class="sr" for="as-' + esc(i.id) + '">¿Vino ' + esc(i.nombre) + '?</label><select id="as-' + esc(i.id) + '" name="asistio" data-ins="' + esc(i.id) + '" class="select-pequeno">' +
            [["", "—"], ["si", "Sí"], ["no", "No"]].map(function (o) {
              var v = i.asistio === true ? "si" : i.asistio === false ? "no" : "";
              return '<option value="' + o[0] + '"' + (v === o[0] ? " selected" : "") + ">" + o[1] + "</option>";
            }).join("") + "</select>" : "") + "</td>" +
          '<td class="celda-acciones"><button type="button" class="btn btn-pequeno btn-secundario" data-accion="mas" data-ins="' + esc(i.id) + '" aria-label="Más opciones de ' + esc(i.nombre) + '">Más…</button></td></tr>';
      }).join("") + "</tbody></table></div>";
  }

  async function nuevaInscripcion(datos, c, a) {
    var activos = c.socios.filter(function (s) { return S.estado(s) === "activo"; }).sort(function (x, y) { return (x.numero || 0) - (y.numero || 0); });
    var etiqueta = function (s) { return s.numero + " · " + S.nombreCompleto(s); };
    var soloSocios = a.abierta === "socios";
    var r = await UI.dialogo({
      titulo: "Inscribir en «" + a.titulo + "»",
      contenido: (a.aforo > 0 && A.libres(a) === 0 ? '<div class="caja-aviso">' + (a.listaEspera ? "Está completa: la inscripción irá a la lista de espera." : "Está completa y no tiene lista de espera.") + "</div>" : "") +
        '<form class="formulario" novalidate>' +
        (soloSocios ? "" : '<fieldset class="grupo-opciones"><legend>¿Quién?</legend><label class="opcion"><input type="radio" name="quien" value="socio" checked><span>Un socio</span></label>' +
          '<label class="opcion"><input type="radio" name="quien" value="otro"><span>Otra persona</span></label></fieldset>') +
        '<div data-quien="socio">' + UI.campo({ nombre: "socio", etiqueta: "Socio", valor: "", lista: activos.map(etiqueta), ancho: "completo", ayuda: "Escribe su número o su nombre y elígelo de la lista.",
          atributos: 'autocomplete="off"' }) + "</div>" +
        '<div data-quien="otro" hidden><div class="rejilla">' +
        UI.campo({ nombre: "nombre", etiqueta: "Nombre y apellidos", valor: "", ancho: "completo" }) +
        UI.campo({ nombre: "contacto", etiqueta: "Correo o teléfono", valor: "", ancho: "completo" }) + "</div>" +
        '<label class="casilla"><input type="checkbox" name="esMenor"><span>Es menor de edad</span></label></div>' +
        (a.autorizacionMenores ? '<label class="casilla"><input type="checkbox" name="autorizacion"><span>Ha entregado la autorización firmada (si es menor)</span></label>' : "") +
        UI.campo({ nombre: "notas", etiqueta: "Notas (alergias, necesidades…)", valor: "", ancho: "completo" }) +
        "</form>",
      botones: [{ texto: "Cancelar", valor: "cancelar" }, { texto: "Inscribir", valor: "enviar", estilo: "btn-primario" }],
      alAbrir: function (d) {
        var f = d.querySelector("form");
        var ver = function () {
          var q = soloSocios ? "socio" : (f.querySelector("input[name=quien]:checked") || {}).value;
          d.querySelectorAll("[data-quien]").forEach(function (x) { x.hidden = x.getAttribute("data-quien") !== q; });
        };
        f.addEventListener("change", ver);
        ver();
      },
      validar: function (form) {
        var dd = UI.leerFormulario(form);
        var q = soloSocios ? "socio" : (form.querySelector("input[name=quien]:checked") || {}).value;
        if (q === "socio") {
          var ok = activos.some(function (s) { return etiqueta(s) === dd.socio; });
          UI.marcarError(form, "socio", ok ? "" : "Elige un socio de la lista.");
          return ok;
        }
        UI.marcarError(form, "nombre", dd.nombre ? "" : "Escribe el nombre.");
        return !!dd.nombre;
      },
    });
    if (r.valor !== "enviar") return;
    var dd = r.datos;
    var quien = soloSocios ? "socio" : (r.form.querySelector("input[name=quien]:checked") || {}).value;
    var persona = quien === "socio"
      ? { socio: activos.filter(function (s) { return etiqueta(s) === dd.socio; })[0], autorizacion: !!dd.autorizacion, notas: dd.notas }
      : { nombre: dd.nombre, contacto: dd.contacto, esMenor: !!dd.esMenor, autorizacion: !!dd.autorizacion, notas: dd.notas };
    try {
      var res = A.inscribir(a, persona);
      await datos.guardar("actividades", res.actividad);
      UI.aviso(res.enEspera ? res.inscripcion.nombre + " queda en lista de espera." : res.inscripcion.nombre + " inscrito/a.", res.enEspera ? "info" : "ok");
      WA.App.repintar();
    } catch (err) { UI.aviso(err.message, "error"); }
  }

  async function pedirPago(ins, socio, config) {
    var forma = (socio && socio.formaPago) || "Bizum";
    var r = await UI.dialogo({
      titulo: "Cobrar inscripción",
      contenido: "<p>" + esc(ins.nombre) + " · <strong>" + esc(D.formatear(ins.importe)) + "</strong></p>" +
        '<form class="formulario" novalidate><div class="rejilla">' +
        UI.campo({ nombre: "fecha", etiqueta: "Fecha del pago", tipo: "date", valor: F.hoy(), requerido: true }) +
        UI.campo({ nombre: "forma", etiqueta: "Forma de pago", tipo: "select", valor: forma, opciones: S.FORMAS_PAGO }) +
        UI.campo({ nombre: "cuentaId", etiqueta: "Dónde entra el dinero", tipo: "select", valor: WA.Cuotas.cuentaPorDefecto(forma, config.cuentas), opciones: U.opcionesCuentas({ config: config }) }) +
        UI.campo({ nombre: "referencia", etiqueta: "Referencia (opcional)", valor: "" }) + "</div></form>",
      botones: [{ texto: "Cancelar", valor: "cancelar" }, { texto: "Marcar como pagada", valor: "enviar", estilo: "btn-primario" }],
      alAbrir: function (d) {
        var f = d.querySelector("form");
        f.elements.forma.addEventListener("change", function () { f.elements.cuentaId.value = WA.Cuotas.cuentaPorDefecto(f.elements.forma.value, config.cuentas); });
      },
      validar: function (form) { var ok = F.esValida(form.elements.fecha.value); UI.marcarError(form, "fecha", ok ? "" : "Pon la fecha."); return ok; },
    });
    return r.valor === "enviar" ? r.datos : null;
  }

  async function masOpciones(datos, c, a, ins, enlazadas, guardarAct) {
    var ref = a.id + ":" + ins.id;
    var botones = [{ texto: "Cerrar", valor: "cancelar" }];
    if (ins.estado !== "cancelada") botones.unshift({ texto: "Cancelar inscripción", valor: "cancelar-ins", estilo: "btn-peligro-suave" });
    if (ins.estado === "espera") botones.unshift({ texto: "Darle plaza ya", valor: "promover" });
    if (ins.pago) botones.unshift({ texto: "Deshacer el cobro", valor: "deshacer" });
    if (ins.estado !== "cancelada" && !ins.pago) botones.unshift({ texto: "Cambiar importe…", valor: "importe" });
    var r = await UI.dialogo({ titulo: ins.nombre, contenido: "<p>" + esc(a.titulo) + (ins.notas ? '</p><p class="detalle">Notas: ' + esc(ins.notas) : "") + "</p>" +
      (ins.pago && enlazadas[ref] ? '<p class="detalle">Este cobro está enlazado a un movimiento del banco: para deshacerlo, quita el enlace en Tesorería.</p>' : ""), botones: botones });
    if (r.valor === "cancelar-ins") {
      var res = A.cancelar(a, ins.id);
      await guardarAct(res.actividad, res.promovida ? "Cancelada. " + res.promovida.nombre + " pasa de la lista de espera a tener plaza (avísale)." : "Inscripción cancelada." + (ins.pago ? " El cobro sigue constando: si se devuelve el dinero, apunta el gasto en Tesorería." : ""));
    } else if (r.valor === "promover") {
      await guardarAct(A.promover(a, ins.id), "Ya tiene plaza.");

  // ── Resumen ─────────────────────────────────────────────────────────────

  // ── Importar el extracto ────────────────────────────────────────────────
  async function importarExtracto(datos, c) {

    if (!archivo) return;

      if (/\.xlsx$/i.test(archivo.nombre)) {

        UI.campo({ nombre: "cuentaId", etiqueta: "¿De qué cuenta es el extracto?", tipo: "select", valor: cuentaBanco, opciones: U.opcionesCuentas(c), ancho: "completo" }) +
        UI.campo({ nombre: "filaCabecera", etiqueta: "Fila de los títulos", tipo: "number", valor: String(det.fila + 1), atributos: 'min="1"' }) +
        campos.map(function (x) {
          var v = det.columnas[x[0]];
          return UI.campo({ nombre: "col-" + x[0], etiqueta: x[1], tipo: "select", valor: v === undefined ? "" : String(v), opciones: opcCol });
        }).join("") + "</div>" +
        '<div id="ex-previa" class="vista-previa-tabla" aria-live="polite"></div>' +
        "</form>" + U.ayuda("Los movimientos que ya estaban importados (misma cuenta, fecha, importe y concepto) se saltan. Los nuevos entran sin categoría, salvo que una regla de Ajustes la ponga; luego se clasifican y se enlazan con cuotas o facturas."),
      botones: [{ texto: "Cancelar", valor: "cancelar" }, { texto: "Importar", valor: "enviar", estilo: "btn-primario" }],
      alAbrir: function (d) {

  async function editarDatosAnticipo(datos, c, a) {
    var r = await UI.dialogo({

      botones: (a.id ? [{ texto: "Borrar", valor: "borrar", estilo: "btn-peligro-suave" }] : []).concat([{ texto: "Cancelar", valor: "cancelar" }, { texto: "Guardar", valor: "enviar", estilo: "btn-primario" }]),

        UI.campo({ nombre: "facturaId", etiqueta: "Factura recibida (si la hay)", tipo: "select", valor: g.facturaId, opciones: facturas, ayuda: "Para que conste como pagada y su IVA cuente." }) +

    var form = cont.querySelector("#f-editor");

      cont.querySelector("#f-totales").innerHTML = totalesHtml(f);

      '<div><h4>Resultado del año</h4><ul class="lista-cifras"><li><span>Ingresado en los trimestres</span><strong>' + esc(D.formatear(r.ingresado)) + "</strong></li>" +

      "<li><span>Operaciones exentas</span><strong>" + esc(D.formatear(r.baseExenta)) + "</strong></li>" +
      "<li><span>Retenciones IRPF del año</span><strong>" + esc(D.formatear(r.retenciones)) + "</strong></li></ul></div></div></section>" +
      U.ayuda("Cómo se calcula: IVA devengado = el de las facturas emitidas del trimestre (por su fecha). IVA deducible = el de las facturas recibidas marcadas como deducibles, por el porcentaje de deducción indicado en Ajustes. Si el resultado es negativo, en los tres primeros trimestres queda a compensar; en el cuarto se puede pedir la devolución. Las cuotas de socios y las donaciones no llevan IVA y no aparecen aquí.");

    cont.querySelector("#v-anio").addEventListener("change", function (e) { anioVista = +e.target.value; WA.App.repintar(); });
    cont.querySelector("#v-excel").addEventListener("click", function () { U.exportarExcel(c, anio); });
    cont.querySelectorAll("[data-devolucion]").forEach(function (cb) {
      cb.addEventListener("change", async function () {
        var k = cb.getAttribute("data-devolucion");
        var lista = (c.config.iva.devolucionesSolicitadas || []).filter(function (x) { return x !== k; });
        if (cb.checked) lista.push(k);
        c.config.iva.devolucionesSolicitadas = lista;
        await datos.escribir("config", c.config);
        UI.aviso(cb.checked ? "Marcado: se pide la devolución." : "Marcado: queda a compensar.");
        WA.App.repintar();
      });
    });
  }

  WA.App.registrar({
    id: "iva", titulo: "IVA", orden: 34, pintar: pintar,
    icono: '<path d="M19 5 5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/>',
  });
})(typeof self !== "undefined" ? self : this);
</script>
  <script>/* js/modulos/proyectos.js */
/*
 * webkit_asociaciones — Módulo «Presupuestos»: presupuesto anual y proyectos o subvenciones.
 *
 *   #/proyectos                presupuesto anual (lo aprobado en asamblea) frente a lo realizado
 *   #/proyectos/lista          proyectos y subvenciones con su ejecución
 *   #/proyectos/ficha/<id>     un proyecto: datos, presupuesto por partidas y ejecución
 *
 * Lo realizado sale de Tesorería (dinero cobrado y pagado, por categoría). Cómo
 * se aprueba el presupuesto lo dicen vuestros estatutos; cómo se justifica una
 * subvención, sus bases: verificar con asesoría.
 */
(function (raiz) {
  "use strict";
  var WA = raiz.WA, UI = WA.UI, esc = UI.esc, F = WA.Fechas, D = WA.Dinero, T = WA.Tesoreria, U = WA.TesUI;

  var anioVista = null;
  function pestanas(actual) {
    return '<nav class="pestanas" aria-label="Apartados de presupuestos"><a href="#/proyectos"' + (actual === "anual" ? ' aria-current="page"' : "") + ">Presupuesto anual</a>" +
      '<a href="#/proyectos/lista"' + (actual === "lista" ? ' aria-current="page"' : "") + ">Proyectos y subvenciones</a></nav>";
  }
  function barra(pct) {
    if (pct === null || pct === undefined) return "";
    var ancho = Math.max(0, Math.min(pct, 100));
    return '<div class="barra-progreso' + (pct > 100 ? " pasada" : "") + '" role="img" aria-label="' + pct + ' %"><span style="width:' + ancho + '%"></span></div>';
  }

  /** Tabla editable de previsto por categoría frente a lo realizado. */
  function tablaEjecucion(ej, editable) {
    var bloque = function (tipo, titulo, totales) {
      var filas = ej.filas.filter(function (f) { return f.tipo === tipo; });
      return '<tbody><tr class="fila-grupo"><th scope="rowgroup" colspan="5">' + titulo + "</th></tr>" + filas.map(function (f) {
        return '<tr><th scope="row">' + esc(f.nombre) + "</th>" +
          '<td class="importe">' + (editable ? '<label class="sr" for="p-' + esc(f.categoriaId) + '">Previsto para ' + esc(f.nombre) + '</label><input class="input-importe" id="p-' + esc(f.categoriaId) +
            '" name="p-' + esc(f.categoriaId) + '" inputmode="decimal" value="' + (f.previsto ? esc(D.formatear(f.previsto, { simbolo: false })) : "") + '">' : esc(D.formatear(f.previsto))) + "</td>" +
          '<td class="importe">' + esc(D.formatear(f.realizado)) + "</td>" +
          "<td>" + (f.pct === null ? '<span class="detalle">—</span>' : f.pct + " %" + barra(f.pct)) + "</td>" +
          '<td class="importe">' + esc(D.formatear(f.diferencia)) + "</td></tr>";
      }).join("") + '<tr class="total"><th scope="row">Total ' + titulo.toLowerCase() + '</th><td class="importe">' + esc(D.formatear(totales.previsto)) + '</td><td class="importe">' +
        esc(D.formatear(totales.realizado)) + "</td><td></td><td class=\"importe\">" + esc(D.formatear(totales.previsto - totales.realizado)) + "</td></tr></tbody>";
    };
    return '<div class="tabla-envoltorio"><table class="tabla tabla-presupuesto"><thead><tr><th scope="col">Partida</th><th scope="col" class="importe">Previsto</th>' +
      '<th scope="col" class="importe">Realizado</th><th scope="col">Ejecución</th><th scope="col" class="importe">Diferencia</th></tr></thead>' +
      bloque("ingreso", "Ingresos", ej.ingresos) + bloque("gasto", "Gastos", ej.gastos) + "</table></div>";
  }

  /** Todas las categorías activas aparecen, aunque no tengan nada previsto ni realizado. */
  function conTodas(previsto, categorias) {
    var p = Object.assign({}, previsto || {});
    (categorias || []).forEach(function (c) { if (c.activa !== false && !(c.id in p)) p[c.id] = 0; });
    return p;
  }

  function leerPrevisto(form) {
    var d = UI.leerFormulario(form), p = {};
    Object.keys(d).forEach(function (k) {
      if (k.indexOf("p-") !== 0) return;
      var v = D.desdeTexto(d[k] || "0");
      if (v) p[k.slice(2)] = v;
    });
    return p;
  }

  // ── Presupuesto anual ───────────────────────────────────────────────────
  async function pintarAnual(cont, datos) {
    var c = await U.cargar(datos);
    var anio = anioVista || +F.hoy().slice(0, 4);
    var previsto = (c.config.presupuestos || {})[anio] || {};
    var res = T.resultados(T.partidas(c.movimientos, c.cuotas, c.anticipos, c.actividades), anio + "-01-01", anio + "-12-31");
    var ej = T.ejecucion(conTodas(previsto, c.config.categorias), res, c.config.categorias);
    var anios = {};
    [anio, +F.hoy().slice(0, 4), +F.hoy().slice(0, 4) + 1].forEach(function (a) { anios[a] = true; });
    Object.keys(c.config.presupuestos || {}).forEach(function (a) { anios[a] = true; });
    var hayAnterior = !!(c.config.presupuestos || {})[anio - 1];
    cont.innerHTML =
      '<div class="cabecera-pagina"><h1>Presupuestos</h1></div>' + pestanas("anual") +
      '<p class="intro">Lo previsto para el año (normalmente, lo que aprueba la asamblea) frente a lo cobrado y pagado de verdad.</p>' +
      '<div class="barra-filtros"><label>Año <select id="p-anio">' + Object.keys(anios).sort().reverse().map(function (a) {
        return '<option value="' + a + '"' + (+a === anio ? " selected" : "") + ">" + a + "</option>";
      }).join("") + "</select></label>" +
      (hayAnterior && !Object.keys(previsto).length ? '<button type="button" class="btn btn-secundario" id="p-copiar">Copiar el presupuesto de ' + (anio - 1) + "</button>" : "") + "</div>" +
      '<form id="p-form" novalidate>' + tablaEjecucion(ej, true) +
      '<div class="acciones barra-guardar"><button type="submit" class="btn btn-primario">Guardar presupuesto ' + anio + "</button></div></form>" +
      '<p class="detalle">Resultado previsto: ' + esc(D.formatear(ej.ingresos.previsto - ej.gastos.previsto)) + " · Resultado real: " + esc(D.formatear(res.resultado)) + "</p>" +
      U.ayuda("Lo realizado es el dinero cobrado y pagado en el año en cada categoría (incluidas las cuotas y los gastos de anticipos y reembolsos). Las partidas son las categorías de Tesorería → Ajustes.");
    cont.querySelector("#p-anio").addEventListener("change", function (e) { anioVista = +e.target.value; WA.App.repintar(); });
    var bCopiar = cont.querySelector("#p-copiar");
    if (bCopiar) bCopiar.addEventListener("click", async function () {
      c.config.presupuestos[anio] = Object.assign({}, c.config.presupuestos[anio - 1]);
      await datos.escribir("config", c.config);
      UI.aviso("Copiado. Ajusta lo que cambie y guarda.");
      WA.App.repintar();
    });
    cont.querySelector("#p-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      c.config.presupuestos = c.config.presupuestos || {};
      c.config.presupuestos[anio] = leerPrevisto(e.target);
      await datos.escribir("config", c.config);
      UI.aviso("Presupuesto " + anio + " guardado.");
      WA.App.repintar();
    });
  }

  // ── Proyectos y subvenciones ───────────────────────────────────────────
  function ejecucionProyecto(c, p) {
    var partidas = T.partidas(c.movimientos, c.cuotas, c.anticipos, c.actividades).filter(function (x) { return x.proyectoId === p.id; });
    var res = T.resultados(partidas);
    return { res: res, ej: T.ejecucion(p.presupuesto || {}, res, c.config.categorias) };
  }

  var estadoSub = function (e) { return (WA.Obligaciones.ESTADOS_SUBVENCION.filter(function (x) { return x[0] === (e || "idea"); })[0] || ["", ""])[1]; };
  /** El plazo que le toca ahora a una subvención (según su estado), o null. */
  function proximoPlazo(p) {
    return WA.Obligaciones.ocurrenciasSubvenciones([p], "1900-01-01", "2999-12-31")[0] || null;
  }

  /** Seguimiento de una subvención: estado, plazos, importes y requisitos. */
  function seccionSubvencion(p, cobrado) {
    var req = p.requisitos || [];
    var prog = WA.Obligaciones.progresoRequisitos(p);
    return '<form id="pr-sub" class="formulario tarjeta" novalidate><h2>Seguimiento de la subvención</h2><div class="rejilla">' +
      UI.campo({ nombre: "estadoSubvencion", etiqueta: "Estado", tipo: "select", valor: p.estadoSubvencion || "idea", opciones: WA.Obligaciones.ESTADOS_SUBVENCION }) +
      UI.campo({ nombre: "importeSolicitado", etiqueta: "Importe solicitado (€)", valor: p.importeSolicitado ? D.formatear(p.importeSolicitado, { simbolo: false }) : "", atributos: 'inputmode="decimal"' }) +
      UI.campo({ nombre: "plazoSolicitud", etiqueta: "Fin del plazo de solicitud", tipo: "date", valor: p.plazoSolicitud }) +
      UI.campo({ nombre: "fechaSolicitud", etiqueta: "Fecha en que se solicitó", tipo: "date", valor: p.fechaSolicitud }) +
      UI.campo({ nombre: "fechaResolucion", etiqueta: "Fecha de la resolución", tipo: "date", valor: p.fechaResolucion }) +
      UI.campo({ nombre: "plazoJustificacion", etiqueta: "Fin del plazo de justificación", tipo: "date", valor: p.plazoJustificacion }) +
      UI.campo({ nombre: "fechaJustificacion", etiqueta: "Fecha en que se justificó", tipo: "date", valor: p.fechaJustificacion }) +
      UI.campo({ nombre: "urlBases", etiqueta: "Enlace a las bases o la convocatoria", tipo: "url", valor: p.urlBases, ancho: "completo" }) +
      "</div>" +
      '<p class="detalle">Concedido ' + esc(D.formatear(p.importeConcedido || 0)) + " · cobrado " + esc(D.formatear(cobrado)) +
      (p.importeConcedido ? " · pendiente de cobrar " + esc(D.formatear(Math.max((p.importeConcedido || 0) - cobrado, 0))) : "") + "</p>" +
      "<h3>Documentación y requisitos " + (prog.total ? '<span class="detalle">(' + prog.hechos + " de " + prog.total + ")</span>" : "") + "</h3>" +
      '<ul class="lista-editable" id="pr-req">' + req.map(function (r, i) {
        return '<li><label class="casilla en-linea"><input type="checkbox" name="req-' + i + '"' + (r.hecho ? " checked" : "") + "><span>" + esc(r.texto) + "</span></label>" +
          '<button type="button" class="btn btn-pequeno btn-peligro-suave" data-quitar-req="' + i + '">Quitar</button></li>';
      }).join("") + "</ul>" +
      '<div class="fila-anadir"><label class="sr" for="pr-req-nuevo">Nuevo requisito</label><input id="pr-req-nuevo" placeholder="Por ejemplo: memoria técnica, certificado de estar al corriente…">' +
      '<button type="button" class="btn btn-secundario btn-pequeno" id="pr-req-anadir">Añadir</button></div>' +
      '<div class="acciones"><button type="submit" class="btn btn-primario">Guardar seguimiento</button></div>' +
      U.ayuda("Los plazos de solicitud y de justificación aparecen en Obligaciones con aviso. Qué hay que presentar y cuándo lo dicen las bases de la convocatoria.") + "</form>";
  }

  async function pintarLista(cont, datos) {
    var c = await U.cargar(datos);
    cont.innerHTML =
      '<div class="cabecera-pagina"><h1>Presupuestos</h1><button type="button" class="btn btn-primario" id="p-nuevo">Nuevo proyecto o subvención</button></div>' + pestanas("lista") +
      '<p class="intro">Cada proyecto tiene su propio presupuesto por partidas. Al apuntar un gasto o ingreso en Tesorería, elige el proyecto para que cuente aquí.</p>' +
      (c.proyectos.length ? '<div class="tabla-envoltorio"><table class="tabla"><caption class="sr">Proyectos</caption><thead><tr><th scope="col">Proyecto</th><th scope="col">Fechas</th>' +
        '<th scope="col" class="importe">Concedido</th><th scope="col" class="importe">Gasto previsto</th><th scope="col" class="importe">Gastado</th><th scope="col">Ejecución</th></tr></thead><tbody>' +
        c.proyectos.map(function (p) {
          var x = ejecucionProyecto(c, p);
          var pct = x.ej.gastos.previsto > 0 ? Math.round(x.ej.gastos.realizado / x.ej.gastos.previsto * 1000) / 10 : null;
          return '<tr><th scope="row"><a href="#/proyectos/ficha/' + encodeURIComponent(p.id) + '">' + esc(p.nombre) + "</a><br><span class=\"detalle\">" +
            (p.tipo === "subvencion" ? "Subvención · " + esc(estadoSub(p.estadoSubvencion)) : "Proyecto") + (p.financiador ? " · " + esc(p.financiador) : "") + (p.estado === "cerrado" ? " · Cerrado" : "") + "</span>" +
            (proximoPlazo(p) ? '<br><span class="estado ' + (proximoPlazo(p).estado === "vencida" ? "estado-error" : "estado-aviso") + '">' + esc(proximoPlazo(p).etiqueta) + ": " + esc(F.corta(proximoPlazo(p).fecha)) + "</span>" : "") + "</th>" +
            "<td>" + esc(F.corta(p.fechaInicio)) + (p.fechaFin ? " – " + esc(F.corta(p.fechaFin)) : "") + "</td>" +
            '<td class="importe">' + (p.importeConcedido ? esc(D.formatear(p.importeConcedido)) : "—") + '</td><td class="importe">' + esc(D.formatear(x.ej.gastos.previsto)) + "</td>" +
            '<td class="importe">' + esc(D.formatear(x.ej.gastos.realizado)) + "</td><td>" + (pct === null ? "—" : pct + " %" + barra(pct)) + "</td></tr>";
        }).join("") + "</tbody></table></div>" : '<p class="vacio">Todavía no hay proyectos.</p>');
    cont.querySelector("#p-nuevo").addEventListener("click", async function () {
      var g = await datos.guardar("proyectos", { nombre: "Nuevo proyecto", tipo: "proyecto", financiador: "", referencia: "", importeConcedido: 0,
        fechaInicio: F.hoy(), fechaFin: "", estado: "en curso", presupuesto: {}, notas: "" });
      location.hash = "#/proyectos/ficha/" + encodeURIComponent(g.id);
    });
  }

  async function pintarFicha(cont, datos, id) {
    var c = await U.cargar(datos);
    var p = U.buscar(c.proyectos, id);
    if (!p) { cont.innerHTML = '<h1>No encontrado</h1><p><a href="#/proyectos/lista">Volver</a></p>'; return; }
    var x = ejecucionProyecto(c, p);
    var ej = T.ejecucion(conTodas(p.presupuesto, c.config.categorias), x.res, c.config.categorias);
    var lineas = T.libro(c.movimientos, c.cuotas, c.actividades).filter(function (m) { return m.proyectoId === p.id; });
    var gastosAnt = [];
    c.anticipos.forEach(function (a) { a.gastos.forEach(function (g) { if ((g.proyectoId || a.proyectoId) === p.id) gastosAnt.push({ a: a, g: g }); }); });
    cont.innerHTML =
      '<p class="miga"><a href="#/proyectos/lista">Proyectos y subvenciones</a> › ' + esc(p.nombre) + "</p>" +
      "<h1>" + esc(p.nombre) + "</h1>" +
      '<form id="pr-datos" class="formulario tarjeta" novalidate><h2>Datos</h2><div class="rejilla">' +
      UI.campo({ nombre: "nombre", etiqueta: "Nombre", valor: p.nombre, requerido: true, ancho: "completo" }) +
      UI.campo({ nombre: "tipo", etiqueta: "Tipo", tipo: "select", valor: p.tipo, opciones: [["proyecto", "Proyecto propio"], ["subvencion", "Subvención"]] }) +
      UI.campo({ nombre: "financiador", etiqueta: "Quién lo financia", valor: p.financiador }) +
      UI.campo({ nombre: "referencia", etiqueta: "Convocatoria o referencia", valor: p.referencia }) +
      UI.campo({ nombre: "importeConcedido", etiqueta: "Importe concedido (€)", valor: p.importeConcedido ? D.formatear(p.importeConcedido, { simbolo: false }) : "", atributos: 'inputmode="decimal"' }) +
      UI.campo({ nombre: "fechaInicio", etiqueta: "Empieza", tipo: "date", valor: p.fechaInicio }) +
      UI.campo({ nombre: "fechaFin", etiqueta: "Termina", tipo: "date", valor: p.fechaFin }) +
      UI.campo({ nombre: "estado", etiqueta: "Estado", tipo: "select", valor: p.estado, opciones: [["en curso", "En curso"], ["cerrado", "Cerrado"]] }) +
      UI.campo({ nombre: "notas", etiqueta: "Notas", tipo: "textarea", valor: p.notas, ancho: "completo" }) +
      '</div><div class="acciones"><button type="submit" class="btn btn-primario">Guardar datos</button><button type="button" class="btn btn-peligro-suave" id="pr-borrar">Borrar proyecto</button></div></form>' +
      (p.tipo === "subvencion" ? seccionSubvencion(p, x.res.ingresos.subvenciones || 0) : "") +
      '<section class="tarjeta"><h2>Presupuesto y ejecución</h2><form id="pr-presu" novalidate>' + tablaEjecucion(ej, true) +
      '<div class="acciones"><button type="submit" class="btn btn-primario">Guardar presupuesto</button></div></form>' +
      (p.importeConcedido ? '<p class="detalle">Concedido ' + esc(D.formatear(p.importeConcedido)) + " · cobrado de la subvención: " + esc(D.formatear(x.res.ingresos.subvenciones || 0)) + "</p>" : "") +
      U.ayuda("Qué gastos son justificables y cómo se justifican lo dicen las bases de cada subvención: verificar con la entidad que la concede.") + "</section>" +
      '<section class="tarjeta"><h2>Movimientos del proyecto</h2>' + (lineas.length || gastosAnt.length ? '<div class="tabla-envoltorio"><table class="tabla"><tbody>' +
        lineas.map(function (m) {
          return "<tr><td>" + esc(F.corta(m.fecha)) + "</td><td>" + esc(m.concepto || m.conceptoBanco) + "</td><td>" + esc(U.nombreCategoria(c, m.categoriaId)) + '</td><td class="importe">' + U.importeHtml(T.conSigno(m)) + "</td></tr>";
        }).join("") + gastosAnt.map(function (x2) {
          return "<tr><td>" + esc(F.corta(x2.g.fecha)) + "</td><td>" + esc(x2.g.concepto) + ' <a class="etiqueta" href="#/tesoreria/anticipo/' + encodeURIComponent(x2.a.id) + '">' + (x2.a.tipo === "anticipo" ? "Anticipo" : "Reembolso") +
            "</a></td><td>" + esc(U.nombreCategoria(c, x2.g.categoriaId)) + '</td><td class="importe">' + U.importeHtml(-x2.g.importe) + "</td></tr>";
        }).join("") + "</tbody></table></div>" : '<p class="vacio">Todavía no hay movimientos con este proyecto.</p>') + "</section>" +
      WA.DocsUI.seccion(c.documentos || [], { tipo: "proyecto", id: p.id }, "Documentos (bases, solicitud, resolución, justificación…)");
    WA.DocsUI.conectarSeccion(cont, datos, { tipo: "proyecto", id: p.id }, "Subvenciones");

    var fSub = cont.querySelector("#pr-sub");
    if (fSub) {
      var leerSub = function () {
        var d = UI.leerFormulario(fSub);
        (p.requisitos || []).forEach(function (r, i) { r.hecho = !!d["req-" + i]; });
        Object.assign(p, { estadoSubvencion: d.estadoSubvencion, importeSolicitado: D.desdeTexto(d.importeSolicitado || "0") || 0, plazoSolicitud: d.plazoSolicitud,
          fechaSolicitud: d.fechaSolicitud, fechaResolucion: d.fechaResolucion, plazoJustificacion: d.plazoJustificacion, fechaJustificacion: d.fechaJustificacion, urlBases: d.urlBases });
      };
      fSub.addEventListener("submit", async function (e) {
        e.preventDefault();
        leerSub();
        await datos.guardar("proyectos", p);
        UI.aviso("Seguimiento guardado.");
        WA.App.repintar();
      });
      cont.querySelector("#pr-req-anadir").addEventListener("click", async function () {
        var t = cont.querySelector("#pr-req-nuevo").value.trim();
        if (!t) return;
        leerSub();
        p.requisitos = (p.requisitos || []).concat([{ id: WA.Esquema.nuevoId(), texto: t, hecho: false }]);
        await datos.guardar("proyectos", p);
        WA.App.repintar();
      });
      cont.querySelector("#pr-req").addEventListener("click", async function (e) {
        var b = e.target.closest("[data-quitar-req]");
        if (!b) return;
        leerSub();
        p.requisitos.splice(+b.getAttribute("data-quitar-req"), 1);
        await datos.guardar("proyectos", p);
        WA.App.repintar();
      });
    }

    cont.querySelector("#pr-datos").addEventListener("submit", async function (e) {

  <script>/* js/modulos/obligaciones.js */
/*
 * webkit_asociaciones — Módulo «Obligaciones»: calendario de plazos con aviso.

 *
 * Incluye los plazos de las subvenciones (de Presupuestos → proyectos de tipo

(function (raiz) {

  function pestanas(actual) {
    return '<nav class="pestanas" aria-label="Apartados de obligaciones"><a href="#/obligaciones"' + (actual === "" ? ' aria-current="page"' : "") + ">Calendario</a>" +
      '<a href="#/obligaciones/lista"' + (actual === "lista" ? ' aria-current="page"' : "") + ">Mis obligaciones</a></nav>";
  }

  /** Vencimientos de obligaciones y subvenciones entre dos fechas (lo usan también Inicio y Actividades). */
  async function vencimientos(datos, desde, hasta) {
    var r = await Promise.all([datos.listar("obligaciones"), datos.listar("proyectos")]);
    return O.ocurrencias(r[0], desde, hasta).concat(O.ocurrenciasSubvenciones(r[1], desde, hasta))
      .sort(function (a, b) { return a.fecha.localeCompare(b.fecha); });

  // ── Calendario de vencimientos ──────────────────────────────────────────

  async function pintarCalendario(cont, datos) {

    var todas = await vencimientos(datos, desde, hasta);

    var lista = todas.filter(function (x) { return x.fecha >= hoy ? (verHechas || x.estado !== "hecha") : x.estado === "vencida"; });
    var porMes = {};

      '<div class="cabecera-pagina"><h1>Obligaciones</h1><div class="acciones-cabecera"><button type="button" class="btn btn-secundario" id="o-habituales">Elegir de las habituales…</button>' +
      '<button type="button" class="btn btn-primario" id="o-nueva">Nueva obligación</button></div></div>' + pestanas("") +
      '<div class="caja-aviso">Fechas orientativas: dependen de vuestro caso y pueden cambiar (festivos, cambios normativos). <strong>Verificad con la asesoría</strong> qué obligaciones os afectan.</div>' +
      (!obligaciones.length ? '<p class="intro">Todavía no habéis elegido ninguna obligación. Pulsa «Elegir de las habituales…» para empezar.</p>' : "") +
      (vencidas ? '<p class="intro"><span class="estado estado-error">' + vencidas + (vencidas === 1 ? " vencida" : " vencidas") + "</span> sin marcar como hechas.</p>" : "") +
      '<label class="casilla"><input type="checkbox" id="o-hechas"' + (verHechas ? " checked" : "") + "><span>Ver también las ya hechas</span></label>" +
      (Object.keys(porMes).length ? Object.keys(porMes).sort().map(function (m) {
        return '<section class="tarjeta"><h2>' + esc(F.MESES[+m.slice(5) - 1].charAt(0).toUpperCase() + F.MESES[+m.slice(5) - 1].slice(1)) + " " + m.slice(0, 4) + "</h2>" +

    cont.querySelector("#o-hechas").addEventListener("change", function (e) { verHechas = e.target.checked; WA.App.repintar(); });

    cont.querySelectorAll("[data-hecha]").forEach(function (b) {

  <script>/* js/modulos/copias.js */
/*
 * webkit_asociaciones — Módulo «Copia de seguridad».
 *
 * La copia de seguridad es lo más importante de la aplicación: los datos viven
 * en un navegador, y un navegador se puede borrar, cambiar o estropear. Una
 * copia descargada (y guardada en otro sitio) es lo único que lo protege.
 */
(function (raiz) {
  "use strict";
  var WA = raiz.WA, esc = WA.UI.esc;

  /** Descarga una copia. cifrada = true (normal) o false (legible, con aviso). */
  async function descargar(cifrada) {
    var sesion = WA.Sesion;
    if (sesion.modo === "demostración" && cifrada) cifrada = false;
    var sobre = await sesion.contenidoCopia(cifrada);
    var nombre = WA.Copia.nombreArchivo(sobre.asociacion, WA.Fechas.hoy(), cifrada);
    WA.UI.descargar(nombre, JSON.stringify(sobre, null, cifrada ? 0 : 2), "application/json");
    if (cifrada && sesion.modo === "abierta") await sesion.datos.marcarCopiaHecha();
    WA.UI.aviso("Copia descargada: " + nombre + ". Guárdala fuera de este ordenador.");
    WA.App.actualizarFranjas();
  }

  async function descargarSinCifrar() {
    var ok = await WA.UI.confirmar(
      "El archivo contendrá todos los datos en claro (nombres, correos, teléfonos…). Cualquiera que lo abra podrá leerlos. " +
      "Úsalo solo para revisarlos o pasarlos a otro programa, y bórralo después.",
      { titulo: "Copia SIN cifrar", aceptar: "Descargar sin cifrar", peligro: true });
    if (ok) await descargar(false);
  }

  async function restaurar() {
    var archivo = await WA.UI.elegirArchivo(".json,application/json");
    if (!archivo) return;
    var lectura;
    try { lectura = WA.Copia.leer(archivo.texto); }
    catch (e) { WA.UI.aviso(e.message, "error"); return; }
    var demo = WA.Sesion.modo === "demostración";
    var r = await WA.UI.dialogo({
      titulo: "Recuperar copia",
      contenido: "<p>Copia" + (lectura.asociacion ? " de <strong>" + esc(lectura.asociacion) + "</strong>" : "") +
        (lectura.creada ? " del " + esc(WA.Fechas.corta(lectura.creada.slice(0, 10))) : "") + ".</p>" +
        (demo ? "" : '<div class="caja-aviso"><strong>Sustituirá todos los datos actuales.</strong> Si no estás seguro, descarga antes una copia de lo que tienes ahora.</div>') +
        "<form>" +
        (lectura.cifrada ? WA.UI.campo({ nombre: "pass", etiqueta: "Contraseña de la copia", tipo: "password", requerido: true,
          ayuda: demo ? "" : "A partir de ahora será también la contraseña de este navegador.", atributos: 'autocomplete="current-password"' }) : "") +
        (demo || !lectura.cifrada ? WA.UI.campo({ nombre: "nueva", etiqueta: "Contraseña para proteger los datos en este navegador", tipo: "password", requerido: true,
          ayuda: "Mínimo 8 caracteres.", atributos: 'autocomplete="new-password" minlength="8"' }) : "") +
        "</form>",
      botones: [{ texto: "Cancelar", valor: "cancelar" }, { texto: "Recuperar", valor: "enviar", estilo: "btn-primario" }],
      validar: function (form) {
        var n = form.elements.nueva;
        if (n && n.value.length < 8) { WA.UI.marcarError(form, "nueva", "Mínimo 8 caracteres."); return false; }
        return true;
      },
    });
    if (r.valor !== "enviar") return;
    try {
      var passCopia = r.datos.pass || "";
      // Si la copia va cifrada y no se pidió otra, la contraseña de la copia pasa a ser la de la sesión.
      await WA.Sesion.restaurar(lectura, passCopia, r.datos.nueva || passCopia);
      WA.UI.aviso("Copia recuperada.");
      location.hash = "#/inicio";
      WA.App.repintar();
    } catch (e) {
      WA.UI.aviso(e.message, "error");
    }
  }

  async function pintar(cont, datos) {
    var demo = WA.Sesion.modo === "demostración";
    var e = await datos.estadoCopia();
    var tipo = await WA.Boveda.tipo();
    var docs = await datos.listar("documentos");
    var pesoDocs = docs.reduce(function (s, d) { return s + (d.tamano || 0); }, 0);
    var ultima = e.ultimaCopia
      ? "La última copia es del <strong>" + esc(WA.Fechas.corta(e.ultimaCopia.slice(0, 10))) + "</strong>" +
        (e.cambiosDesdeCopia ? " y desde entonces ha habido cambios." : " y no ha habido cambios después.")
      : "Todavía no has descargado ninguna copia.";
    cont.innerHTML =
      "<h1>Copia de seguridad</h1>" +
      '<p class="intro">Tus datos solo están en este navegador. Descarga una copia cada vez que hagas cambios importantes y guárdala en otro sitio (un pendrive, la nube de la asociación…).</p>' +
      (demo ? '<div class="caja-aviso">Estás en la demostración: la copia sale sin cifrar y con datos inventados.</div>' : "") +
      '<section class="tarjeta" aria-labelledby="t-descargar"><h2 id="t-descargar">Descargar copia</h2>' +
      (demo ? "" : "<p>" + ultima + "</p>") +
      "<p>La copia va <strong>cifrada con tu contraseña</strong>: sin ella no se puede abrir.</p>" +
      (docs.length ? '<p class="detalle">Incluye ' + docs.length + (docs.length === 1 ? " documento adjunto" : " documentos adjuntos") + " (" + esc(WA.DocsUI.tamanoTexto(pesoDocs)) + "): el archivo de copia ocupará algo más.</p>" : "") +
      '<div class="acciones"><button type="button" class="btn btn-primario" id="c-descargar">Descargar copia cifrada</button>' +
      '<button type="button" class="btn btn-secundario" id="c-claro">Descargar sin cifrar…</button></div></section>' +
      '<section class="tarjeta" aria-labelledby="t-recuperar"><h2 id="t-recuperar">Recuperar una copia</h2>' +
      "<p>Abre un archivo de copia para seguir trabajando con él en este navegador.</p>" +
      '<div class="acciones"><button type="button" class="btn btn-secundario" id="c-recuperar">Elegir archivo de copia…</button></div></section>' +
      '<section class="tarjeta" aria-labelledby="t-buenas"><h2 id="t-buenas">Buenas prácticas</h2><ul class="lista">' +
      "<li>Guarda al menos dos copias en sitios distintos, y alguna fuera de este ordenador.</li>" +
      "<li>Guarda la contraseña aparte de las copias (por ejemplo, en un gestor de contraseñas). Sin ella, la copia no sirve.</li>" +
      "<li>Las copias contienen datos personales de socios: compártelas solo con quien lleve la gestión.</li>" +
      "<li>Las copias sin cifrar, bórralas en cuanto termines de usarlas.</li>" +
      "</ul><p class=\"detalle\">Se guarda en este navegador con " + esc(tipo) + ".</p></section>";
    cont.querySelector("#c-descargar").addEventListener("click", function () { descargar(true).then(function () { WA.App.repintar(); }); });
    cont.querySelector("#c-claro").addEventListener("click", descargarSinCifrar);
    cont.querySelector("#c-recuperar").addEventListener("click", restaurar);
    if (demo) cont.querySelector("#c-descargar").hidden = true;
  }

  WA.Copias = { descargar: descargar };
  WA.App.registrar({
    id: "copias", titulo: "Copia de seguridad", orden: 90, pintar: pintar,
    icono: '<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
  });
})(typeof self !== "undefined" ? self : this);
</script>
