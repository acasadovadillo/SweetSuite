/*
 * webkit_asociaciones — Tema: claro, oscuro o el del sistema («auto»).
 *
 * Se carga en <head>, ANTES que el CSS, a propósito: si se aplicara después de
 * pintar, quien use el tema oscuro vería un fogonazo blanco en cada carga.
 * Es una preferencia del dispositivo (no un dato de la asociación), así que
 * vive en localStorage, fuera de los datos cifrados.
 *
 * Adaptado de tema.js de Solvento.
 */
(function () {
  "use strict";
  var CLAVE = "webkit_asociaciones_tema";
  var VALIDOS = ["auto", "claro", "oscuro"];
  var sistema = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

  function guardado() {
    try { var v = localStorage.getItem(CLAVE); return VALIDOS.indexOf(v) >= 0 ? v : "auto"; }
    catch (e) { return "auto"; }
  }
  function efectivo(pref) {
    return pref === "auto" ? (sistema && sistema.matches ? "oscuro" : "claro") : pref;
  }
  function aplicar() {
    document.documentElement.setAttribute("data-tema", efectivo(guardado()));
  }
  function poner(pref) {
    if (VALIDOS.indexOf(pref) < 0) pref = "auto";
    try { localStorage.setItem(CLAVE, pref); } catch (e) { /* sin almacenamiento: dura la sesión */ }
    aplicar();
  }

  aplicar();
  if (sistema && sistema.addEventListener) sistema.addEventListener("change", aplicar);

  window.WA = window.WA || {};
  window.WA.Tema = { poner: poner, actual: guardado, VALIDOS: VALIDOS };
})();
</script>

/*

  --texto-3: #5f6a62;          /* detalles: 5,4:1 sobre blanco */
  --acento: #2f6f4f;           /* verde: botones principales, enlaces */
  --acento-hover: #255a40;
  --acento-texto: #ffffff;
  --acento-suave: #e3efe8;
  --enlace: #23613f;
  --foco: #1f5fbf;
  --peligro: #b3261e;
  --peligro-suave: #fbe9e7;
  --aviso: #8a5a00;
  --aviso-fondo: #fff4d6;
  --aviso-borde: #e7c56b;
  --info-fondo: #e6effa;
  --info-borde: #9dbbe6;
  --ok: #1e6b3d;
  --ok-fondo: #e1f2e7;
  --sombra: 0 1px 2px rgba(20, 30, 20, 0.06), 0 4px 16px rgba(20, 30, 20, 0.06);

  --radio: 10px;
  --radio-pequeno: 6px;
  --ancho-menu: 232px;
  --alto-cabecera: 56px;
  --fuente: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --fuente-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}

:root[data-tema="oscuro"] {
  --fondo: #121614;
  --superficie: #1a201c;
  --superficie-2: #232a25;
  --borde: #323b35;
  --borde-fuerte: #5d6a61;
  --texto: #e8ece9;
  --texto-2: #b8c2bb;
  --texto-3: #9aa59d;
  --acento: #6fbf91;
  --acento-hover: #8ad0a7;
  --acento-texto: #0d1a12;
  --acento-suave: #1f3328;
  --enlace: #8ad0a7;
  --foco: #8ab4f8;
  --peligro: #f28b82;
  --peligro-suave: #3a1d1b;
  --aviso: #f3c969;
  --aviso-fondo: #2e2610;
  --aviso-borde: #6b5520;
  --info-fondo: #172436;

/*
 * webkit_asociaciones — Base: tipografía, estructura (cabecera, menú, contenido)
 * y adaptación a móvil.

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--fondo);
  color: var(--texto);
  font-family: var(--fuente);
  font-size: 1rem;
  line-height: 1.5;
}
h1, h2, h3 { line-height: 1.25; margin: 0 0 0.5rem; }
h1 { font-size: 1.6rem; letter-spacing: -0.01em; }
h2 { font-size: 1.15rem; }
p { margin: 0 0 0.75rem; }
a { color: var(--enlace); }
a:hover { text-decoration-thickness: 2px; }
[hidden] { display: none !important; }

/* El foco siempre visible al navegar con teclado. */
:focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; border-radius: 4px; }
h1:focus { outline: none; }

/* Solo para lectores de pantalla. */
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.saltar { position: absolute; left: 0.5rem; top: -3rem; background: var(--acento); color: var(--acento-texto); padding: 0.5rem 1rem; border-radius: var(--radio-pequeno); z-index: 100; }
.saltar:focus { top: 0.5rem; }

/* ── Estructura ─────────────────────────────────────────────────────── */
.cabecera {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 0.75rem;
  height: var(--alto-cabecera); padding: 0 1rem;
  background: var(--superficie); border-bottom: 1px solid var(--borde);
}
.marca { font-weight: 700; color: var(--texto); text-decoration: none; letter-spacing: -0.01em; }
.cabecera-acciones { margin-left: auto; display: flex; gap: 0.5rem; }

.cuerpo { display: flex; min-height: calc(100vh - var(--alto-cabecera)); }
.menu {
  width: var(--ancho-menu); flex-shrink: 0;
  background: var(--superficie); border-right: 1px solid var(--borde);
  padding: 1rem 0.75rem;
}
.menu ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(var(--alto-cabecera) + 1rem); }
.menu a {
  display: flex; align-items: center; gap: 0.7rem;
  padding: 0.6rem 0.75rem; border-radius: var(--radio-pequeno);
  color: var(--texto-2); text-decoration: none; font-weight: 500;
}
.menu a svg { width: 20px; height: 20px; flex-shrink: 0; }
.menu a:hover { background: var(--superficie-2); color: var(--texto); }
.menu a[aria-current="page"] { background: var(--acento-suave); color: var(--texto); font-weight: 700; }
.menu a[aria-current="page"] svg { color: var(--acento); }

.principal { flex: 1; min-width: 0; padding: 2rem clamp(1rem, 4vw, 3rem) 4rem; max-width: 1100px; }
.principal:focus { outline: none; }
.intro { color: var(--texto-2); max-width: 65ch; margin-bottom: 1.5rem; }
.detalle { color: var(--texto-3); font-size: 0.9rem; }
.cargando { color: var(--texto-3); }

/* Doble clase para ganar a .btn-icono, que se define después. */
.solo-movil.solo-movil { display: none; }
.velo { display: none; }

/* ── Móvil: el menú se convierte en un panel lateral ───────────────── */
@media (max-width: 800px) {
  .solo-movil.solo-movil { display: inline-flex; }
  .solo-ancho { display: none; }
  .menu {
    position: fixed; top: var(--alto-cabecera); bottom: 0; left: 0; z-index: 30;
    transform: translateX(-100%); transition: transform 0.2s ease;
    box-shadow: var(--sombra); overflow-y: auto;
  }
  .menu ul { position: static; }
  body.menu-abierto .menu { transform: none; }
  body.menu-abierto .velo { display: block; position: fixed; inset: var(--alto-cabecera) 0 0 0; background: rgba(0, 0, 0, 0.35); z-index: 25; }
  .principal { padding-top: 1.25rem; }
  h1 { font-size: 1.35rem; }
  .cabecera-acciones .btn { padding-inline: 0.6rem; }
}
@media (max-width: 420px) {
  .marca { font-size: 0.9rem; }
  #btn-bloquear { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
  <style>/* css/componentes.css */
/*
 * webkit_asociaciones — Componentes: botones, tarjetas, formularios, tablas,
 * diálogos, avisos y pantalla de acceso.
 */

/* ── Botones ─────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
  min-height: 44px;                 /* objetivo táctil cómodo */
  padding: 0.55rem 1.1rem; border-radius: var(--radio-pequeno);
  font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
  border: 1px solid transparent; transition: background 0.15s, border-color 0.15s;
}
.btn:disabled { opacity: 0.6; cursor: progress; }
.btn-primario { background: var(--acento); color: var(--acento-texto); }
.btn-primario:hover:not(:disabled) { background: var(--acento-hover); }
.btn-secundario { background: var(--superficie); color: var(--texto); border-color: var(--borde-fuerte); }
.btn-secundario:hover:not(:disabled) { background: var(--superficie-2); }
.btn-peligro { background: var(--peligro); color: #fff; }
:root[data-tema="oscuro"] .btn-peligro { color: #1a0d0c; }
.btn-peligro-suave { background: var(--peligro-suave); color: var(--peligro); border-color: transparent; }
.btn-enlace { background: none; border: none; color: var(--enlace); text-decoration: underline; padding-inline: 0.25rem; font-weight: 500; }
.btn-pequeno { min-height: 36px; padding: 0.3rem 0.75rem; font-size: 0.9rem; }
.btn-icono {
  display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; border-radius: var(--radio-pequeno);
  background: none; border: none; color: var(--texto); cursor: pointer; font-size: 1.1rem;
}
.btn-icono:hover { background: var(--superficie-2); }
.acciones { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }

/* ── Tarjetas ────────────────────────────────────────────────────────── */
.tarjeta {
  background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio);
  padding: 1.25rem 1.5rem; margin-bottom: 1.25rem; box-shadow: var(--sombra);
}
.tarjeta > :last-child { margin-bottom: 0; }
.tarjeta-cabecera { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
.tarjeta-cabecera h2 { margin: 0; }
.tarjeta-destacada { border-color: var(--acento); background: var(--acento-suave); box-shadow: none; }
.tarjeta-error { border-color: var(--peligro); }
.rejilla-tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.25rem; }
.rejilla-tarjetas .tarjeta { margin: 0; }
.cifra { font-size: 1.8rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.enlace-flecha { font-weight: 600; }
.enlace-flecha::after { content: " →"; }
.lista { padding-left: 1.2rem; margin: 0 0 0.75rem; }
.lista li { margin-bottom: 0.35rem; }
.lista-pasos { margin: 0; padding-left: 1.2rem; }
.lista-pasos li { margin-bottom: 0.4rem; }
.vacio { color: var(--texto-3); font-style: italic; }

.estado { display: inline-block; white-space: nowrap; padding: 0.1rem 0.55rem; border-radius: 999px; font-size: 0.85rem; font-weight: 600; margin-right: 0.35rem; }
.estado-ok { background: var(--ok-fondo); color: var(--ok); }
.estado-aviso { background: var(--aviso-fondo); color: var(--aviso); }

.caja-aviso {
  background: var(--aviso-fondo); border: 1px solid var(--aviso-borde); color: var(--texto);
  border-radius: var(--radio-pequeno); padding: 0.75rem 1rem; margin: 0 0 1rem;
}

/* ── Franjas bajo la cabecera ───────────────────────────────────────── */
.franja { display: flex; align-items: center; justify-content: center; gap: 1rem; flex-wrap: wrap; padding: 0.5rem 1rem; font-size: 0.95rem; border-bottom: 1px solid; }
.franja-aviso { background: var(--aviso-fondo); border-color: var(--aviso-borde); }
.franja-info { background: var(--info-fondo); border-color: var(--info-borde); }

/* ── Formularios ─────────────────────────────────────────────────────── */
.formulario fieldset { border: none; padding: 0; margin: 0 0 1.25rem; }
.formulario legend { font-weight: 700; font-size: 0.95rem; color: var(--texto-2); margin-bottom: 0.5rem; padding: 0; }
.rejilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.25rem 1rem; }
.campo { display: flex; flex-direction: column; margin-bottom: 0.5rem; }
.campo-completo { grid-column: 1 / -1; }
/* Rejilla de 12 columnas para formularios con campos de anchos distintos (p. ej. la

.rejilla-12 { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 0.25rem 1rem; }
.col-2 { grid-column: span 2; } .col-3 { grid-column: span 3; } .col-4 { grid-column: span 4; }
.col-5 { grid-column: span 5; } .col-7 { grid-column: span 7; } .col-12 { grid-column: 1 / -1; }
@media (max-width: 760px) {
  .rejilla-12 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rejilla-12 > .campo { grid-column: span 1; }
  .rejilla-12 > .col-movil-completo, .rejilla-12 > .col-12 { grid-column: 1 / -1; }
}
.vista-previa { grid-column: 1 / -1; background: var(--superficie-2); border-radius: var(--radio-pequeno); padding: 0.6rem 0.9rem; margin-top: 0.25rem; }
.vista-previa strong { display: block; font-size: 0.82rem; color: var(--texto-3); font-weight: 600; }
.vista-previa span { display: block; }
.campo label, .acceso-form label { font-weight: 600; font-size: 0.92rem; margin-bottom: 0.25rem; }
.obligatorio { color: var(--peligro); }
input[type="text"], input[type="email"], input[type="tel"], input[type="url"], input[type="date"],
input[type="password"], input[type="number"], input[type="search"], select, textarea {
  width: 100%; min-height: 44px; padding: 0.55rem 0.7rem;

textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--foco); }
.campo-ayuda { color: var(--texto-3); font-size: 0.85rem; margin: 0.2rem 0 0; }
.campo-error { color: var(--peligro); font-size: 0.85rem; font-weight: 600; margin: 0.2rem 0 0; min-height: 0; }
.campo-error:empty { display: none; }
.con-error input, .con-error select, .con-error textarea { border-color: var(--peligro); }

.grupo-opciones { border: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 0.5rem; }
.grupo-opciones legend { font-weight: 600; margin-bottom: 0.5rem; padding: 0; }
.opcion input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.opcion span { display: inline-block; padding: 0.5rem 1rem; border: 1px solid var(--borde-fuerte); border-radius: var(--radio-pequeno); cursor: pointer; }
.opcion input:checked + span { border-color: var(--acento); background: var(--acento-suave); font-weight: 700; box-shadow: inset 0 0 0 1px var(--acento); }
.opcion input:focus-visible + span { outline: 3px solid var(--foco); outline-offset: 2px; }
.casilla { display: flex; gap: 0.7rem; align-items: flex-start; margin: 0.75rem 0; cursor: pointer; }
.casilla input { width: 20px; height: 20px; margin-top: 0.15rem; flex-shrink: 0; accent-color: var(--acento); }

/* ── Tablas ──────────────────────────────────────────────────────────── */
.tabla-envoltorio { overflow-x: auto; }
.tabla { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
.tabla th, .tabla td { text-align: left; padding: 0.6rem 0.6rem; border-bottom: 1px solid var(--borde); vertical-align: top; }
.tabla thead th { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--texto-3); font-weight: 700; }
.tabla tbody th { font-weight: 600; }
.celda-acciones { text-align: right; white-space: nowrap; width: 1%; }
.historico { margin-top: 1rem; }
.historico summary { cursor: pointer; font-weight: 600; color: var(--texto-2); padding: 0.4rem 0; }

/* ── Diálogos ────────────────────────────────────────────────────────── */
.dialogo {
  width: min(560px, calc(100vw - 2rem)); max-height: calc(100vh - 2rem);
  padding: 0; border: 1px solid var(--borde); border-radius: var(--radio);
  background: var(--superficie); color: var(--texto); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
}
.dialogo::backdrop { background: rgba(10, 15, 12, 0.5); }
.dialogo-cabecera { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem 0.5rem; }
.dialogo-cabecera h2 { margin: 0; }
.dialogo-cuerpo { padding: 0.5rem 1.25rem; overflow-y: auto; }
.dialogo-cuerpo .rejilla { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.dialogo-botones { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.5rem; padding: 0.75rem 1.25rem 1.25rem; }
.dialogo-botones .btn-peligro-suave { margin-right: auto; }

.avisos { position: fixed; right: 1rem; bottom: 1rem; z-index: 200; display: flex; flex-direction: column; gap: 0.5rem; max-width: min(420px, calc(100vw - 2rem)); }
.aviso { padding: 0.75rem 1rem; border-radius: var(--radio-pequeno); background: var(--texto); color: var(--superficie); box-shadow: var(--sombra); font-weight: 500; transition: opacity 0.5s; }
.aviso-error { background: var(--peligro); color: #fff; }
:root[data-tema="oscuro"] .aviso-error { color: #1a0d0c; }
.aviso.saliendo { opacity: 0; }

/* ── Pantalla de acceso ──────────────────────────────────────────────── */
.acceso { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem 1rem; }
.acceso-panel { width: 100%; max-width: 420px; background: var(--superficie); border: 1px solid var(--borde); border-radius: 16px; padding: 2rem 1.75rem; box-shadow: var(--sombra); }
.acceso-logo { width: 48px; height: 48px; margin-bottom: 1rem; }
.acceso-sub { color: var(--texto-2); }
.acceso-opciones { display: flex; flex-direction: column; gap: 0.6rem; margin: 1.25rem 0 0.5rem; }
.acceso-form { display: flex; flex-direction: column; gap: 0.35rem; margin-top: 1rem; }
.acceso-form .btn { margin-top: 0.6rem; }
.acceso-error { color: var(--peligro); font-weight: 600; margin: 0.4rem 0 0; }
.acceso-nota { color: var(--texto-3); font-size: 0.88rem; text-align: center; margin-top: 0.75rem; }
.acceso-olvido { margin-top: 1.25rem; border-top: 1px solid var(--borde); padding-top: 0.75rem; }
.acceso-olvido summary { cursor: pointer; color: var(--texto-2); font-weight: 600; }

/* ── Páginas de listado (socios, cuotas) ───────────────────────────────── */
.cabecera-pagina { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.25rem; }
.cabecera-pagina h1 { margin: 0; }
.miga { font-size: 0.9rem; color: var(--texto-3); margin-bottom: 0.5rem; }
.barra-filtros { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; margin: 1rem 0; }
.barra-filtros label { display: flex; align-items: center; gap: 0.5rem; font-weight: 600; font-size: 0.92rem; }
.barra-filtros select, .barra-filtros input { width: auto; }
.filtro-texto { flex: 1 1 260px; }
.filtro-texto input { width: 100%; }
.tabla .num { text-align: right; font-variant-numeric: tabular-nums; width: 3.5rem; }
.tabla .importe { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

/*
 * webkit_asociaciones — Bóveda: dónde se guarda el bloque CIFRADO en el navegador.
 *
 * Por qué IndexedDB y no localStorage:
 *   · localStorage admite unos 5 MB y solo texto; IndexedDB, cientos de MB y
 *     archivos (útil si algún día se adjuntan facturas o actas en PDF).
 *   · IndexedDB es asíncrono como lo sería una API: no bloquea la página al guardar.
 * Si IndexedDB no está disponible (algún navegador abriendo el archivo con
 * file://, o en modo privado), se usa localStorage como respaldo.
 *
 * Aquí NUNCA llega nada en claro: solo el bloque que devuelve Cripto.cifrar().
 *
 * ATENCIÓN (limitación conocida): el navegador guarda los datos asociados a
 * él mismo y a la ubicación del archivo. Si abres el HTML con otro navegador, o
 * lo mueves de carpeta, puede que aparezca vacío. Los datos no se han perdido:
 * siguen donde estaban, o se recuperan con la copia de seguridad.
 */
(function (raiz) {
  "use strict";

  var BD = "webkit_asociaciones";
  var ALMACEN = "boveda";
  var CLAVE = "datos";
  var CLAVE_LS = "webkit_asociaciones_boveda";

  var abierta = null; // promesa de la base de datos (o null si no hay IndexedDB)

  function abrir() {
    if (abierta) return abierta;
    abierta = new Promise(function (resolver) {
      try {
        if (!raiz.indexedDB) return resolver(null);
        var pet = raiz.indexedDB.open(BD, 1);
        pet.onupgradeneeded = function () { pet.result.createObjectStore(ALMACEN); };
        pet.onsuccess = function () { resolver(pet.result); };
        pet.onerror = function () { resolver(null); };
        pet.onblocked = function () { resolver(null); };
      } catch (e) {
        resolver(null);
      }
    });
    return abierta;
  }

  function operacion(modo, hacer) {
    return abrir().then(function (bd) {
      if (!bd) return { sinIndexedDB: true };
      return new Promise(function (resolver, rechazar) {
        var tx = bd.transaction(ALMACEN, modo);
        var pet = hacer(tx.objectStore(ALMACEN));
        var resultado;
        if (pet) pet.onsuccess = function () { resultado = pet.result; };
        tx.oncomplete = function () { resolver({ valor: resultado }); };
        tx.onerror = function () { rechazar(tx.error || new Error("No se pudo guardar en el navegador.")); };
        tx.onabort = function () { rechazar(tx.error || new Error("El navegador canceló el guardado (¿sin espacio?).")); };
      });
    });
  }

  var ls = {
    leer: function () { try { var s = localStorage.getItem(CLAVE_LS); return s ? JSON.parse(s) : null; } catch (e) { return null; } },
    escribir: function (b) { localStorage.setItem(CLAVE_LS, JSON.stringify(b)); },
    borrar: function () { try { localStorage.removeItem(CLAVE_LS); } catch (e) { /* nada que borrar */ } },
  };

  /** Devuelve el bloque cifrado guardado, o null si no hay datos. */
  async function leer() {
    var r = await operacion("readonly", function (s) { return s.get(CLAVE); });
    if (r.sinIndexedDB) return ls.leer();
    return r.valor || ls.leer(); // por si se guardó con el respaldo en otra ocasión
  }

  async function escribir(bloque) {
    var r = await operacion("readwrite", function (s) { return s.put(bloque, CLAVE); });
    if (r.sinIndexedDB) ls.escribir(bloque);
    else ls.borrar(); // que no quede una versión vieja en el respaldo
  }

  async function borrar() {
    await operacion("readwrite", function (s) { return s.delete(CLAVE); });
    ls.borrar();
  }

  async function hayDatos() {
    return !!(await leer());
  }

  /** Dónde se está guardando, para enseñarlo en Ajustes. */
  async function tipo() {
    return (await abrir()) ? "IndexedDB" : "localStorage";
  }

  /**
   * Pide al navegador que no borre estos datos cuando ande corto de espacio.
   * El navegador puede decir que no; no pasa nada, pero se avisa en Ajustes.
   */
  async function pedirPersistencia() {
    try {

  }

  <script>/* js/datos/sesion.js */
/*
 * webkit_asociaciones — Sesión: abrir, guardar y cerrar los datos.
 *
 * Une las piezas: Cripto (cifrar), Bóveda (guardar en el navegador), Esquema
 * (migrar) y Repositorio (la puerta que usan los módulos).
 *
 * Estados:
 *   · cerrada       no hay datos en memoria; se ve la pantalla de acceso
 *   · abierta       datos reales descifrados en memoria; cada cambio se cifra y se guarda
 *   · demostración  datos inventados en memoria; NADA se guarda
 *
 * Mientras la sesión está abierta, el documento descifrado vive SOLO en memoria.
 * Al bloquear o cerrar, se suelta (y con él la clave).
 */
(function (raiz) {
  "use strict";
  var WA = raiz.WA;

  var estado = { modo: "cerrada", doc: null, llave: null, repo: null };
  var oyentes = [];
  var cola = Promise.resolve();   // los guardados van en fila: nunca dos a la vez
  var pendientes = 0;             // guardados en curso (para avisar si cierras la pestaña)

  function avisar() { oyentes.forEach(function (f) { try { f(estado.modo); } catch (e) { console.error(e); } }); }

  /** Cifra y guarda el documento actual. Se encadena para que no se pisen. */
  function persistir() {
    if (estado.modo !== "abierta") return Promise.resolve();
    var doc = estado.doc, llave = estado.llave;
    pendientes++;
    cola = cola.then(function () {
      return WA.Cripto.cifrar(doc, llave).then(WA.Boveda.escribir);
    }).catch(function (e) {
      console.error(e);
      WA.UI && WA.UI.aviso("No se ha podido guardar en el navegador. Descarga una copia de seguridad ahora.", "error");
    }).then(function () { pendientes--; avisar(); });
    return cola;
  }

  function abrirCon(doc, llave, modo) {
    estado.doc = doc;
    estado.llave = llave;
    estado.modo = modo;
    estado.repo = WA.Repositorio.crearRepositorio(doc, modo === "abierta" ? persistir : null);
    avisar();
  }

  var Sesion = {
    get modo() { return estado.modo; },
    get datos() { return estado.repo; },
    hayGuardadosPendientes: function () { return pendientes > 0; },
    alCambiar: function (f) { oyentes.push(f); },

    /** Primera vez: crea unos datos vacíos protegidos con esta contraseña. */
    crear: async function (contrasena) {
      var llave = await WA.Cripto.crearLlave(contrasena);
      abrirCon(WA.Esquema.documentoVacio(), llave, "abierta");
      await persistir();
      WA.Boveda.pedirPersistencia();
    },

    /** Descifra lo guardado en el navegador. Lanza error si la contraseña falla. */
    desbloquear: async function (contrasena) {
      var bloque = await WA.Boveda.leer();
      if (!bloque) throw new Error("No hay datos guardados en este navegador.");
      var r = await WA.Cripto.descifrar(bloque, contrasena);
      var doc = WA.Esquema.migrar(r.objeto);
      abrirCon(doc, r.llave, "abierta");
      if (doc.esquema !== r.objeto.esquema) await persistir(); // se guardan ya migrados
    },

    /**
     * Recupera una copia de seguridad. Si va cifrada hace falta SU contraseña;
     * a partir de ahí, los datos quedan protegidos con «contrasenaNueva» (que
     * puede ser la misma). Sustituye lo que hubiera en el navegador.
     */
    restaurar: async function (lectura, contrasenaCopia, contrasenaNueva) {
      var objeto;
      if (lectura.cifrada) objeto = (await WA.Cripto.descifrar(lectura.bloque, contrasenaCopia)).objeto;
      else objeto = lectura.documento;
      var doc = WA.Esquema.migrar(objeto);
      // Recién restaurada, la copia ES una copia de seguridad: no hay cambios pendientes.
      doc.meta.cambiosDesdeCopia = 0;
      var llave = await WA.Cripto.crearLlave(contrasenaNueva || contrasenaCopia);
      abrirCon(doc, llave, "abierta");
      await persistir();
      WA.Boveda.pedirPersistencia();
    },

    /** Modo demostración: datos inventados que no se guardan en ningún sitio. */
    demostracion: function () {
      abrirCon(WA.Demo.documentoDemo(), null, "demostración");
    },

    /** Bloquea: suelta datos y clave de la memoria. Lo guardado sigue cifrado. */
    bloquear: async function () {
      await cola;
      estado.doc = null; estado.llave = null; estado.repo = null; estado.modo = "cerrada";
      avisar();
    },

    /** Borra del navegador los datos guardados (no las copias descargadas). */
    borrarDelNavegador: async function () {
      await cola;
      await WA.Boveda.borrar();
    },

    /** Cambia la contraseña: vuelve a cifrar con una sal nueva. */
    cambiarContrasena: async function (actual, nueva) {
      if (estado.modo !== "abierta") throw new Error("No hay una sesión abierta.");
      var bloque = await WA.Boveda.leer();
      await WA.Cripto.descifrar(bloque, actual); // lanza si «actual» no es la buena
      estado.llave = await WA.Cripto.crearLlave(nueva);
      await persistir();
    },

    /**
     * Arma el contenido del archivo de copia. Cifrada: con la llave de la sesión
     * (la misma contraseña). En demostración no hay llave: solo sin cifrar.
     */
    contenidoCopia: async function (cifrada) {
      var doc = await estado.repo.documento();
      if (cifrada) {
        if (!estado.llave) throw new Error("En la demostración la copia no se puede cifrar.");
        return WA.Copia.sobreCifrado(await WA.Cripto.cifrar(doc, estado.llave), doc.asociacion.nombre);
      }
      return WA.Copia.sobreAbierto(doc);
    },
  };

  WA.Sesion = Sesion;

/*
 * webkit_asociaciones — Esqueleto de la aplicación: módulos, navegación y avisos.
 *
 * CÓMO SE AÑADE UN MÓDULO (p. ej. «Socios» en la Fase 2):
 *   1. Crea src/js/modulos/socios.js
 *   2. Dentro, llama a:
 *        WA.App.registrar({
 *          id: "socios",                 // aparece en la dirección: #/socios
 *          titulo: "Socios",             // texto del menú y título de la página
 *          icono: "<path d=…/>",          // trazos SVG de 24×24 (opcional)
 *          orden: 20,                    // posición en el menú
 *          pintar: async function (contenedor, datos, ruta) { … }
 *            // datos = WA.Sesion.datos · ruta = lo que va detrás: #/socios/ficha/7 → ["ficha", "7"]
 *        });
 *   3. Añade su <script> en src/index.html (antes de arranque.js).
 *
 * La navegación usa el «#» de la dirección (#/inicio, #/asociacion…) porque
 * funciona abriendo el archivo directamente, sin servidor.
 */
(function (raiz) {
  "use strict";
  var WA = raiz.WA;
  var modulos = [];
  var actual = null;
  var temporizadorBloqueo = null;

  var $ = function (id) { return document.getElementById(id); };

    modulos.sort(function (a, b) { return (a.orden || 0) - (b.orden || 0); });
  }

  function partesRuta() {
    return (location.hash || "").replace(/^#\/?/, "").split("/").map(function (p) {
      try { return decodeURIComponent(p); } catch (e) { return p; }
    });
  }
  function rutaActual() {
    var id = partesRuta()[0];
    return modulos.some(function (m) { return m.id === id; }) ? id : "inicio";
  }

  function pintarMenu() {
    var lista = $("menu-lista");
    lista.innerHTML = modulos.filter(function (m) { return !m.oculto; }).map(function (m) {
      return '<li><a href="#/' + m.id + '" data-modulo="' + m.id + '">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + (m.icono || "") + "</svg>" +
        "<span>" + WA.UI.esc(m.titulo) + "</span></a></li>";
    }).join("");

  /** Pinta el módulo de la dirección actual. */
  async function navegar(opciones) {
    if (WA.Sesion.modo === "cerrada") return;

    actual = id;
    Array.prototype.forEach.call(document.querySelectorAll("#menu-lista a"), function (a) {

    } catch (e) {

      principal.innerHTML = '<div class="tarjeta tarjeta-error"><h1>Algo ha fallado</h1><p>' + WA.UI.esc(e.message) +

      UI.campo({ nombre: "siglas", etiqueta: "Siglas o nombre corto", valor: a.siglas }) +

      UI.campo({ nombre: "registro", etiqueta: "Registro donde está inscrita", valor: a.registro, ayuda: "Nacional o de tu comunidad autónoma." }) +
      UI.campo({ nombre: "numeroRegistro", etiqueta: "Número de inscripción", valor: a.numeroRegistro }) +
      UI.campo({ nombre: "fechaConstitucion", etiqueta: "Fecha de constitución", tipo: "date", valor: a.fechaConstitucion }) +

      '<fieldset><legend>Contacto y banco</legend><div class="rejilla">' +

      UI.campo({ nombre: "tipoSocioId", etiqueta: "Tipo de socio", tipo: "select", valor: s.tipoSocioId || (tipos[0] || [""])[0], opciones: tipos, clase: "col-5 col-movil-completo" }) +
      UI.campo({ nombre: "fechaAlta", etiqueta: "Fecha de alta", tipo: "date", valor: s.fechaAlta || F.hoy(), requerido: true, clase: "col-4" }) +
      UI.campo({ nombre: "formaPago", etiqueta: "Forma de pago habitual", tipo: "select", valor: s.formaPago, opciones: S.FORMAS_PAGO, clase: "col-4",
        ayuda: "Se propone al cobrar; cada cuota puede pagarse de otra forma." }) +
      '<div class="col-8 col-movil-completo">' + casilla("exentoCuota", s.exentoCuota, "Exento de cuota (no se le emiten cuotas)") + "</div>" +
      "</div>" +
      '<fieldset id="f-sepa"><legend>Domiciliación bancaria</legend><div class="rejilla-12">' +
      UI.campo({ nombre: "iban", etiqueta: "IBAN", valor: s.iban, clase: "col-5 col-movil-completo", atributos: 'autocapitalize="characters" autocomplete="off"' }) +
      UI.campo({ nombre: "titularCuenta", etiqueta: "Titular de la cuenta", valor: s.titularCuenta, clase: "col-7 col-movil-completo", ayuda: "Si no es el propio socio." }) +
      UI.campo({ nombre: "mandatoReferencia", etiqueta: "Referencia del mandato", valor: s.mandatoReferencia, clase: "col-5" }) +
      UI.campo({ nombre: "mandatoFecha", etiqueta: "Fecha de firma del mandato", tipo: "date", valor: s.mandatoFecha, clase: "col-4" }) +
      "</div></fieldset></section>" +

      '<section class="tarjeta"><h2>Protección de datos e imagen</h2><div class="rejilla-12">' +
      UI.campo({ nombre: "proteccionDatos", etiqueta: "Aceptó la política de privacidad el", tipo: "date", valor: cons.proteccionDatos, clase: "col-4",
        ayuda: "Fecha en que firmó o aceptó la información de protección de datos." }) +
      '<div class="col-8 col-movil-completo">' +
      casilla("imagen", cons.imagen, "Autoriza el uso de su imagen (fotos y vídeos de actividades)") +
      casilla("comunicaciones", cons.comunicaciones, "Acepta recibir comunicaciones informativas") + "</div>" +
      "</div><p class=\"detalle\">Qué consentimientos hay que recoger y cómo depende de cada caso: verificar con asesoría.</p></section>" +

      '<section class="tarjeta"><h2>Notas</h2>' +
      UI.campo({ nombre: "notas", etiqueta: "Notas internas", tipo: "textarea", valor: s.notas, ancho: "completo" }) + "</section>" +

      '<div class="acciones barra-guardar"><button type="submit" class="btn btn-primario">' + (s.id ? "Guardar cambios" : "Dar de alta") + "</button>" +
      '<a class="btn btn-secundario" href="#/socios">Volver al listado</a></div>' +
      "</form>";
  }

  function periodicidadTexto(p) {
    return { anual: "al año", semestral: "al semestre", trimestral: "al trimestre", mensual: "al mes" }[p] || "";
  }

  /** Lee el formulario y lo vuelca sobre el socio. */
  function leerFicha(form, s) {
    var d = UI.leerFormulario(form);
    var V = WA.Validar;
    return Object.assign(S.completar(s), {
      nombre: d.nombre, apellidos: d.apellidos, sexo: d.sexo, tipoDocumento: d.tipoDocumento,
      documento: d.tipoDocumento === "Pasaporte" || d.tipoDocumento === "Otro" ? d.documento.toUpperCase() : V.normalizar(d.documento),
      fechaNacimiento: d.fechaNacimiento, ocupacion: d.ocupacion,
      email: d.email, telefono: d.telefono, telefono2: d.telefono2, direccion: WA.FormDireccion.leer(d),
      tutor: { nombre: d.tutorNombre, relacion: d.tutorRelacion, documento: V.normalizar(d.tutorDocumento), telefono: d.tutorTelefono, email: d.tutorEmail },
      tipoSocioId: d.tipoSocioId, fechaAlta: d.fechaAlta, formaPago: d.formaPago, exentoCuota: !!d.exentoCuota,
      iban: V.normalizar(d.iban), titularCuenta: d.titularCuenta, mandatoReferencia: d.mandatoReferencia, mandatoFecha: d.mandatoFecha,
      consentimientos: { proteccionDatos: d.proteccionDatos, imagen: !!d.imagen, comunicaciones: !!d.comunicaciones },
      notas: d.notas,
    });
  }

  var CAMPO_DE = { tutorNombre: "tutorNombre", codigoPostal: "codigoPostal" };

  async function pintarFicha(cont, datos, id) {
    var c = await cargar(datos);
    var s = id ? c.socios.filter(function (x) { return x.id === id; })[0] : S.vacio();
    if (!s) { cont.innerHTML = '<h1>Socio no encontrado</h1><p><a href="#/socios">Volver al listado</a></p>'; return; }
    var nuevo = !s.id;
    if (nuevo) s.formaPago = "Transferencia";
    var e = nuevo ? "activo" : S.estado(s);
    var misCuotas = c.cuotas.filter(function (q) { return q.socioId === s.id; })
      .sort(function (a, b) { return String(b.periodo).localeCompare(String(a.periodo)); });

    cont.innerHTML =
      '<p class="miga"><a href="#/socios">Socios</a> › ' + (nuevo ? "Nuevo" : "N.º " + esc(s.numero)) + "</p>" +
      '<div class="cabecera-pagina"><h1>' + (nuevo ? "Nuevo socio" : esc(S.nombreCompleto(s))) + "</h1>" +
      (!nuevo ? '<span class="estado ' + (e === "baja" ? "estado-neutro" : "estado-ok") + '">' + esc(ESTADO_TEXTO[e]) + "</span>" : "") + "</div>" +
      (e === "baja" ? '<div class="caja-aviso">Dado de baja el <strong>' + esc(F.corta(s.fechaBaja)) + "</strong>" +
        (s.motivoBaja ? " · " + esc(s.motivoBaja) : "") + '. <button type="button" class="btn btn-enlace" id="f-reactivar">Reactivar</button></div>' : "") +
      formularioFicha(s, c) +
      (nuevo ? "" :
        '<section class="tarjeta" aria-labelledby="t-cuotas"><div class="tarjeta-cabecera"><h2 id="t-cuotas">Cuotas</h2></div>' +
        '<div id="f-cuotas">' + WA.CuotasUI.tabla(misCuotas, { conSocio: false }) + "</div></section>" +
        '<section class="tarjeta zona-peligro" aria-labelledby="t-baja"><h2 id="t-baja">Baja y eliminación</h2>' +
        "<p>La <strong>baja</strong> conserva su ficha y su historial en el libro de registro. <strong>Eliminar</strong> borra sus datos personales " +
        "(por ejemplo, si ejerce su derecho de supresión); las cuotas ya pagadas se conservan en la contabilidad con su nombre y número.</p>" +
        '<div class="acciones">' + (e !== "baja" ? '<button type="button" class="btn btn-secundario" id="f-baja">Dar de baja…</button>' : "") +
        '<button type="button" class="btn btn-peligro-suave" id="f-eliminar">Eliminar socio…</button></div></section>');

    var form = cont.querySelector("#f-socio");
    WA.FormDireccion.conectar(form);

    // Mostrar u ocultar lo que depende de otros campos.
    function dependencias() {
      var d = UI.leerFormulario(form);
      var edad = S.edad(d.fechaNacimiento);
      cont.querySelector("#f-edad").textContent = edad !== null ? edad + (edad === 1 ? " año" : " años") : "";
      var menor = edad !== null && edad < S.MAYORIA_EDAD;
      cont.querySelector("#f-tutor").hidden = !menor && !d.tutorNombre;
      cont.querySelector("#f-sepa").hidden = d.formaPago !== "Domiciliación" && !d.iban;
    }
    form.addEventListener("input", dependencias);
    form.addEventListener("change", dependencias);
    dependencias();

    form.addEventListener("submit", async function (ev) {
      ev.preventDefault();
      var socio = leerFicha(form, s);
      var r = S.revisar(socio, c.socios);
      // Limpia y marca errores (impiden guardar) y avisos (no).
      Array.prototype.forEach.call(form.querySelectorAll("[data-campo]"), function (el) { UI.marcarError(form, el.getAttribute("data-campo"), ""); });
      Object.keys(r.avisos).forEach(function (k) { UI.marcarError(form, CAMPO_DE[k] || k, r.avisos[k]); });
      var nAvisos = Object.keys(r.avisos).length + WA.FormDireccion.revisar(form, UI.leerFormulario(form));
      Object.keys(r.errores).forEach(function (k) { UI.marcarError(form, k, r.errores[k]); });
      var errores = Object.keys(r.errores);
      if (errores.length) {
        var primero = form.elements[errores[0]];
        if (primero) primero.focus();
        UI.aviso("Revisa los campos marcados en rojo.", "error");
        return;
      }
      if (nuevo) {
        socio.numero = S.siguienteNumero(c.socios, c.config.siguienteNumeroSocio);
        c.config.siguienteNumeroSocio = socio.numero + 1;
        await datos.escribir("config", c.config);
      }
      var guardado = await datos.guardar("socios", socio);
      UI.aviso((nuevo ? "Alta hecha: socio n.º " + guardado.numero + "." : "Cambios guardados.") +
        (nAvisos ? " Hay avisos en algunos campos; revísalos." : ""), nAvisos ? "info" : "ok");
      if (nuevo) {
        await ofrecerCuotaActual(datos, guardado, c);
        location.hash = "#/socios/ficha/" + encodeURIComponent(guardado.id);
      }
    });

    if (nuevo) return;
    // Tras cobrar o anular una cuota se repinta solo su tabla: así no se pierde lo que se esté editando arriba.
    var zonaCuotas = cont.querySelector("#f-cuotas");
    WA.CuotasUI.conectar(zonaCuotas, datos, async function () {
      var lista = (await datos.listar("cuotas")).filter(function (q) { return q.socioId === s.id; })
        .sort(function (a, b) { return String(b.periodo).localeCompare(String(a.periodo)); });
      zonaCuotas.innerHTML = WA.CuotasUI.tabla(lista, { conSocio: false });
    });
    cont.querySelector("#f-eliminar").addEventListener("click", function () { eliminar(datos, s); });
    var bBaja = cont.querySelector("#f-baja");
    if (bBaja) bBaja.addEventListener("click", function () { darDeBaja(datos, s, c.cuotas); });
    var bReac = cont.querySelector("#f-reactivar");
    if (bReac) bReac.addEventListener("click", async function () {
      if (!(await UI.confirmar("Volverá a figurar como socio activo (se borra la fecha de baja).", { titulo: "Reactivar socio", aceptar: "Reactivar" }))) return;
      await datos.guardar("socios", Object.assign(s, { fechaBaja: "", motivoBaja: "" }));
      UI.aviso("Socio reactivado.");
      WA.App.repintar();
    });
  }

  /** Tras un alta: si ya se emitieron las cuotas del periodo actual, ofrece emitir la suya. */
  async function ofrecerCuotaActual(datos, socio, c) {
    var tipo = (c.config.tiposSocio || []).filter(function (t) { return t.id === socio.tipoSocioId; })[0];
    if (!tipo || !(tipo.cuota > 0) || socio.exentoCuota) return;
    var p = C.periodoDeFecha(tipo.periodicidad, socio.fechaAlta);
    var yaEmitidas = c.cuotas.some(function (q) { return q.periodo === p.clave; });
    if (!yaEmitidas) return;
    var r = C.generar({ periodo: p.clave, socios: [socio], tipos: c.config.tiposSocio, cuotas: c.cuotas });
    if (r.nuevas.length !== 1) return;
    var ok = await UI.confirmar("Las cuotas del " + p.etiqueta + " ya se emitieron. ¿Emitir también la de este socio (" + D.formatear(r.total) + ")?",
      { titulo: "Cuota del periodo actual", aceptar: "Emitir su cuota", cancelar: "Ahora no" });
    if (ok) { await datos.guardar("cuotas", r.nuevas[0]); UI.aviso("Cuota emitida."); }
  }

  async function darDeBaja(datos, s, cuotas) {
    var pendientes = cuotas.filter(function (q) { return q.socioId === s.id && C.debe(q); });
    var r = await UI.dialogo({
      titulo: "Dar de baja a " + S.nombreCompleto(s),
      contenido: '<form class="formulario" novalidate><div class="rejilla">' +
        UI.campo({ nombre: "fechaBaja", etiqueta: "Fecha de baja", tipo: "date", valor: F.hoy(), requerido: true }) +
        UI.campo({ nombre: "motivoBaja", etiqueta: "Motivo", valor: "", lista: ["Voluntaria", "Impago de cuotas", "Fallecimiento", "Expulsión", "Traslado"] }) +
        "</div>" +
        (pendientes.length ? '<label class="casilla"><input type="checkbox" name="anular" checked><span>Anular sus ' + pendientes.length +
          " cuotas pendientes (" + esc(D.formatear(D.sumar(pendientes.map(function (q) { return q.importe; })))) + ")</span></label>" : "") +
        '<p class="detalle">Las causas y el procedimiento de baja los fijan vuestros estatutos.</p></form>',
      botones: [{ texto: "Cancelar", valor: "cancelar" }, { texto: "Dar de baja", valor: "enviar", estilo: "btn-primario" }],
      validar: function (form) {
        var ok = F.esValida(form.elements.fechaBaja.value) && form.elements.fechaBaja.value >= s.fechaAlta;
        UI.marcarError(form, "fechaBaja", ok ? "" : "Pon una fecha válida, posterior al alta.");
        return ok;
      },
    });
    if (r.valor !== "enviar") return;
    await datos.guardar("socios", Object.assign(s, { fechaBaja: r.datos.fechaBaja, motivoBaja: r.datos.motivoBaja }));
    if (r.datos.anular) await datos.guardarVarios("cuotas", pendientes.map(function (q) { return C.anular(q, "Baja del socio"); }));
    UI.aviso("Baja registrada.");
    WA.App.repintar();
  }

  async function eliminar(datos, s) {
    var ok = await UI.confirmar("Se borrarán todos los datos personales de " + S.nombreCompleto(s) + " (n.º " + s.numero + ") y sus cuotas sin pagar. " +
      "Las cuotas pagadas se conservan en la contabilidad. No se puede deshacer (salvo con una copia de seguridad anterior). " +
      "Cuánto tiempo hay que conservar los datos de un socio que se va: verificar con asesoría.",
      { titulo: "Eliminar socio", aceptar: "Eliminar definitivamente", peligro: true });
    if (!ok) return;
    var cuotas = (await datos.listar("cuotas")).filter(function (q) { return q.socioId === s.id && q.estado !== "pagada"; });
    for (var i = 0; i < cuotas.length; i++) await datos.borrar("cuotas", cuotas[i].id);
    await datos.borrar("socios", s.id);
    UI.aviso("Socio eliminado.");
    location.hash = "#/socios";
  }

  // ── Libro de registro (para imprimir) ───────────────────────────────────
  var conBajas = true;
  async function pintarLibro(cont, datos) {
    var c = await cargar(datos);
    var a = c.asociacion;
    function tabla() {
      var lista = S.filtrar(c.socios, { estado: conBajas ? "todos" : "activo" });
      return '<table class="tabla tabla-libro"><thead><tr><th scope="col" class="num">Nº</th><th scope="col">Nombre y apellidos</th><th scope="col">Documento</th>' +
        '<th scope="col">Domicilio</th><th scope="col">Alta</th><th scope="col">Baja</th></tr></thead><tbody>' +
        lista.map(function (s) {
          return '<tr><td class="num">' + esc(s.numero) + "</td><td>" + esc(S.nombreListado(s)) + "</td><td>" + esc(s.documento) + "</td>" +
            "<td>" + esc(WA.Direccion.formatear(s.direccion).completa) + "</td><td>" + esc(F.corta(s.fechaAlta)) + "</td><td>" + esc(F.corta(s.fechaBaja)) + "</td></tr>";
        }).join("") + "</tbody></table>";
    }
    cont.innerHTML =
      '<p class="miga no-imprimir"><a href="#/socios">Socios</a> › Libro de registro</p>' +
      "<h1>Libro de registro de socios</h1>" +
      '<p class="intro">' + esc(a.nombre || "") + (a.nif ? " · NIF " + esc(a.nif) : "") + " · A fecha " + esc(F.larga(F.hoy())) + "</p>" +
      '<div class="acciones no-imprimir"><button type="button" class="btn btn-primario" id="l-imprimir">Imprimir o guardar en PDF</button>' +
      '<label class="casilla"><input type="checkbox" id="l-bajas"' + (conBajas ? " checked" : "") + "><span>Incluir las bajas</span></label></div>" +
      '<p class="detalle no-imprimir">La relación actualizada de socios es obligatoria (Ley Orgánica 1/2002, art. 14). Qué datos debe incluir en vuestro caso: verificar con asesoría.</p>' +
      '<div class="tabla-envoltorio" id="l-tabla">' + tabla() + "</div>";
    cont.querySelector("#l-imprimir").addEventListener("click", function () { window.print(); });
    cont.querySelector("#l-bajas").addEventListener("change", function (e) { conBajas = e.target.checked; cont.querySelector("#l-tabla").innerHTML = tabla(); });
  }

  async function pintar(cont, datos, ruta) {
    if (ruta[0] === "nuevo") return pintarFicha(cont, datos, null);
    if (ruta[0] === "ficha") return pintarFicha(cont, datos, ruta[1]);
    if (ruta[0] === "libro") return pintarLibro(cont, datos);
    return pintarListado(cont, datos);
  }

  WA.App.registrar({
    id: "socios", titulo: "Socios", orden: 20, pintar: pintar,
    icono: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.3c2.1.7 3.5 2.7 3.5 5.7"/>',
  });

  <script>/* js/modulos/cuotas.js */
/*
 * webkit_asociaciones — Módulo «Cuotas».
 *
 *   #/cuotas            cuotas de un periodo: emitirlas (remesa), cobrarlas, anularlas

 *   #/cuotas/tipos      tipos de socio con su cuota y periodicidad

 * También exporta WA.CuotasUI (tabla de cuotas con sus botones), que usa la
 * ficha del socio. La lógica está en logica/cuotas.js, con tests.
 */
(function (raiz) {
  "use strict";
  var WA = raiz.WA, UI = WA.UI, esc = UI.esc, F = WA.Fechas, S = WA.Socios, C = WA.Cuotas, D = WA.Dinero;

  var estadoVista = { periodo: null, estado: "todas", texto: "" };

  var CLASE_ESTADO = { pendiente: "estado-aviso", pagada: "estado-ok", devuelta: "estado-error", anulada: "estado-neutro" };
  var PERIODICIDAD_TEXTO = { anual: "al año", semestral: "al semestre", trimestral: "al trimestre", mensual: "al mes" };

  // ── Tabla de cuotas reutilizable ─────────────────────────────────────────
  /**
   * opciones: { conSocio (columna con el socio), seleccionable (casillas para cobrar varias) }
   * Los botones llevan data-accion y data-id; conectar() se encarga de ellos.
   */
  function tabla(cuotas, opciones) {
    var o = opciones || {};
    if (!cuotas.length) return '<p class="vacio">No hay cuotas.</p>';
    return '<div class="tabla-envoltorio"><table class="tabla"><caption class="sr">Cuotas</caption><thead><tr>' +
      (o.seleccionable ? '<th scope="col" class="celda-casilla"><input type="checkbox" data-todas aria-label="Seleccionar todas las pendientes"></th>' : "") +
      // Con socio (vista de un periodo) el concepto sobra: todas son del mismo periodo.
      (o.conSocio ? '<th scope="col" class="num">Nº</th><th scope="col">Socio</th>' : '<th scope="col">Concepto</th>') +
      '<th scope="col" class="importe">Importe</th><th scope="col">Estado</th><th scope="col">Pago</th>' +
      '<th scope="col"><span class="sr">Acciones</span></th></tr></thead><tbody>' +
      cuotas.map(function (q) {
        var debe = C.debe(q);
        var pago = q.pago ? esc(F.corta(q.pago.fecha)) + " · " + esc(q.pago.forma) : "";
        return "<tr>" +
          (o.seleccionable ? '<td class="celda-casilla">' + (debe ? '<input type="checkbox" data-sel="' + esc(q.id) + '" aria-label="Seleccionar la cuota de ' + esc(q.socioNombre) + '">' : "") + "</td>" : "") +
          (o.conSocio ? '<td class="num">' + esc(q.socioNumero) + '</td><th scope="row">' +
            (q.socioId ? '<a href="#/socios/ficha/' + encodeURIComponent(q.socioId) + '">' + esc(q.socioNombre) + "</a>" : esc(q.socioNombre)) + "</th>"
            : "<td>" + esc(q.concepto) + "</td>") +
          '<td class="importe">' + esc(D.formatear(q.importe)) + "</td>" +
          '<td><span class="estado ' + CLASE_ESTADO[q.estado] + '">' + esc(C.ESTADOS[q.estado]) + "</span></td>" +
          "<td>" + pago + "</td>" +
          '<td class="celda-acciones">' +
          (debe ? '<button type="button" class="btn btn-pequeno btn-primario" data-accion="cobrar" data-id="' + esc(q.id) + '">Cobrar</button> ' : "") +
          '<button type="button" class="btn btn-pequeno btn-secundario" data-accion="mas" data-id="' + esc(q.id) + '" aria-label="Más opciones de la cuota de ' + esc(q.socioNombre) + '">Más…</button>' +
          "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  /** Diálogo de cobro (una o varias cuotas). Devuelve el pago o null. */
  async function pedirPago(cuotas, socio, config) {
    var forma = (socio && socio.formaPago) || "Transferencia";
    var cuentas = (config.cuentas || []).map(function (c) { return [c.id, c.nombre]; });
    var total = D.sumar(cuotas.map(function (q) { return q.importe; }));
    var r = await UI.dialogo({
      titulo: cuotas.length === 1 ? "Cobrar cuota" : "Cobrar " + cuotas.length + " cuotas",
      contenido: "<p>" + (cuotas.length === 1 ? esc(cuotas[0].socioNombre) + " · " + esc(cuotas[0].concepto) : cuotas.length + " cuotas") +
        " · <strong>" + esc(D.formatear(total)) + "</strong></p>" +
        '<form class="formulario" novalidate><div class="rejilla">' +
        UI.campo({ nombre: "fecha", etiqueta: "Fecha del pago", tipo: "date", valor: F.hoy(), requerido: true }) +
        UI.campo({ nombre: "forma", etiqueta: "Forma de pago", tipo: "select", valor: forma, opciones: S.FORMAS_PAGO }) +
        UI.campo({ nombre: "cuentaId", etiqueta: "Dónde entra el dinero", tipo: "select", valor: C.cuentaPorDefecto(forma, config.cuentas), opciones: cuentas }) +
        UI.campo({ nombre: "referencia", etiqueta: "Referencia (opcional)", valor: "", ayuda: "N.º de operación, concepto de la transferencia…" }) +
        "</div></form>",
      botones: [{ texto: "Cancelar", valor: "cancelar" }, { texto: "Marcar como pagada" + (cuotas.length > 1 ? "s" : ""), valor: "enviar", estilo: "btn-primario" }],
      validar: function (form) {
        var ok = F.esValida(form.elements.fecha.value);
        UI.marcarError(form, "fecha", ok ? "" : "Pon la fecha del pago.");
        return ok;
      },
      alAbrir: function (d) {
        // Al cambiar la forma de pago se propone la cuenta que le corresponde (efectivo → caja).
        var f = d.querySelector("form");
        f.elements.forma.addEventListener("change", function () { f.elements.cuentaId.value = C.cuentaPorDefecto(f.elements.forma.value, config.cuentas); });
      },
    });
    return r.valor === "enviar" ? r.datos : null;
  }

  /** Menú «Más…» de una cuota: deshacer pago, devuelta, anular, reactivar, cambiar importe, borrar. */
  async function masOpciones(datos, q) {
    var botones = [{ texto: "Cerrar", valor: "cancelar" }];
    if (q.estado === "pagada") botones.unshift({ texto: "Deshacer el pago", valor: "deshacer" }, { texto: "El banco la devolvió", valor: "devolver" });
    if (q.estado === "pendiente" || q.estado === "devuelta") botones.unshift({ texto: "Cambiar importe…", valor: "importe" }, { texto: "Anular", valor: "anular" });
    if (q.estado === "anulada") botones.unshift({ texto: "Volver a pendiente", valor: "reactivar" }, { texto: "Borrar", valor: "borrar" });
    var historial = (q.historial || []).map(function (h) { return "<li>" + esc(F.corta(h.fecha)) + " · " + esc(h.accion) + (h.detalle ? " · " + esc(h.detalle) : "") + "</li>"; }).join("");
    var r = await UI.dialogo({
      titulo: q.concepto,
      contenido: "<p>" + esc(q.socioNombre) + " · " + esc(D.formatear(q.importe)) + " · " + esc(C.ESTADOS[q.estado]) + "</p>" +
        (q.pago ? '<p class="detalle">Pagada el ' + esc(F.corta(q.pago.fecha)) + " por " + esc(q.pago.forma) + (q.pago.referencia ? " · " + esc(q.pago.referencia) : "") + "</p>" : "") +
        (historial ? '<details class="historico"><summary>Historial</summary><ul class="lista">' + historial + "</ul></details>" : ""),
      botones: botones,
    });
    var v = r.valor;
    if (v === "deshacer") await datos.guardar("cuotas", C.deshacerPago(q));
    else if (v === "devolver") await datos.guardar("cuotas", C.devolver(q, F.hoy(), "Devolución bancaria"));
    else if (v === "anular") {
      if (!(await UI.confirmar("La cuota dejará de contar como deuda. Se puede volver a poner como pendiente.", { titulo: "Anular cuota", aceptar: "Anular" }))) return false;
      await datos.guardar("cuotas", C.anular(q, ""));
    } else if (v === "reactivar") await datos.guardar("cuotas", C.reactivar(q));
    else if (v === "borrar") {
      if (!(await UI.confirmar("Se borrará la cuota anulada. Si solo quieres que no cuente, basta con dejarla anulada.", { titulo: "Borrar cuota", aceptar: "Borrar", peligro: true }))) return false;
      await datos.borrar("cuotas", q.id);
    } else if (v === "importe") {
      var ri = await UI.dialogo({
        titulo: "Cambiar importe",
        contenido: '<form class="formulario" novalidate>' +
          UI.campo({ nombre: "importe", etiqueta: "Importe (€)", valor: D.formatear(q.importe, { simbolo: false }), atributos: 'inputmode="decimal"',
            ayuda: "Por ejemplo, para prorratear a quien entra a mitad de periodo." }) +
          UI.campo({ nombre: "motivo", etiqueta: "Motivo", valor: "" }) + "</form>",
        botones: [{ texto: "Cancelar", valor: "cancelar" }, { texto: "Guardar", valor: "enviar", estilo: "btn-primario" }],
        validar: function (form) {
          var c = D.desdeTexto(form.elements.importe.value);
          var ok = c !== null && c > 0;
          UI.marcarError(form, "importe", ok ? "" : "Escribe un importe mayor que cero (p. ej. 15,00).");
          return ok;
        },
      });
      if (ri.valor !== "enviar") return false;
      var nueva = JSON.parse(JSON.stringify(q));
      var antes = q.importe;
      nueva.importe = D.desdeTexto(ri.datos.importe);
      nueva.historial = (nueva.historial || []).concat([{ fecha: F.hoy(), accion: "importe cambiado",
        detalle: D.formatear(antes) + " → " + D.formatear(nueva.importe) + (ri.datos.motivo ? " · " + ri.datos.motivo : "") }]);
      await datos.guardar("cuotas", nueva);
    } else return false;
    UI.aviso("Cuota actualizada.");
    return true;
  }

  /** Conecta los botones de una tabla de cuotas. alTerminar() se llama tras cualquier cambio. */
  function conectar(contenedor, datos, alTerminar) {
    contenedor.addEventListener("click", async function (e) {
      var b = e.target.closest("[data-accion]");
      if (!b) return;
      var q = await datos.obtener("cuotas", b.getAttribute("data-id"));
      if (!q) return;
      var cambio = false;
      if (b.getAttribute("data-accion") === "cobrar") {
        var config = await datos.leer("config");
        var socio = q.socioId ? await datos.obtener("socios", q.socioId) : null;
        var pago = await pedirPago([q], socio, config);
        if (pago) {
          try { await datos.guardar("cuotas", C.registrarPago(q, pago)); cambio = true; UI.aviso("Cuota cobrada."); }
          catch (err) { UI.aviso(err.message, "error"); }
        }
      } else cambio = await masOpciones(datos, q);
      if (cambio && alTerminar) alTerminar();
    });
  }

  WA.CuotasUI = { tabla: tabla, conectar: conectar };

  // ── Pestañas del módulo ─────────────────────────────────────────────────
  function pestanas(actual) {
    var p = [["", "Cuotas"], ["impagados", "Impagados"], ["tipos", "Tipos de socio"]];
    return '<nav class="pestanas" aria-label="Apartados de cuotas">' + p.map(function (x) {
      return '<a href="#/cuotas' + (x[0] ? "/" + x[0] : "") + '"' + (actual === x[0] ? ' aria-current="page"' : "") + ">" + x[1] + "</a>";
    }).join("") + "</nav>";
  }

  async function cargar(datos) {
    var r = await Promise.all([datos.listar("socios"), datos.listar("cuotas"), datos.leer("config"), datos.listar("remesas")]);
    return { socios: r[0].map(S.completar), cuotas: r[1], config: r[2], remesas: r[3] };
  }

  /** Periodos que tiene sentido ofrecer: los de los tipos de socio activos (año anterior, actual y siguiente) y los que ya tienen cuotas. */
  function periodosDisponibles(c) {
    var anio = +F.hoy().slice(0, 4), claves = {};
    var periodicidades = {};
    (c.config.tiposSocio || []).forEach(function (t) { if (t.activo !== false && t.cuota > 0) periodicidades[t.periodicidad || "anual"] = true; });
    if (!Object.keys(periodicidades).length) periodicidades.anual = true;
    Object.keys(periodicidades).forEach(function (p) {
      [anio - 1, anio, anio + 1].forEach(function (a) { C.periodosDelAnio(p, a).forEach(function (x) { claves[x.clave] = x; }); });
    });
    c.cuotas.forEach(function (q) { var p = C.periodo(q.periodo); if (p) claves[p.clave] = p; });
    // Del año más reciente al más antiguo; dentro de cada año, el año entero primero y luego sus partes en orden.
    var orden = { anual: 0, semestral: 1, trimestral: 2, mensual: 3 };
    return Object.keys(claves).map(function (k) { return claves[k]; }).sort(function (a, b) {
      return b.anio - a.anio || orden[a.periodicidad] - orden[b.periodicidad] || a.inicio.localeCompare(b.inicio);
    });
  }
  function periodoPorDefecto(c) {
    var t = (c.config.tiposSocio || []).filter(function (x) { return x.activo !== false && x.cuota > 0; })[0];
    return C.periodoDeFecha((t && t.periodicidad) || "anual", F.hoy()).clave;
  }

  // ── Cuotas de un periodo ────────────────────────────────────────────────
  async function pintarPeriodo(cont, datos) {
    var c = await cargar(datos);
    var periodos = periodosDisponibles(c);
    if (!estadoVista.periodo) estadoVista.periodo = periodoPorDefecto(c);
    var p = C.periodo(estadoVista.periodo);
    var delPeriodo = c.cuotas.filter(function (q) { return q.periodo === p.clave; })
      .sort(function (a, b) { return (a.socioNumero || 0) - (b.socioNumero || 0); });
    var res = C.resumen(delPeriodo);
    var sinCuota = (c.config.tiposSocio || []).every(function (t) { return !(t.cuota > 0); });

    cont.innerHTML =
      '<div class="cabecera-pagina"><h1>Cuotas</h1></div>' + pestanas("") +
      (sinCuota ? '<div class="caja-aviso">Ningún tipo de socio tiene cuota todavía. <a href="#/cuotas/tipos">Ponle importe a la cuota</a> para poder emitirlas.</div>' : "") +
      '<div class="barra-filtros"><label>Periodo <select id="q-periodo">' + periodos.map(function (x) {
        return '<option value="' + esc(x.clave) + '"' + (x.clave === p.clave ? " selected" : "") + ">" + esc(x.etiqueta.charAt(0).toUpperCase() + x.etiqueta.slice(1)) + "</option>";
      }).join("") + "</select></label>" +
      '<button type="button" class="btn btn-primario" id="q-emitir"' + (sinCuota ? " disabled" : "") + ">Emitir cuotas de este periodo…</button></div>" +
      '<div class="rejilla-tarjetas cifras">' +
      cifra("Emitido", res.emitido, res.nPagadas + res.nPendientes + " cuotas") +
      cifra("Cobrado", res.cobrado, res.nPagadas + " pagadas") +
      cifra("Pendiente", res.pendiente, res.nPendientes + " sin cobrar") +
      '<section class="tarjeta"><h2>Por forma de pago</h2>' + (Object.keys(res.porForma).length ? '<ul class="lista-cifras">' +
        Object.keys(res.porForma).map(function (f) { return "<li><span>" + esc(f) + "</span><strong>" + esc(D.formatear(res.porForma[f])) + "</strong></li>"; }).join("") + "</ul>"
        : '<p class="detalle">Nada cobrado todavía.</p>') + "</section></div>" +
      '<div class="barra-filtros"><label class="filtro-texto"><span class="sr">Buscar socio</span><input type="search" id="q-buscar" placeholder="Buscar socio…" value="' + esc(estadoVista.texto) + '"></label>' +
      '<label><span class="sr">Estado</span><select id="q-estado">' + [["todas", "Todas"], ["debe", "Sin cobrar"], ["pagada", "Pagadas"], ["anulada", "Anuladas"]].map(function (o) {
        return '<option value="' + o[0] + '"' + (estadoVista.estado === o[0] ? " selected" : "") + ">" + o[1] + "</option>";
      }).join("") + "</select></label>" +
      '<button type="button" class="btn btn-secundario" id="q-cobrar-sel" disabled>Cobrar seleccionadas</button>' +
      '<button type="button" class="btn btn-secundario" id="q-exportar">Exportar (CSV)</button></div>' +
      '<div id="q-tabla"></div>';

    function visibles() {
      var t = estadoVista.texto.trim().toLowerCase();
      return delPeriodo.filter(function (q) {
        if (estadoVista.estado === "debe" && !C.debe(q)) return false;
        if (estadoVista.estado !== "todas" && estadoVista.estado !== "debe" && q.estado !== estadoVista.estado) return false;
        return !t || (q.socioNombre + " " + q.socioNumero).toLowerCase().indexOf(t) >= 0;
      });
    }
    var zona = cont.querySelector("#q-tabla");
    var bSel = cont.querySelector("#q-cobrar-sel");
    function refrescar() {
      zona.innerHTML = delPeriodo.length ? tabla(visibles(), { conSocio: true, seleccionable: true })
        : '<p class="vacio">Todavía no se han emitido las cuotas de este periodo. Pulsa «Emitir cuotas de este periodo».</p>';
      bSel.disabled = true;
    }
    refrescar();
    conectar(zona, datos, function () { WA.App.repintar(); });
    zona.addEventListener("change", function (e) {
      if (e.target.hasAttribute("data-todas")) {
        zona.querySelectorAll("[data-sel]").forEach(function (x) { x.checked = e.target.checked; });
      }
      bSel.disabled = !zona.querySelector("[data-sel]:checked");
      var n = zona.querySelectorAll("[data-sel]:checked").length;
      bSel.textContent = n ? "Cobrar seleccionadas (" + n + ")" : "Cobrar seleccionadas";
    });
    bSel.addEventListener("click", async function () {
      var ids = Array.prototype.map.call(zona.querySelectorAll("[data-sel]:checked"), function (x) { return x.getAttribute("data-sel"); });
      var elegidas = delPeriodo.filter(function (q) { return ids.indexOf(q.id) >= 0; });
      var pago = await pedirPago(elegidas, null, c.config);
      if (!pago) return;
      await datos.guardarVarios("cuotas", elegidas.map(function (q) { return C.registrarPago(q, pago); }));
      UI.aviso(elegidas.length + " cuotas cobradas.");
      WA.App.repintar();
    });
    cont.querySelector("#q-periodo").addEventListener("change", function (e) { estadoVista.periodo = e.target.value; WA.App.repintar(); });
    cont.querySelector("#q-buscar").addEventListener("input", function (e) { estadoVista.texto = e.target.value; refrescar(); });
    cont.querySelector("#q-estado").addEventListener("change", function (e) { estadoVista.estado = e.target.value; refrescar(); });
    cont.querySelector("#q-emitir").addEventListener("click", function () { emitir(datos, c, p); });
    cont.querySelector("#q-exportar").addEventListener("click", function () { exportarCuotas(visibles(), c.config, "cuotas-" + p.clave); });
  }

  function cifra(titulo, centimos, detalle) {
    return '<section class="tarjeta"><h2>' + esc(titulo) + '</h2><p class="cifra">' + esc(D.formatear(centimos)) + '</p><p class="detalle">' + esc(detalle) + "</p></section>";
  }

  async function emitir(datos, c, p) {
    var remesaId = WA.Esquema.nuevoId();
    var r = C.generar({ periodo: p.clave, socios: c.socios, tipos: c.config.tiposSocio, cuotas: c.cuotas, fechaEmision: F.hoy(), remesaId: remesaId });
    // Los omitidos se agrupan por motivo; «otra periodicidad» no se enseña, no aporta.
    var porMotivo = {};
    r.omitidos.forEach(function (o) {
      if (o.motivo === "otraPeriodicidad") return;
      (porMotivo[o.texto] = porMotivo[o.texto] || []).push(o.socio);
    });
    var omitidosHtml = Object.keys(porMotivo).map(function (m) {
      return "<li><strong>" + esc(m) + "</strong>: " + porMotivo[m].length + " (" +
        esc(porMotivo[m].slice(0, 8).map(function (s) { return S.nombreCompleto(s); }).join(", ")) + (porMotivo[m].length > 8 ? "…" : "") + ")</li>";
    }).join("");
    if (!r.nuevas.length) {
      await UI.dialogo({ titulo: "Nada que emitir", contenido: "<p>No hay cuotas nuevas para el " + esc(p.etiqueta) + ".</p>" +
        (omitidosHtml ? '<ul class="lista">' + omitidosHtml + "</ul>" : ""), botones: [{ texto: "Entendido", valor: "cancelar", estilo: "btn-primario" }] });
      return;
    }
    var res = await UI.dialogo({
      titulo: "Emitir cuotas del " + p.etiqueta,
      contenido: "<p>Se emitirán <strong>" + r.nuevas.length + " cuotas</strong> por un total de <strong>" + esc(D.formatear(r.total)) + "</strong>, todas pendientes de cobro.</p>" +
        (omitidosHtml ? '<details class="historico"><summary>Socios a los que no se emite</summary><ul class="lista">' + omitidosHtml + "</ul></details>" : "") +
        '<p class="detalle">A quien entra a mitad de periodo se le emite la cuota entera; si queréis prorratear, cambiad su importe después («Más…» → «Cambiar importe»).</p>',
      botones: [{ texto: "Cancelar", valor: "cancelar" }, { texto: "Emitir " + r.nuevas.length + " cuotas", valor: "emitir", estilo: "btn-primario" }],
    });
    if (res.valor !== "emitir") return;
    await datos.guardarVarios("cuotas", r.nuevas);
    await datos.guardar("remesas", { id: remesaId, periodo: p.clave, fechaEmision: F.hoy(), concepto: "Cuotas " + p.etiqueta, nCuotas: r.nuevas.length, total: r.total });
    UI.aviso(r.nuevas.length + " cuotas emitidas.");
    WA.App.repintar();
  }

  async function exportarCuotas(lista, config, nombre) {
    var cuentas = {};
    (config.cuentas || []).forEach(function (c) { cuentas[c.id] = c.nombre; });
    var columnas = [
      { titulo: "Nº socio", clave: "socioNumero" }, { titulo: "Socio", clave: "socioNombre" },
      { titulo: "Periodo", clave: "periodo" }, { titulo: "Concepto", clave: "concepto" },
      { titulo: "Importe (€)", valor: function (q) { return D.formatear(q.importe, { simbolo: false }); } },
      { titulo: "Estado", valor: function (q) { return C.ESTADOS[q.estado]; } },
      { titulo: "Emitida", valor: function (q) { return F.corta(q.fechaEmision); } },
      { titulo: "Fecha de pago", valor: function (q) { return q.pago ? F.corta(q.pago.fecha) : ""; } },
      { titulo: "Forma de pago", valor: function (q) { return q.pago ? q.pago.forma : ""; } },
      { titulo: "Cuenta", valor: function (q) { return q.pago ? cuentas[q.pago.cuentaId] || "" : ""; } },
      { titulo: "Referencia", valor: function (q) { return q.pago ? q.pago.referencia : ""; } },
    ];
    UI.descargar(nombre + "-" + F.hoy() + ".csv", WA.CSV.escribir(columnas, lista), "text/csv;charset=utf-8");
  }

            '<td class="importe">' + esc(D.formatear(d.total)) + "</td>" +

        }).join("") + "</tbody></table></div>" +

        '<button type="button" class="btn btn-secundario" id="i-exportar">Exportar (CSV)</button></div>' +

    if (!deud.length) return;
    cont.querySelector("#i-correos").addEventListener("click", async function () {

  }

  // ── Tipos de socio ──────────────────────────────────────────────────────
  async function editarTipo(datos, config, socios, tipo) {

    var enUso = tipo ? socios.filter(function (s) { return s.tipoSocioId === tipo.id; }).length : 0;
    var r = await UI.dialogo({

        UI.campo({ nombre: "cuota", etiqueta: "Cuota ordinaria (€)", valor: D.formatear(t.cuota, { simbolo: false }), atributos: 'inputmode="decimal"', ayuda: "0 si no paga cuota." }) +
        UI.campo({ nombre: "periodicidad", etiqueta: "Se paga", tipo: "select", valor: t.periodicidad, opciones: C.PERIODICIDADES }) +

/*
 * webkit_asociaciones — Módulo «Copia de seguridad».
 *
 * La copia de seguridad es lo más importante de la aplicación: los datos viven
 * en un navegador, y un navegador se puede borrar, cambiar o estropear. Una
 * copia descargada (y guardada en otro sitio) es lo único que lo protege.

    var sesion = WA.Sesion;
    if (sesion.modo === "demostración" && cifrada) cifrada = false;
    var sobre = await sesion.contenidoCopia(cifrada);
    var nombre = WA.Copia.nombreArchivo(sobre.asociacion, WA.Fechas.hoy(), cifrada);
