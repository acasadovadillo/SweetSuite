# Tests de la lógica y comprobación de que dist/ está al día con src/.
# Usa solo los datos de demostración: nunca ve datos reales.
name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests
        run: npm test
      - name: dist/ está al día
        run: node tools/build.mjs --comprobar
