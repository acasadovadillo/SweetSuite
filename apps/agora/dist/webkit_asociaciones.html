  <script>/* js/nucleo/tema.js */
/*
 * webkit_asociaciones — Tema (claro, oscuro o el del sistema) y color de acento.
 *
 * Se carga en <head>, ANTES que el CSS, a propósito: si se aplicara después de
 * pintar, quien use el tema oscuro vería un fogonazo blanco en cada carga.
 * El tema es una preferencia del dispositivo (no un dato de la asociación), así
 * que vive en localStorage, fuera de los datos cifrados.
 *
 * El acento es el sistema de Ironrack y Solvento: la paleta de OpenClaw más el
 * verde de ABIES, que es el de siempre. Es de cada usuario y va en los datos
 * cifrados (config.acentos[id del usuario]); lo aplica app.js al entrar, y al
 * salir se vuelve al verde: la pantalla de acceso aún no sabe quién entra.
 * Con un acento elegido, el botón principal lleva el acento oscurecido hasta
 * que el texto blanco se lee (4,5:1), y en el tema claro también el acento,
 * para que se lea sobre blanco.
 *
 * Adaptado de tema.js de Solvento.
 */
(function () {
  "use strict";
  var CLAVE = "webkit_asociaciones_tema";
  var VALIDOS = ["auto", "claro", "oscuro"];
  var sistema = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

  function guardado() {
    try { var v = localStorage.getItem(CLAVE); return VALIDOS.indexOf(v) >= 0 ? v : "auto"; }
    catch (e) { return "auto"; }
  }
  function efectivo(pref) {
    return pref === "auto" ? (sistema && sistema.matches ? "oscuro" : "claro") : pref;
  }
  function aplicar() {
    document.documentElement.setAttribute("data-tema", efectivo(guardado()));
  }
  function poner(pref) {
    if (VALIDOS.indexOf(pref) < 0) pref = "auto";
    try { localStorage.setItem(CLAVE, pref); } catch (e) { /* sin almacenamiento: dura la sesión */ }
    aplicar();
  }

  // ── Color de acento ──────────────────────────────────────────────────────
  // La paleta de «Color de acento» de OpenClaw (la de Ironrack y Solvento).
  // El verde de ABIES no está aquí: es el de tokens.css, sin acento elegido.
  var ACENTOS = [
    { nombre: "Coral", color: "#ff5c5c" },
    { nombre: "Salmón", color: "#ff8067" },
    { nombre: "Ámbar", color: "#f6b94b" },
    { nombre: "Menta", color: "#50c99c" },
    { nombre: "Turquesa", color: "#31b9b0" },
    { nombre: "Azul", color: "#599cf3" },
    { nombre: "Lavanda", color: "#a78bf7" },
    { nombre: "Rosa", color: "#f572b4" },
    { nombre: "Pizarra", color: "#8795a7" },
  ];
  var valido = function (c) { return /^#[0-9a-f]{6}$/i.test(String(c || "")); };

  var rgb = function (c) { return [1, 3, 5].map(function (i) { return parseInt(c.slice(i, i + 2), 16); }); };
  var hex = function (v) { return "#" + v.map(function (x) { return ("0" + Math.round(x).toString(16)).slice(-2); }).join(""); };
  /** Un color al tanto por uno sobre un fondo: los tonos del elemento activo. */
  function mezcla(c, fondo, cuanto) {
    var a = rgb(c), b = rgb(fondo);
    return hex(a.map(function (x, i) { return b[i] + (x - b[i]) * cuanto; }));
  }
  // Luminancia relativa (WCAG): texto blanco encima salvo en los acentos claros.
  function luminancia(c) {
    var v = rgb(c).map(function (x) { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); });
    return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  }
  var textoSobre = function (c) { return luminancia(c) > 0.4 ? "#0e1015" : "#ffffff"; };
  /** Oscurecido hasta 4,5:1 con el blanco (con el coral, el #d23c3c de OpenClaw). */
  function boton(c) {
    if (c === "#ff5c5c") return "#d23c3c";
    var v = rgb(c), r = c;
    for (var i = 0; i < 60 && 1.05 / (luminancia(r) + 0.05) < 4.5; i++) {
      v = v.map(function (x) { return x * 0.97; });
      r = hex(v);
    }
    return r;
  }

  /** Aplica un acento («» o null: el verde de ABIES). Devuelve el que queda. */
  function acento(color) {
    var viejo = document.getElementById("acento-usuario");
    if (viejo) viejo.remove();
    if (!valido(color)) return "";
    var c = color.toLowerCase(), b = boton(c);
    var oscuro = "--acento:" + c + ";--acento-hover:" + mezcla("#ffffff", c, 0.15) + ";--acento-texto:" + textoSobre(c) +
      ";--acento-suave:" + mezcla(c, "#0e1015", 0.11) + ";--acento-linea:" + mezcla(c, "#0e1015", 0.25) +
      ";--primario:" + b + ";--primario-texto:" + textoSobre(b) + ";";
    var claro = "--acento:" + b + ";--acento-hover:" + mezcla("#000000", b, 0.15) + ";--acento-texto:" + textoSobre(b) +
      ";--acento-suave:" + mezcla(c, "#ffffff", 0.105) + ";--acento-linea:" + mezcla(c, "#ffffff", 0.32) +
      ";--primario:" + b + ";--primario-texto:" + textoSobre(b) + ";";
    var s = document.createElement("style");
    s.id = "acento-usuario";
    s.textContent = ":root{" + oscuro + "}:root[data-tema=\"claro\"]{" + claro + "}";
    document.head.appendChild(s);
    return c;
  }

  aplicar();
  if (sistema && sistema.addEventListener) sistema.addEventListener("change", aplicar);

  window.WA = window.WA || {};
  window.WA.Tema = { poner: poner, actual: guardado, VALIDOS: VALIDOS, ACENTOS: ACENTOS, acento: acento, valido: valido };
})();

  <style>/* css/tokens.css */
/*
 * webkit_asociaciones — Colores y medidas (tokens).
 *
 * Todo el CSS usa estas variables, nunca colores sueltos: así cada tema es solo
 * redefinirlas. tema.js pone data-tema="claro" u "oscuro" en <html>.
 *
 * La estética es la común de Ironrack y Solvento, que viene de la app de
 * OpenClaw (medida sobre sus capturas): fondo #0e1015, tarjetas #161920 con
 * borde #1c1f27, texto #f4f4f5 y secundario #8b8b94, radios de 12, 10 y 8,
 * títulos de página en el acento, fuente Albert Sans (incrustada en
 * fuentes.css) y el botón principal en el acento oscurecido hasta que el texto
 * blanco se lea (4,5:1). El tema claro es el de Solvento.
 *
 * El acento por defecto es el verde de ABIES (#004b49; aclarado en el tema
 * oscuro para que se lea) y cada usuario puede elegir otro en Ajustes ›
 * Apariencia (tema.js lo aplica). El naranja del logotipo no cambia. El nombre
 * de cada variable dice para qué sirve, no de qué color es.
 *
 * Contraste: los textos cumplen AA (4,5:1) sobre los fondos en los dos temas.
 */
:root {
  /* Fondos, de la página a lo que flota encima */
  --fondo: #0e1015;
  --hundido: #14161d;          /* campos de formulario, buscador, pistas */
  --superficie-flotante: #161920; /* diálogos, menús */
  --superficie: #161920;       /* paneles y tarjetas */
  --superficie-2: #191c24;     /* botón secundario, al pasar el ratón */
  --pista: #101218;            /* selectores segmentados y desplegables */
  /* Bordes */
  --borde-suave: #1b1d25;      /* separadores dentro de una tarjeta */
  --borde: #1c1f27;
  --borde-control: #1e2028;    /* el del botón secundario */
  --borde-fuerte: #2f3033;
  --filo: #1a1c22;             /* el de la barra lateral */
  /* Texto */
  --titulo: #f4f4f5;
  --texto: #f4f4f5;
  --texto-2: #b4b4bc;
  --texto-3: #8b8b94;
  --icono: #696972;
  /* Acción principal: el acento oscurecido hasta 4,5:1 con texto blanco */
  --primario: #2e8276;
  --primario-texto: #ffffff;
  /* Acento (selección, foco, gráficas, enlaces, títulos de página) */
  --acento: #3fb0a0;            /* verde ABIES aclarado (6,3:1 sobre las tarjetas) */
  --acento-hover: #5cc2b4;
  --acento-texto: #0e1015;
  --acento-suave: #132224;      /* fondo del elemento activo: el acento al 11 % */
  --acento-linea: #1a3838;      /* su borde: al 25 % */
  --enlace: var(--acento);
  --foco: var(--acento);
  --naranja: #e6431f;           /* el del logotipo de ABIES */
  --abies: #3fb0a0;             /* la muestra del acento de siempre en Ajustes */
  /* Con significado */
  --peligro: #ff5c5c;
  --peligro-fuerte: #d23c3c;
  --peligro-suave: #2a1619;
  --aviso: #f6b94b;
  --aviso-fondo: #2a2109;
  --aviso-borde: #5c4712;
  --info-fondo: #161920;
  --info-borde: #1c1f27;
  --ok: #1bc565;
  --ok-fondo: #0f2a1c;
  /* Globos y avisos flotantes */
  --globo: #161920;
  --globo-texto: #f4f4f5;
  /* Logotipo */
  --marca-fondo: #004b49;
  --marca-trazo: #ffffff;
  --sombra: none;
  --sombra-flotante: 0 10px 30px rgba(0, 0, 0, 0.5);
  --velo: rgba(0, 0, 0, 0.6);

  --radio: 12px;               /* paneles */
  --radio-grande: 12px;        /* tarjeta destacada */
  --radio-medio: 12px;         /* elementos dentro de un panel */
  --radio-dialogo: 16px;       /* diálogos y hojas */
  --radio-pequeno: 10px;       /* campos y botones */
  --radio-menu: 8px;           /* elementos del menú */
  --ancho-menu: 288px;
  --alto-cabecera: 64px;
  --alto-barra-movil: 60px;
  --fuente: "Albert Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --fuente-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --contorno: #ffffff;         /* las curvas de nivel del fondo (muy tenues) */
  color-scheme: dark;
}

:root[data-tema="claro"] {
  --fondo: #f6f6f7;
  --hundido: #f1f1f3;
  --superficie-flotante: #ffffff;
  --superficie: #ffffff;
  --superficie-2: #efeff1;
  --pista: #f1f1f3;
  --borde-suave: #ebebee;
  --borde: #e6e6e9;
  --borde-control: #dcdce0;
  --borde-fuerte: #c4c4ca;
  --filo: #e6e6e9;
  --titulo: #0e1015;
  --texto: #16181f;
  --texto-2: #45464e;
  --texto-3: #6b6c75;
  --icono: #9a9ba3;
  --primario: #004b49;
  --primario-texto: #ffffff;
  --acento: #004b49;            /* verde ABIES */
  --acento-hover: #0b6b67;
  --acento-texto: #ffffff;
  --acento-suave: #e4ecec;
  --acento-linea: #adc5c5;
  --naranja: #e6431f;
  --abies: #004b49;
  --peligro: #b91c1c;
  --peligro-fuerte: #dc2626;
  --peligro-suave: #fee2e2;
  --aviso: #92400e;
  --aviso-fondo: #fef3c7;
  --aviso-borde: #f2c96b;
  --info-fondo: #ffffff;
  --info-borde: #e6e6e9;
  --ok: #047857;
  --ok-fondo: #d1fae5;
  --globo: #ffffff;
  --globo-texto: #0e1015;
  --marca-fondo: #004b49;
  --marca-trazo: #ffffff;
  --sombra-flotante: 0 10px 30px rgba(15, 20, 35, 0.16);
  --velo: rgba(15, 20, 35, 0.45);
  --contorno: #0e1015;
  color-scheme: light;
}
</style>
  <style>/* css/fondo.css */
/*
 * webkit_asociaciones — Las curvas de nivel del fondo (las de Ironrack y Solvento).
 *
 * Van incrustadas para no cargar nada de fuera. Son trazos opacos porque se

  <style>/* css/base.css */
/*
 * webkit_asociaciones — Base: tipografía, estructura y adaptación a móvil.
 *
 * La estructura es la común de Ironrack y Solvento, con sus medidas:
 *   - barra lateral de 288 px: marca, título, la cuenta, un buscador, las
 *     secciones por grupos y, abajo, el estado de la copia y la versión;
 *   - fija a partir de 1.024 px; por debajo, un cajón que se abre con la
 *     hamburguesa de la barra de arriba (64 px);
 *   - en el teléfono (hasta 640 px), cinco secciones abajo, con icono.
 */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--fondo);
  color: var(--texto);
  font-family: var(--fuente);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
h1, h2, h3 { line-height: 1.25; margin: 0 0 0.5rem; color: var(--titulo); }
/* El título de cada página, en el acento, como en Ironrack y Solvento. */
h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: var(--acento); }
h2 { font-size: 1.1rem; font-weight: 700; }
h3 { font-weight: 700; }
p { margin: 0 0 0.75rem; }
a { color: var(--enlace); text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
strong { color: var(--titulo); }
[hidden] { display: none !important; }

/* El foco siempre visible al navegar con teclado. */
:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; border-radius: 6px; }
h1:focus { outline: none; }

/* Solo para lectores de pantalla. */
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.saltar { position: absolute; left: 0.5rem; top: -3rem; background: var(--primario); color: var(--primario-texto); padding: 0.5rem 1rem; border-radius: var(--radio-pequeno); z-index: 100; font-weight: 700; }
.saltar:focus { top: 0.5rem; }

/* Las curvas de nivel del fondo, las mismas que en Ironrack y Solvento. El
   dibujo va incrustado (la aplicación no carga nada de fuera) y se usa de
   máscara: el color, muy tenue, lo pone el tema. */
.app::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 0.04;
  background-color: var(--contorno);
  -webkit-mask: var(--curvas) right center / auto 120% no-repeat;
  mask: var(--curvas) right center / auto 120% no-repeat;
}

/* ── Barra lateral (en el móvil, cajón) ──────────────────────────────── */
.menu {
  position: fixed; top: 0; left: 0; z-index: 40;
  width: var(--ancho-menu); max-width: 86vw; height: 100vh; height: 100dvh;
  display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain;
  background: var(--fondo); border-right: 1px solid var(--filo);
  padding: calc(env(safe-area-inset-top) + 14px) 12px calc(12px + env(safe-area-inset-bottom));
  transform: translateX(-100%); visibility: hidden; transition: transform 0.22s ease-out, visibility 0.22s;
}
body.menu-abierto .menu { transform: none; visibility: visible; }
.velo { display: none; }
body.menu-abierto .velo { display: block; position: fixed; inset: 0; z-index: 39; background: rgba(0, 0, 0, 0.55); }

.menu-cab { display: flex; align-items: center; gap: 8px; padding: 2px 9px 30px; min-height: 60px; }
.marca { display: inline-flex; align-items: center; margin-right: auto; text-decoration: none; }
.marca .marca-logo { height: 18px; width: auto; }
.menu-cerrar {
  display: grid; place-items: center; width: 26px; height: 22px; padding: 0; cursor: pointer;
  color: var(--texto-2); background: none; border: 1px solid var(--borde-control); border-radius: 6px;
}
.menu-titulo { font-size: 21px; font-weight: 700; line-height: 24px; color: var(--titulo); padding: 0 9px; }
.menu-cuenta {
  display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; margin: 22px 0 15px; padding: 4px 9px;
  font: inherit; font-size: 14.2px; font-weight: 500; line-height: 20px; text-align: left;
  color: var(--texto-2); background: none; border: 0; border-radius: var(--radio-menu); cursor: pointer;
}
.menu-cuenta:hover { background: var(--hundido); color: var(--titulo); }
.menu-cuenta-nombre { flex: 1; min-width: 0; color: var(--titulo); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-cuenta svg { flex-shrink: 0; color: var(--texto-3); }
/* El avatar de OpenClaw (y de Ironrack y Solvento): 20 px, verde azulado */
.avatar {
  flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
  font-size: 8.5px; font-weight: 800; text-transform: uppercase; color: #ffffff; background: #369f9d;
}
.menu-buscar {
  display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 9px; margin-bottom: 24px;
  background: var(--hundido); border: 1px solid var(--borde); border-radius: var(--radio-menu); color: var(--texto-3);
}
.menu-buscar svg { flex-shrink: 0; }
.menu-buscar input[type="search"] {
  flex: 1; min-width: 0; height: auto; padding: 0; margin: 0;
  font: inherit; font-size: 12.4px; color: var(--titulo); background: none; border: 0; outline: none; box-shadow: none;
}
.menu-buscar input::placeholder { color: var(--texto-3); opacity: 1; }
.menu-buscar:focus-within { border-color: var(--borde-fuerte); }

.menu ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.menu .menu-grupo {
  font-size: 10.8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--texto-3);
  padding: 0 9px; margin: 18px 0 5px;
}
.menu nav a, .menu .menu-boton {
  display: flex; align-items: center; gap: 8px; width: 100%;
  min-height: 31px; padding: 4px 9px; border: 1px solid transparent; border-radius: var(--radio-menu);
  font: inherit; font-size: 13px; font-weight: 500; color: var(--texto-3); text-decoration: none; text-align: left;
  background: none; cursor: pointer;
}
.menu nav a svg, .menu .menu-boton svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--icono); }
.menu nav a:hover, .menu .menu-boton:hover { background: var(--hundido); color: var(--titulo); }
.menu nav a[aria-current="page"] { background: var(--acento-suave); border-color: var(--acento-linea); color: var(--titulo); }
.menu nav a[aria-current="page"] svg { color: var(--acento); }
.menu .no-casa { display: none; }

.menu-pie {
  margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 18px 9px 2px; line-height: normal;
}
/* El estado, como en Ironrack y Solvento: un punto de su color y la palabra */
.estado-copia { display: inline-flex; align-items: center; gap: 7px; min-width: 0; font-size: 11.5px; font-weight: 600; color: var(--texto-3); }
.estado-copia::before { content: ""; flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--punto, var(--texto-3)); }
.estado-copia:empty { display: none; }
.version { font-family: var(--fuente-mono); font-size: 11.5px; color: var(--texto-3); }

.barra-filtros { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; margin: 1.25rem 0; }
.barra-filtros label { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--texto-3); }
.barra-filtros select, .barra-filtros input { width: auto; }
.filtro-texto { flex: 1 1 260px; }
.filtro-texto input { width: 100%; }
.tabla .num { text-align: right; font-variant-numeric: tabular-nums; width: 3.5rem; }
.tabla .importe { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.celda-casilla { width: 2rem; }
.celda-casilla input { width: 18px; height: 18px; accent-color: var(--acento); }
.etiqueta { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 0.1rem 0.45rem; border-radius: 6px; background: var(--superficie-2); color: var(--texto-2); border: 1px solid var(--borde); vertical-align: middle; }
.estado-neutro { background: var(--superficie-2); color: var(--texto-2); }
.estado-error { background: var(--peligro-suave); color: var(--peligro); }
/* Pestañas como el selector segmentado de Solvento. */
.pestanas {
  display: flex; gap: 0.25rem; width: fit-content; max-width: 100%;
  background: var(--hundido); border: 1px solid var(--borde); border-radius: var(--radio-pequeno);
  padding: 0.25rem; margin: 1rem 0 1.5rem; overflow-x: auto; position: relative;
}
.pestanas a {
  padding: 0.45rem 0.9rem; text-decoration: none; color: var(--texto-3);
  font-size: 0.8rem; font-weight: 700; border-radius: 7px; border: 1px solid transparent;
  white-space: nowrap; transition: background 0.15s, color 0.15s;
}
.pestanas a:hover { color: var(--titulo); background: var(--borde-suave); }
.pestanas a[aria-current="page"] { color: var(--titulo); background: var(--borde); border-color: var(--borde-fuerte); }
.cifras .cifra { font-size: 1.5rem; margin: 0; }
.zona-peligro { border-left: 3px solid var(--peligro-fuerte); }
.dato-edad { align-self: center; margin: 0.9rem 0 0; color: var(--texto-2); font-weight: 600; }
.dato-numero { margin: 0; display: flex; flex-direction: column; justify-content: center; }
.dato-numero strong { font-size: 1.3rem; font-weight: 800; }
.barra-guardar { position: sticky; bottom: 0; background: var(--fondo); padding: 0.85rem 0; margin-top: 0; z-index: 5; border-top: 1px solid var(--borde-suave); }
.formulario .tarjeta fieldset { margin-top: 0.75rem; }

/* ── Tesorería, facturas, IVA y presupuestos ───────────────────────────── */
.acciones-cabecera { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.letra-pequena { font-size: 0.8rem; color: var(--texto-3); line-height: 1.5; margin: 0.4rem 0 0.75rem; }
.importe-positivo { color: var(--ok); font-weight: 700; }
.importe-negativo { color: var(--peligro); font-weight: 700; }
.etiquetas { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.25rem; }
a.etiqueta { text-decoration: none; color: var(--enlace); }
.lista-editable { list-style: none; padding: 0; margin: 0 0 0.75rem; }
.lista-editable li { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.6rem 0; border-bottom: 1px solid var(--borde-suave); }
.lista-editable li:last-child { border-bottom: none; }
.tarjeta h3 { font-size: 0.95rem; margin: 1rem 0 0.5rem; }
.tarjeta h4 { font-size: 0.82rem; color: var(--texto-2); margin: 0.85rem 0 0.35rem; }
.titulo-seccion { margin-top: 2.25rem; }
.tabla tfoot th, .tabla tfoot td { font-weight: 800; color: var(--titulo); border-top: 1px solid var(--borde-fuerte); border-bottom: none; }
.tabla .total th, .tabla .total td { font-weight: 800; color: var(--titulo); border-top: 1px solid var(--borde-fuerte); }
.fila-grupo th { background: var(--hundido); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--texto-3); }
.fila-aviso td { border-bottom: 1px solid var(--borde-suave); padding-top: 0; }
.aviso-iva { display: inline-block; color: var(--aviso); font-weight: 600; font-size: 0.88rem; margin-right: 1rem; }
.casilla.en-linea { display: inline-flex; margin: 0.25rem 0; }
.vista-previa-tabla { margin-top: 0.75rem; }
.vista-previa-tabla .tabla { font-size: 0.85rem; }
.input-importe { max-width: 9rem; text-align: right; min-height: 38px !important; }
.barra-progreso { height: 6px; border-radius: 4px; background: var(--hundido); border: 1px solid var(--borde-suave); overflow: hidden; margin-top: 0.3rem; min-width: 60px; }
.barra-progreso span { display: block; height: 100%; background: var(--acento); border-radius: 4px; }
.barra-progreso.pasada span { background: var(--peligro-fuerte); }
.tabla-lineas input, .tabla-lineas select { min-height: 38px; padding: 0.35rem 0.55rem; }
.tabla-lineas .col-cantidad { width: 6rem; }
.tabla-lineas .col-precio { width: 8rem; }
.tabla-lineas .col-tipo { width: 6.5rem; }
.tabla-lineas td { vertical-align: middle; }
.tabla-lineas tbody tr:hover { background: none; }
.tabla-totales { max-width: 22rem; margin: 1rem 0 0 auto; }
.tabla-totales .total th, .tabla-totales .total td { font-size: 1.1rem; }
fieldset[disabled] input, fieldset[disabled] select, fieldset[disabled] textarea { background: var(--superficie-2); color: var(--texto); opacity: 1; }
.formulario > fieldset { border: none; padding: 0; margin: 0; min-width: 0; }

/* Factura para imprimir: siempre en blanco y negro, también con el tema oscuro. */
.factura-impresa { background: #fff; color: #111; max-width: 800px; padding: 2.5rem; border: 1px solid var(--borde); border-radius: var(--radio-medio); margin: 1rem 0; }
.factura-impresa h1, .factura-impresa h2, .factura-impresa h3, .factura-impresa strong { color: #111; }
.factura-impresa .tabla th, .factura-impresa .tabla td { border-color: #ccc; color: #111; }
.factura-impresa .tabla thead th { color: #555; }
.factura-impresa .tabla tbody tr:hover { background: none; }
.fi-cabecera { display: flex; justify-content: space-between; gap: 2rem; flex-wrap: wrap; border-bottom: 2px solid #111; padding-bottom: 1rem; margin-bottom: 1.5rem; }
.fi-cabecera h1 { font-size: 1.3rem; letter-spacing: 0; }
.fi-cabecera p, .fi-cliente p { margin: 0; line-height: 1.5; }
.fi-datos { text-align: right; }
.fi-datos h2 { font-size: 1.5rem; letter-spacing: 0.08em; }
.fi-cliente { margin-bottom: 1.5rem; }
.fi-cliente h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: #555; margin-bottom: 0.25rem; }
.fi-totales .tabla-totales { color: #111; }
.fi-nota { font-size: 0.9rem; margin-top: 1rem; }
.fi-pie { margin-top: 2rem; padding-top: 0.75rem; border-top: 1px solid #ccc; font-size: 0.8rem; color: #555; }
@media (max-width: 760px) {
  .tabla-lineas { min-width: 640px; }
  .factura-impresa { padding: 1.25rem; }
}

/* ── Actividades y calendario ──────────────────────────────────────────── */
.select-pequeno { width: auto !important; min-height: 36px !important; padding: 0.3rem 0.6rem !important; font-size: 0.85rem; }
.calendario-barra { display: flex; align-items: center; gap: 0.5rem; margin: 0.5rem 0 1rem; }
.calendario-titulo { margin: 0 0.5rem; min-width: 11rem; text-align: center; font-size: 1.15rem; font-weight: 800; }
.calendario { border: 1px solid var(--borde); border-radius: var(--radio); overflow: hidden; margin-bottom: 1.5rem; background: var(--superficie); }
.cal-fila { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal-cabecera div { padding: 0.6rem 0.4rem; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--texto-3); text-align: center; border-bottom: 1px solid var(--borde); }
.cal-dia { min-height: 6.5rem; padding: 0.35rem; border-right: 1px solid var(--borde-suave); border-bottom: 1px solid var(--borde-suave); display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
.cal-fila .cal-dia:last-child { border-right: none; }
.cal-dia.fuera { background: var(--hundido); }
.cal-dia.fuera .cal-num { color: var(--texto-3); opacity: 0.7; }
.cal-num { font-size: 0.82rem; font-weight: 700; color: var(--texto-2); }
.cal-dia.hoy .cal-num { background: var(--primario); color: var(--primario-texto); border-radius: 999px; padding: 0 0.45rem; align-self: flex-start; }
.cal-act { display: block; font-size: 0.75rem; font-weight: 600; line-height: 1.25; padding: 0.2rem 0.35rem; border-radius: 6px; background: var(--acento-suave); color: var(--texto);
  text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-left: 3px solid var(--acento); }
.cal-act:hover { color: var(--titulo); }
.cal-act.cancelada { text-decoration: line-through; opacity: 0.7; border-left-color: var(--peligro-fuerte); }
.cal-act.realizada { opacity: 0.75; border-left-color: var(--borde-fuerte); background: var(--superficie-2); }
.lista-actividades { list-style: none; padding: 0; margin: 0 0 0.75rem; }
.lista-actividades li { padding: 0.6rem 0; border-bottom: 1px solid var(--borde-suave); }
.lista-actividades li:last-child { border-bottom: none; }
.lista-actividades li > a { text-decoration: none; }
.lista-actividades li > a strong { color: var(--titulo); }
.lista-actividades li > a:hover strong { text-decoration: underline; }
.lista-actividades .detalle { display: block; }
.tabla-asistencia .col-firma { width: 40%; }
.tabla-asistencia td { height: 2.4rem; }
/* En el móvil la cuadrícula no cabe: se ve la lista del mes, que va debajo. */
@media (max-width: 760px) {
  .calendario { display: none; }
}

/* ── Actas, obligaciones y documentos ──────────────────────────────────── */
/* Como las tarjetas de Solvento: el color de alerta va en el borde izquierdo. */
.tarjeta-alerta { border-left: 3px solid var(--peligro-fuerte); }
.chips { list-style: none; padding: 0; margin: 0 0 0.75rem; display: flex; flex-wrap: wrap; gap: 0.35rem; }
.chip { display: inline-flex; align-items: center; gap: 0.25rem; background: var(--superficie-2); border: 1px solid var(--borde); border-radius: 999px; padding: 0.15rem 0.2rem 0.15rem 0.75rem; font-size: 0.85rem; }
.chip .btn-icono { width: 28px; height: 28px; font-size: 0.8rem; }
.puntos { list-style: none; padding: 0; margin: 0 0 1rem; counter-reset: none; }
.punto { background: var(--hundido); border: 1px solid var(--borde); border-radius: var(--radio-medio); padding: 1rem; margin-bottom: 0.85rem; }
.punto-cabecera { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
.punto-cabecera input { flex: 1; font-weight: 600; }
.punto-num { font-weight: 800; color: var(--texto-2); }
.punto-botones { display: flex; }
.acuerdos { list-style: none; padding: 0; margin: 0.75rem 0; }
.acuerdo { background: var(--superficie); border: 1px solid var(--borde); border-left: 3px solid var(--acento); border-radius: var(--radio-pequeno); padding: 0.75rem; margin-bottom: 0.5rem; }
.acuerdo > label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--texto-3); }
.acuerdo-votacion { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 1rem; margin-top: 0.5rem; font-size: 0.88rem; }
.acuerdo-votacion label { display: inline-flex; align-items: center; gap: 0.35rem; }
.acuerdo-votacion .votos { display: inline-flex; flex-wrap: wrap; gap: 0.5rem; }
.input-corto { width: 4.5rem !important; min-height: 34px !important; padding: 0.25rem 0.4rem !important; }
.lista-marcable { max-height: 16rem; overflow-y: auto; background: var(--hundido); border: 1px solid var(--borde); border-radius: var(--radio-pequeno); padding: 0.25rem 0.85rem; margin: 0.5rem 0 1rem; }
.lista-marcable .casilla { margin: 0.4rem 0; }
.fila-anadir { display: flex; gap: 0.5rem; margin: 0.5rem 0; }
.fila-anadir input { flex: 1; }
.lista-documentos, .lista-vencimientos { list-style: none; padding: 0; margin: 0; }
.lista-documentos li, .lista-vencimientos li { display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem 0.75rem; padding: 0.7rem 0; border-bottom: 1px solid var(--borde-suave); }
.lista-documentos li:last-child, .lista-vencimientos li:last-child { border-bottom: none; }
.doc-icono { flex-shrink: 0; width: 2.6rem; text-align: center; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.05em; padding: 0.5rem 0; border-radius: 8px; background: var(--superficie-2); border: 1px solid var(--borde); color: var(--texto-2); }
.doc-texto, .venc-texto { flex: 1 1 14rem; min-width: 0; }
.doc-texto .detalle, .venc-texto .detalle { display: block; }
.doc-nombre { padding: 0; text-align: left; font-weight: 600; }
.doc-acciones, .venc-acciones { display: flex; gap: 0.35rem; }
.venc-fecha { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--titulo); width: 6rem; }
.cal-oblig { background: var(--aviso-fondo); border-left-color: var(--aviso); }
.cal-oblig.vencida { background: var(--peligro-suave); border-left-color: var(--peligro-fuerte); }
.cal-oblig.hecha { opacity: 0.6; text-decoration: line-through; }
/* Documentos impresos (actas, memoria, cuentas): papel blanco, como la factura. */
.documento-impreso { background: #fff; color: #111; max-width: 800px; padding: 2.5rem; border: 1px solid var(--borde); border-radius: var(--radio-medio); margin: 1rem 0; line-height: 1.6; }
.documento-impreso h1, .documento-impreso h2, .documento-impreso h3, .documento-impreso h4, .documento-impreso strong { color: #111; }
.documento-impreso h1 { font-size: 1.4rem; letter-spacing: 0; margin-bottom: 0.2rem; }
.documento-impreso h2 { font-size: 1.05rem; font-weight: 600; color: #333; margin-bottom: 1rem; }
.documento-impreso h3 { font-size: 1rem; margin: 1.25rem 0 0.5rem; text-transform: uppercase; letter-spacing: 0.04em; }
.documento-impreso h4 { font-size: 0.98rem; margin: 1rem 0 0.25rem; }
.di-entidad { font-size: 0.85rem; color: #555; border-bottom: 2px solid #111; padding-bottom: 0.5rem; }
.di-acuerdo { margin-left: 1rem; }
.di-firmas { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-top: 2.5rem; text-align: center; }
.di-firma { height: 4rem; border-bottom: 1px solid #111; margin: 0.5rem 1rem; }
@media (max-width: 760px) { .documento-impreso { padding: 1.25rem; } }

/* ── Panel de Inicio ──────────────────────────────────────────────────── */
/* Los rótulos de bloque son el «section-title» de Solvento. */
.titulo-bloque { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--titulo); opacity: 0.9; margin: 2.5rem 0 1rem; }
.rejilla-tarjetas .tarjeta-ancha { grid-column: 1 / -1; }
.lista-cifras { list-style: none; padding: 0; margin: 0 0 0.75rem; }
.lista-cifras li { display: flex; justify-content: space-between; gap: 1rem; padding: 0.45rem 0; border-bottom: 1px solid var(--borde-suave); font-size: 0.92rem; }
.lista-cifras li:last-child { border-bottom: none; }
.lista-cifras li.total { font-weight: 800; color: var(--titulo); border-top: 1px solid var(--borde-fuerte); border-bottom: none; margin-top: 0.25rem; }
.lista-cifras .importe { font-variant-numeric: tabular-nums; white-space: nowrap; }
.barra-progreso.grande { height: 10px; border-radius: 6px; margin: 0.35rem 0 0.3rem; }
.barra-progreso.grande + .detalle { margin-top: 0; }

/* Gráficas en SVG: los colores salen del tema. Línea con degradado debajo y
   rejilla discontinua, como las de Solvento. */
.grafica { margin: 0; }
.grafica svg { display: block; width: 100%; height: auto; max-height: 260px; overflow: visible; }
.g-rejilla { stroke: var(--borde); stroke-width: 1; stroke-dasharray: 3 3; }
.g-eje { fill: var(--texto-3); font-size: 12px; font-weight: 600; font-family: var(--fuente); }
.g-area { stroke: none; }
.g-degradado-ini { stop-color: var(--acento); stop-opacity: 0.25; }
.g-degradado-fin { stop-color: var(--acento); stop-opacity: 0; }
.g-linea { fill: none; stroke: var(--acento); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.g-punto { fill: var(--acento); stroke: var(--superficie); stroke-width: 2; }

/* ── Informes: memoria y cuentas ──────────────────────────────────────── */
.informe { max-width: 900px; }
.documento-impreso .detalle { color: #555; }
.documento-impreso .tabla th, .documento-impreso .tabla td { border-bottom-color: #ccc; color: #111; }
.documento-impreso .tabla thead th { color: #444; }
.documento-impreso .tabla tbody tr:hover { background: none; }
.documento-impreso .tabla .total th, .documento-impreso .tabla .total td { border-top-color: #111; }
.tabla-informe { margin: 0.5rem 0 1rem; font-size: 0.92rem; }
.tabla-informe th, .tabla-informe td { padding: 0.35rem 0.5rem; }
.tabla-informe caption { text-align: left; font-weight: 700; padding: 0.25rem 0.5rem; }
.tabla-informe tbody th { font-weight: 500; }
.cifras-informe { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: 0.75rem; margin: 0.5rem 0 1rem; }
.cifras-informe > div { border: 1px solid #ccc; border-radius: 8px; padding: 0.5rem 0.75rem; }
.cifras-informe .cifra { display: block; font-size: 1.5rem; color: #111; }
.cifras-informe span:not(.cifra) { font-size: 0.85rem; color: #555; }
.rejilla-informe { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 0 1.5rem; align-items: start; }
.aviso-informe { font-size: 0.85rem; background: #f4f4f4; border-left: 3px solid #888; padding: 0.4rem 0.75rem; color: #333; }
.di-pie { margin-top: 2rem; font-size: 0.8rem; color: #555; }

/* ── Móvil: menos aire dentro de los paneles ─────────────────────────── */
@media (max-width: 640px) {
  .tarjeta, .rejilla-tarjetas .tarjeta { padding: 16px; }
  .cifra { font-size: 1.5rem; }
}

/* ── Marca ABIES, usuarios y permisos (Fase 7a) ───────────────────────── */
/* El logotipo va siempre en el naranja de ABIES (no cambia con el acento). */
.marca-logo { height: 18px; width: auto; color: var(--naranja); }

.acceso-marca { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 8px; }
.acceso-logo { width: 150px; height: auto; color: var(--naranja); }
.acceso-producto { font-size: 10.8px; font-weight: 700; letter-spacing: 0.25em; text-transform: uppercase; color: var(--texto-3); }
.acceso-pareja { display: grid; grid-template-columns: 1fr 1fr; gap: 0 0.75rem; }
.acceso-pareja > div { display: flex; flex-direction: column; gap: 0.35rem; min-width: 0; }
.acceso-grupo { border: 1px solid var(--borde); border-radius: var(--radio); padding: 12px 14px 4px; margin: 0 0 14px; display: flex; flex-direction: column; min-width: 0; }
.acceso-grupo legend { font-size: 10.8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--texto-3); padding: 0 6px; }
.acceso-opciones .btn .detalle { font-weight: 500; margin-left: 0.25rem; }
.acceso-olvido p { font-size: 0.88rem; color: var(--texto-2); margin: 0.6rem 0; }

/* Solo lectura: el menú lleva un candado y la página una franja; los botones de
   modificar se esconden (el repositorio, además, rechaza cualquier cambio). */
.menu-candado { width: 14px !important; height: 14px !important; margin-left: auto; opacity: 0.55; }
.franja-lectura { display: flex; gap: 0.6rem; align-items: center; background: var(--superficie); border: 1px solid var(--borde); border-left: 3px solid var(--naranja);
  border-radius: var(--radio-pequeno); padding: 0.6rem 0.9rem; font-size: 0.88rem; color: var(--texto-2); margin: 0 0 1.25rem; }
.franja-lectura svg { width: 16px; height: 16px; flex-shrink: 0; }
body.solo-lectura #principal button.btn:not(.lectura-ok),
body.solo-lectura #principal .btn-icono:not(.lectura-ok),
body.solo-lectura #principal a.btn[href*="/nuev"] { display: none !important; }
body.solo-lectura #principal form :is(input, select, textarea) { pointer-events: none; background: transparent; }

.grupo-permisos { border: none; padding: 0; margin: 1rem 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0 1rem; }
.grupo-permisos legend { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--texto-3); padding: 0; margin-bottom: 0.2rem; }
.grupo-permisos .campo-ayuda { grid-column: 1 / -1; margin: 0 0 0.25rem; }
.grupo-permisos .casilla { margin: 0.35rem 0; }
.fila-apagada { opacity: 0.6; }
.celda-acciones .btn + .btn { margin-left: 0.35rem; }
.celda-botones { white-space: normal; min-width: 11rem; }
.botones-fila { display: flex; flex-wrap: wrap; gap: 0.35rem; justify-content: flex-end; }
.botones-fila .btn + .btn { margin-left: 0; }

/* ── Menú de la cuenta (el de la barra lateral: Ajustes, Bloquear, Cerrar sesión) ── */
.menu-flotante {
  position: fixed; z-index: 60; min-width: 220px; padding: 4px;
  background: var(--superficie-flotante); border: 1px solid var(--borde); border-radius: var(--radio-pequeno); box-shadow: var(--sombra-flotante);
}
.menu-flotante button, .menu-flotante a {
  display: flex; align-items: center; gap: 8px; width: 100%; min-height: 34px; padding: 6px 10px;
  font: inherit; font-size: 13.5px; color: var(--texto); text-align: left; text-decoration: none;
  background: none; border: 0; border-radius: 6px; cursor: pointer;
}
.menu-flotante button:hover, .menu-flotante a:hover, .menu-flotante button:focus-visible, .menu-flotante a:focus-visible { background: var(--superficie-2); outline: none; }
.menu-flotante svg { width: 16px; height: 16px; color: var(--icono); flex-shrink: 0; }
.menu-flotante .menu-flotante-cab { padding: 8px 10px 6px; font-size: 12px; color: var(--texto-3); border-bottom: 1px solid var(--borde-suave); margin-bottom: 4px; }
.menu-flotante .menu-flotante-cab b { display: block; color: var(--titulo); font-size: 13.5px; font-weight: 600; }

/* ── Ajustes: la estructura de Ironrack y Solvento ──
   A la izquierda, la lista de secciones (200 px); a la derecha, una tarjeta con
   el título en el acento, una línea gris y el contenido en filas. Por debajo de
   720 px la lista se vuelve una fila de pestañas que se desliza. La página es
   más ancha que las demás (1.040 px), igual en las tres apps. */
.aj-layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 32px; align-items: start; max-width: 1040px; }
.aj-nav { display: flex; flex-direction: column; gap: 2.4px; position: sticky; top: 24px; }
.aj-tab {
  display: block; padding: 6px 10px; border: 1px solid transparent; border-radius: 8px; white-space: nowrap;
  font-size: 13px; font-weight: 500; color: var(--texto-3); text-decoration: none;
}
.aj-tab:hover { background: var(--hundido); color: var(--titulo); }
.aj-tab[aria-current="page"] { background: var(--acento-suave); border-color: var(--acento-linea); color: var(--titulo); }
.aj-body { min-width: 0; background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 17px 20px; }
.aj-body > h2:first-child { font-size: 21px; font-weight: 700; color: var(--acento); text-transform: none; letter-spacing: 0; margin: 0 0 5.6px; }
.aj-body > h2:first-child + p { font-size: 12.5px; color: var(--texto-3); margin: 0 0 17.6px; }

@media (max-width: 720px) {

/* La versión al final de Ajustes, como en Ironrack y Solvento */
.version-pie { text-align: center; color: var(--texto-3); margin: 3rem 0 1rem; font-family: var(--fuente-mono); font-size: 12.5px; }

  <script>/* js/nucleo/dinero.js */
/*
 * webkit_asociaciones — Dinero.
 *
 * REGLA DE ORO: todos los importes se guardan y se calculan en CÉNTIMOS
 * ENTEROS (1234,56 € → 123456). Nunca en euros con decimales: en coma flotante
 * 0,1 + 0,2 no da 0,3, y en una tesorería esos céntimos acaban descuadrando.
 *
 * Solo se pasa a euros con decimales para ENSEÑAR un importe (formatear) y solo
 * se lee de texto al ESCRIBIRLO el usuario (desdeTexto).
 *
 * Redondeo: «la mitad se aleja del cero» (2,5 → 3; −2,5 → −3), que es el
 * redondeo comercial habitual. Si en algún cálculo concreto (por ejemplo, la
 * cuota de IVA de una factura) la norma exige otro criterio, se indicará allí.
 *
 * Funciona en el navegador (window.WA.Dinero) y en Node (require) para los tests.
 */
(function (raiz, fabrica) {
  var modulo = fabrica();
  if (typeof module === "object" && module.exports) module.exports = modulo;
  else (raiz.WA = raiz.WA || {}).Dinero = modulo;
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  /** Redondea un número al entero más cercano; la mitad se aleja del cero. */
  function redondear(x) {
    // toPrecision(15) quita el «ruido» de la coma flotante: 1.005 * 100 da
    // 100.49999999999999, que sin esto redondearía a 100 en vez de a 101.
    var limpio = Number(Math.abs(x).toPrecision(15));
    var r = Math.round(limpio);
    return x < 0 ? -r : r;
  }

  /** Euros (número) → céntimos (entero). Solo para datos que ya vienen como número. */
  function aCentimos(euros) {
    var n = Number(euros);
    if (!isFinite(n)) return null;
    return redondear(n * 100);
  }

  /** Céntimos → euros (número). Solo para mostrar o exportar; no calcular con ello. */
  function aEuros(centimos) {
    return centimos / 100;
  }

  /**
   * Lee un importe escrito por una persona y lo devuelve en céntimos, o null si
   * no se entiende. Acepta lo habitual en España y algún formato «de ordenador»:
   *   "12"  "12,5"  "1.234,56"  "1234.56"  "-3,20"  "15 €"  "1 234,56"
   * Caso ambiguo: "1.234" (solo un punto seguido de tres cifras) se lee como
   * mil doscientos treinta y cuatro, que es como se escribe en español.
   */
  function desdeTexto(texto) {
    if (typeof texto === "number") return aCentimos(texto);
    var s = String(texto == null ? "" : texto).trim().replace(/[€\s\u00a0]/g, "");
    if (!s) return null;
    var negativo = false;
    if (s[0] === "-" || s[0] === "−") { negativo = true; s = s.slice(1); }
    else if (s[0] === "+") s = s.slice(1);

    var ultPunto = s.lastIndexOf("."), ultComa = s.lastIndexOf(",");
    var entera, decimales;
    if (ultPunto >= 0 && ultComa >= 0) {
      // Hay los dos: el que va el último es el separador decimal.
      var sepDec = ultComa > ultPunto ? "," : ".";
      var sepMil = sepDec === "," ? "." : ",";
      var partes = s.split(sepDec);
      if (partes.length !== 2) return null;
      entera = partes[0].split(sepMil).join("");
      decimales = partes[1];
    } else if (ultComa >= 0) {
      var p = s.split(",");
      if (p.length !== 2) return null;
      entera = p[0]; decimales = p[1];
    } else if (ultPunto >= 0) {
      if (/^\d{1,3}(\.\d{3})+$/.test(s)) { entera = s.split(".").join(""); decimales = ""; }
      else {
        var q = s.split(".");
        if (q.length !== 2) return null;
        entera = q[0]; decimales = q[1];
      }
    } else {
      entera = s; decimales = "";
    }
    if (entera === "") entera = "0";
    if (!/^\d+$/.test(entera) || !/^\d*$/.test(decimales)) return null;

    // Aritmética con texto para no pasar nunca por coma flotante.
    var dos = (decimales + "00").slice(0, 2);
    var resto = decimales.slice(2);
    var cent = parseInt(entera, 10) * 100 + parseInt(dos, 10);
    if (resto && parseInt(resto[0], 10) >= 5) cent += 1; // la mitad se aleja del cero
    if (!isFinite(cent) || cent > Number.MAX_SAFE_INTEGER) return null;
    return negativo && cent !== 0 ? -cent : cent;
  }

  /**
   * Céntimos → texto en formato español: 123456 → "1.234,56 €".
   * Se hace a mano (no con Intl) para que el resultado sea idéntico en todos los
   * navegadores y en los tests. Siempre agrupa los miles con punto, también en
   * cifras de cuatro dígitos, porque en tablas de importes se lee mejor.
   * opciones.simbolo = false → "1.234,56" (sin €), útil en campos de formulario.
   */
  function formatear(centimos, opciones) {
    if (centimos == null || !isFinite(centimos)) return "—";
    var conSimbolo = !opciones || opciones.simbolo !== false;
    var neg = centimos < 0;
    var abs = Math.abs(Math.trunc(centimos));
    var entera = String(Math.floor(abs / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    var dec = String(abs % 100).padStart(2, "0");
    return (neg ? "−" : "") + entera + "," + dec + (conSimbolo ? "\u00a0€" : "");
  }

  /** Suma una lista de importes en céntimos (ignora vacíos). */
  function sumar(lista) {
    var t = 0;
    for (var i = 0; i < (lista || []).length; i++) {
      var v = lista[i];
      if (typeof v === "number" && isFinite(v)) t += v;
    }
    return t;
  }

  /**
   * Porcentaje de un importe, redondeado al céntimo: porcentaje(10000, 21) → 2100.
   * El porcentaje puede tener decimales (10,5 %).
   */
  function porcentaje(centimos, pct) {
    return redondear(centimos * pct / 100);
  }

  /**
   * Reparte un importe en n partes que suman EXACTAMENTE el total. Los céntimos
   * que sobran van a las primeras partes: repartir(1000, 3) → [334, 333, 333].
   */
  function repartir(centimos, n) {
    if (!(n > 0)) return [];
    var signo = centimos < 0 ? -1 : 1;
    var abs = Math.abs(centimos);
    var base = Math.floor(abs / n), sobra = abs - base * n;
    var out = [];
    for (var i = 0; i < n; i++) out.push(signo * (base + (i < sobra ? 1 : 0)));

  }

  return {
    redondear: redondear, aCentimos: aCentimos, aEuros: aEuros,
    desdeTexto: desdeTexto, formatear: formatear,
    sumar: sumar, porcentaje: porcentaje, repartir: repartir,
  };
});

 * webkit_asociaciones — Gráficas sencillas en SVG, sin librerías.
 *
 *   lineas(serie, opciones)  evolución en el tiempo. serie: [{ fecha, valor }]
 *     opciones: { titulo, formato(valor) → texto, alto, desdeCero (para recuentos) }
 *   barra(parte, total, opciones)  barra de progreso con su porcentaje
 *
 * Los colores salen de las variables del tema (claro u oscuro). Cada gráfica

 * leer con lector de pantalla.

      '<circle cx="' + x(serie.length - 1).toFixed(1) + '" cy="' + y(ultimo.valor).toFixed(1) + '" r="4" class="g-punto"/>' + etiquetas + "</svg>" +

    });

/*
 * webkit_asociaciones — Importar el extracto del banco (sin interfaz: tests/extracto.test.js).
 *
 * Cada banco exporta a su manera (CSV o Excel, con unas filas de cabecera
 * antes de la tabla, importe en una columna con signo o en dos columnas
 * «cargo» y «abono»…). Esto:
 *   1. busca la fila de títulos y adivina qué columna es cada cosa
 *      (se puede corregir a mano en la pantalla de importación);
 *   2. convierte cada fila en un movimiento (ingreso si el importe es positivo,
 *      gasto si es negativo), sin categoría salvo que una regla la ponga;
 *   3. descarta los que ya estaban importados (misma cuenta, fecha, importe y concepto);
 *   4. sugiere con qué cuota o factura casa cada movimiento.
 * No guarda nada: devuelve lo que habría que guardar.
 */
(function (raiz, fabrica) {
  var dep = typeof require === "function"
    ? { Dinero: require("../nucleo/dinero.js"), Fechas: require("../nucleo/fechas.js"), Facturas: require("./facturas.js"), Cuotas: require("./cuotas.js") }

/*
 * webkit_asociaciones — Capa de datos (repositorio).
 *
 * ES LA ÚNICA PUERTA A LOS DATOS. Los módulos de la interfaz (socios,
 * tesorería…) nunca tocan el documento ni el almacenamiento directamente: piden
 * y guardan a través de estas funciones. Por eso son todas asíncronas (devuelven
 * promesas) aunque hoy los datos estén en memoria: el día que haya una versión
 * con servidor, bastará con escribir otro repositorio con las MISMAS funciones
 * que hable con una API (fetch), y ningún módulo tendrá que cambiar.
 *
 *   leer(clave)                  → copia de un objeto suelto (p. ej. "asociacion")
 *   escribir(clave, valor)
 *   listar(coleccion)            → copia de todos los registros
 *   obtener(coleccion, id)       → copia de un registro o null
 *   guardar(coleccion, registro) → lo crea (si no tiene id) o lo actualiza; devuelve la copia guardada
 *   guardarVarios(coleccion, [registros]) → como guardar(), pero todos de una vez
 *                                  (importaciones, remesas): un solo guardado
 *   borrar(coleccion, id)        → true si existía
 *   documento()                  → copia del documento completo (para copias de seguridad)
 *   guardarArchivo(ficha, bytes) → adjunta un archivo: su ficha va a la colección

 *
 * En el navegador se guarda la BÓVEDA (ver datos/cuentas.js): la cabecera con los
