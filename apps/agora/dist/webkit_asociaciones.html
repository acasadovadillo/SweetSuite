  <script>/* js/nucleo/app.js */
/*
 * ABIES · Gestión — Esqueleto de la aplicación: módulos, navegación, permisos y avisos.
 *
 * CÓMO SE AÑADE UN MÓDULO (p. ej. «Socios» en la Fase 2):
 *   1. Crea src/js/modulos/socios.js
 *   2. Dentro, llama a:
 *        WA.App.registrar({
 *          id: "socios",                 // aparece en la dirección: #/socios
 *          titulo: "Socios",             // texto del menú y título de la página
 *          icono: "<path d=…/>",          // trazos SVG de 24×24 (opcional)
 *          orden: 20,                    // posición en el menú
 *          soloAdmin: true,              // (opcional) solo lo ve la cuenta de administración
 *          pintar: async function (contenedor, datos, ruta) { … }
 *            // datos = WA.Sesion.datos · ruta = lo que va detrás: #/socios/ficha/7 → ["ficha", "7"]
 *        });
 *   3. Añade su <script> en src/index.html (antes de arranque.js).
 *
 * La navegación usa el «#» de la dirección (#/inicio, #/asociacion…) porque
 * funciona abriendo el archivo directamente, sin servidor.
 *
 * La estructura es la de Ironrack y Solvento: barra lateral con la cuenta, un
 * buscador y las secciones por grupos (GRUPOS); en el teléfono, cinco de ellas
 * abajo (BARRA_MOVIL). Un módulo que no esté en ningún grupo sale en «Más».
 */
(function (raiz) {
  "use strict";
  var WA = raiz.WA;
  var modulos = [];
  var actual = null;
  var temporizadorBloqueo = null;

  var $ = function (id) { return document.getElementById(id); };

  function registrar(m) {
    modulos.push(m);
    modulos.sort(function (a, b) { return (a.orden || 0) - (b.orden || 0); });
  }

  function partesRuta() {
    return (location.hash || "").replace(/^#\/?/, "").split("/").map(function (p) {
      try { return decodeURIComponent(p); } catch (e) { return p; }
    });
  }
  function rutaActual() {
    var id = partesRuta()[0];
    return visibles().some(function (m) { return m.id === id; }) ? id : "inicio";
  }
  /** El módulo abierto ahora (lo usa el repositorio para saber qué permiso pedir). */
  function moduloActual() { return actual || rutaActual(); }

  /** Módulos que ve quien ha entrado: «Usuarios» y similares, solo la administración. */
  function visibles() {
    return modulos.filter(function (m) { return !m.oculto && (!m.soloAdmin || WA.Sesion.esAdmin); });
  }

  var GRUPOS = [
    { titulo: "", ids: ["inicio"] },
    { titulo: "Gente", ids: ["asociacion", "socios", "cuotas", "actividades"] },
    { titulo: "Dinero", ids: ["tesoreria", "facturas", "iva", "proyectos"] },
    { titulo: "Gobierno", ids: ["actas", "obligaciones", "documentos", "informes"] },
    { titulo: "Cuenta", ids: ["usuarios", "registro", "copias", "ajustes"] },
  ];
  var BARRA_MOVIL = { inicio: "Inicio", socios: "Socios", cuotas: "Cuotas", tesoreria: "Tesorería", actividades: "Actividades" };
  var svg = function (trazos, clase) {
    return '<svg' + (clase ? ' class="' + clase + '"' : "") + ' viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + trazos + "</svg>";
  };
  var I_BLOQUEAR = '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>';
  var I_SALIR = '<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h11"/>';
  var I_AJUSTES = '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/>';

  var CANDADO = '<svg class="menu-candado" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';

  function enlace(m) {
    var lectura = WA.Sesion.modo !== "cerrada" && !WA.Sesion.puedeEditar(m.id);
    return '<li><a href="#/' + m.id + '" data-modulo="' + m.id + '"' + (lectura ? ' title="Solo lectura para tu cargo"' : "") + ">" +
      svg(m.icono || "") + "<span>" + WA.UI.esc(m.titulo) + "</span>" + (lectura ? CANDADO + '<span class="sr"> (solo lectura)</span>' : "") + "</a></li>";
  }
  function pintarMenu() {
    var vis = visibles(), puestos = {};
    var grupos = GRUPOS.map(function (g) {
      var ms = vis.filter(function (m) { return g.ids.indexOf(m.id) >= 0; });
      ms.forEach(function (m) { puestos[m.id] = true; });
      return { titulo: g.titulo, ms: ms };
    });
    var sueltos = vis.filter(function (m) { return !puestos[m.id]; });
    if (sueltos.length) grupos.splice(grupos.length - 1, 0, { titulo: "Más", ms: sueltos });
    var cuenta = grupos[grupos.length - 1];
    $("menu-lista").innerHTML = grupos.map(function (g) {
      var html = g.ms.map(enlace).join("");
      if (g === cuenta && WA.Sesion.modo !== "cerrada") {
        var demo = WA.Sesion.modo === "demostración";
        if (!demo) html += '<li><button type="button" class="menu-boton" data-accion="bloquear">' + svg(I_BLOQUEAR) + "<span>Bloquear</span></button></li>";
        html += '<li><button type="button" class="menu-boton" data-accion="salir">' + svg(I_SALIR) + "<span>" + (demo ? "Salir de la demostración" : "Cerrar sesión") + "</span></button></li>";
      }
      if (!html) return "";
      return (g.titulo ? '<li class="menu-grupo" aria-hidden="true">' + WA.UI.esc(g.titulo) + "</li>" : "") + html;
    }).join("");
    $("barra-movil").innerHTML = vis.filter(function (m) { return BARRA_MOVIL[m.id]; }).map(function (m) {
      return '<a href="#/' + m.id + '" data-modulo="' + m.id + '">' + svg(m.icono || "") + "<span>" + BARRA_MOVIL[m.id] + "</span></a>";
    }).join("");
    filtrarMenu($("menu-buscar").value);
  }

  // ── Buscador de la barra lateral: filtra las secciones por su nombre ──────
  var normal = function (t) { return String(t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); };
  function filtrarMenu(texto) {
    var q = normal(texto).trim(), grupo = null, hay = false;
    Array.prototype.forEach.call($("menu-lista").children, function (li) {
      if (li.classList.contains("menu-grupo")) {
        if (grupo) grupo.hidden = !hay;
        grupo = li; hay = false; return;
      }
      var ve = !q || normal(li.textContent).indexOf(q) >= 0;
      if (q && li.querySelector("button")) ve = false;
      li.hidden = !ve;
      if (ve) hay = true;
    });
    if (grupo) grupo.hidden = !hay;
  }

  /** Pinta el módulo de la dirección actual. */
  async function navegar(opciones) {
    if (WA.Sesion.modo === "cerrada") return;
    var id = rutaActual();
    var m = modulos.find(function (x) { return x.id === id; });
    actual = id;
    Array.prototype.forEach.call(document.querySelectorAll("#menu-lista a, #barra-movil a"), function (a) {
      if (a.getAttribute("data-modulo") === id) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    cerrarMenuMovil();
    var principal = $("principal");
    // Solo lectura: el cargo ve la sección pero no la modifica. El repositorio lo
    // hace cumplir; aquí se esconden los botones de modificar y se avisa.
    var lectura = !WA.Sesion.puedeEditar(id);
    document.body.classList.toggle("solo-lectura", lectura);
    principal.innerHTML = '<p class="cargando">Cargando…</p>';
    try {
      principal.innerHTML = "";
      await m.pintar(principal, WA.Sesion.datos, partesRuta().slice(1).filter(Boolean));
      if (lectura) {
        var u = WA.Sesion.usuario;
        principal.insertAdjacentHTML("afterbegin", '<p class="franja-lectura" role="note">' + CANDADO +
          "<span><strong>Solo lectura.</strong> Con el cargo de " + WA.UI.esc(u ? u.cargo : "") + " puedes ver esta sección, pero no modificarla.</span></p>");
      }
    } catch (e) {
      console.error(e);
      principal.innerHTML = '<div class="tarjeta tarjeta-error"><h1>Algo ha fallado</h1><p>' + WA.UI.esc(e.message) +
        "</p><p>Tus datos no se han tocado. Si vuelve a pasar, descarga una copia de seguridad y avisa a la cuenta de administración.</p></div>";
    }
    document.title = m.titulo + " · " + WA.Marca.NOMBRE;
    // Para lectores de pantalla: el foco va al título de la página nueva.
    if (!opciones || opciones.foco !== false) {
      var h1 = principal.querySelector("h1");
      if (h1) { h1.setAttribute("tabindex", "-1"); h1.focus({ preventScroll: true }); }
    }
    window.scrollTo(0, 0);
  }

  /** Vuelve a pintar la página actual (tras guardar algo) sin mover el foco. */
  function repintar() { return navegar({ foco: false }); }

  // ── Menú en el móvil ──────────────────────────────────────────────────────
  function abrirMenuMovil() {
    document.body.classList.add("menu-abierto");
    $("btn-menu").setAttribute("aria-expanded", "true");
    var primero = document.querySelector("#menu-lista a");
    if (primero) primero.focus();
  }
  function cerrarMenuMovil() {
    document.body.classList.remove("menu-abierto");
    var b = $("btn-menu");
    if (b) b.setAttribute("aria-expanded", "false");
  }

  // ── Menú de la cuenta (el botón con el nombre, arriba en la barra lateral) ──
  function cerrarMenuCuenta() {
    var m = $("menu-cuenta-lista");
    if (m) m.remove();
    $("menu-cuenta").setAttribute("aria-expanded", "false");
    document.removeEventListener("pointerdown", fueraDelMenu, true);
  }
  function fueraDelMenu(e) {
    if (!e.target.closest("#menu-cuenta-lista, #menu-cuenta")) cerrarMenuCuenta();
  }
  function abrirMenuCuenta() {
    if ($("menu-cuenta-lista")) { cerrarMenuCuenta(); return; }
    var u = WA.Sesion.usuario, demo = WA.Sesion.modo === "demostración", esc = WA.UI.esc;
    var b = $("menu-cuenta").getBoundingClientRect();
    var m = document.createElement("div");
    m.id = "menu-cuenta-lista";
    m.className = "menu-flotante";
    m.setAttribute("role", "menu");
    m.style.left = b.left + "px";
    m.style.top = b.bottom + 6 + "px";
    m.style.width = Math.max(220, b.width) + "px";
    m.innerHTML = (u ? '<div class="menu-flotante-cab"><b>' + esc(u.nombre) + "</b>" + esc(u.cargo) + (demo ? " · demostración" : "") + "</div>" : "") +
      '<a href="#/ajustes" role="menuitem">' + svg(I_AJUSTES) + "Ajustes</a>" +
      (demo ? "" : '<button type="button" role="menuitem" data-accion="bloquear">' + svg(I_BLOQUEAR) + "Bloquear</button>") +
      '<button type="button" role="menuitem" data-accion="salir">' + svg(I_SALIR) + (demo ? "Salir de la demostración" : "Cerrar sesión") + "</button>";
    document.body.appendChild(m);
    $("menu-cuenta").setAttribute("aria-expanded", "true");
    m.addEventListener("click", function (e) {
      var x = e.target.closest("a, button");
      if (!x) return;
      cerrarMenuCuenta();
      accion(x.getAttribute("data-accion"));
    });
    m.addEventListener("keydown", function (e) {
      var items = Array.prototype.slice.call(m.querySelectorAll("a, button")), i = items.indexOf(document.activeElement);
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        items[(i + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length].focus();
      } else if (e.key === "Escape") { cerrarMenuCuenta(); $("menu-cuenta").focus(); }
    });
    document.addEventListener("pointerdown", fueraDelMenu, true);
    m.querySelector("a").focus();
  }
  function accion(a) {
    if (a === "bloquear") WA.Sesion.bloquear();
    else if (a === "salir") cerrarSesion();
  }

  // ── El acento de quien ha entrado (Ajustes › Apariencia) ─────────────────
  async function acentoGuardado() {
    var u = WA.Sesion.usuario;
    if (!u || WA.Sesion.modo === "cerrada") return "";
    var config = (await WA.Sesion.datos.leer("config")) || {};
    var c = (config.acentos || {})[u.id];
    return WA.Tema.valido(c) ? c.toLowerCase() : "";
  }
  /** Guarda el acento del usuario («» = el verde de ABIES) y lo aplica. */
  async function ponerAcento(color) {
    var u = WA.Sesion.usuario;
    if (!u) return;
    var config = (await WA.Sesion.datos.leer("config")) || {};
    config.acentos = Object.assign({}, config.acentos || {});
    if (WA.Tema.valido(color)) config.acentos[u.id] = color.toLowerCase(); else delete config.acentos[u.id];
    await WA.Sesion.datos.escribir("config", config);
    WA.Tema.acento(color);
  }

  // ── Franjas de aviso (demostración / copia de seguridad) y el estado del pie ──
  function ponerEstado(texto, color) {
    var e = $("estado-copia");
    e.textContent = texto;
    e.style.setProperty("--punto", color);
  }
  async function actualizarFranjas() {
    var demo = WA.Sesion.modo === "demostración";
    $("franja-demo").hidden = !demo;
    var franja = $("franja-copia");
    if (demo) ponerEstado("Demostración", "var(--acento)");
    if (demo || WA.Sesion.modo !== "abierta") { franja.hidden = true; return; }
    var e = await WA.Sesion.datos.estadoCopia();
    var texto = "";
    if (!e.ultimaCopia && e.cambiosDesdeCopia > 0) texto = "Todavía no has hecho ninguna copia de seguridad.";
    else if (e.cambiosDesdeCopia > 0) {
      var dias = WA.Fechas.diasEntre(e.ultimaCopia.slice(0, 10), WA.Fechas.hoy());
      texto = "Hay cambios sin copia de seguridad" + (dias > 0 ? " (la última es de hace " + dias + (dias === 1 ? " día)." : " días).") : ".");
    }
    $("franja-copia-texto").textContent = texto;
    franja.hidden = !texto;
    if (e.cambiosDesdeCopia > 0) ponerEstado("Sin copia", "var(--aviso)");
    else ponerEstado("Copia al día", "var(--ok)");
  }

  // ── Bloqueo por inactividad ──────────────────────────────────────────────
  function reiniciarBloqueo() {
    clearTimeout(temporizadorBloqueo);
    var min = WA.Preferencias.leer().bloqueoMinutos;
    if (WA.Sesion.modo !== "abierta" || !(min > 0)) return;
    temporizadorBloqueo = setTimeout(function () {
      WA.Sesion.bloquear().then(function () { WA.UI.aviso("Se ha bloqueado por inactividad. Tus datos siguen guardados.", "info"); });
    }, min * 60000);
  }

  // ── Cerrar sesión (y, si está activado, borrar los datos de este navegador) ──
  async function cerrarSesion() {
    if (WA.Sesion.modo === "demostración") { await WA.Sesion.bloquear(); return; }
    var borrar = WA.Preferencias.leer().borrarAlSalir;
    if (!borrar) { await WA.Sesion.bloquear(); return; }
    var e = await WA.Sesion.datos.estadoCopia();
    if (e.cambiosDesdeCopia > 0) {
      var r = await WA.UI.dialogo({
        titulo: "Hay cambios sin copia de seguridad",
        contenido: "<p>Este navegador está configurado para <strong>borrar los datos al cerrar la sesión</strong>. " +
          "Si sales sin descargar una copia, perderás los cambios desde la última.</p>",
        botones: [
          { texto: "Cancelar", valor: "cancelar" },
          { texto: "Salir sin copia", valor: "sin", estilo: "btn-peligro" },
          { texto: "Descargar copia y salir", valor: "copia", estilo: "btn-primario" },
        ],
      });
      if (r.valor === "cancelar") return;
      if (r.valor === "copia") await WA.Copias.descargar(true);
    }
    await WA.Sesion.borrarDelNavegador();
    await WA.Sesion.bloquear();
    WA.UI.aviso("Sesión cerrada y datos borrados de este navegador.", "info");
  }

  /** Quien entra con una contraseña provisional tiene que elegir la suya antes de seguir. */
  async function exigirCambioDeContrasena() {
    var u = WA.Sesion.usuario;
    if (!u || !u.debeCambiar || WA.Sesion.modo !== "abierta") return;
    while (WA.Sesion.usuario && WA.Sesion.usuario.debeCambiar) {
      var r = await WA.UI.dialogo({
        titulo: "Elige tu contraseña",
        contenido: "<p>Has entrado con una contraseña provisional. Elige ahora la tuya: solo la sabrás tú.</p>" +
          '<form class="formulario" novalidate>' +
          WA.UI.campo({ nombre: "nueva", etiqueta: "Tu contraseña", tipo: "password", requerido: true, ayuda: "Mínimo 8 caracteres. Mejor una frase.", atributos: 'autocomplete="new-password"' }) +
          WA.UI.campo({ nombre: "repetida", etiqueta: "Repítela", tipo: "password", requerido: true, atributos: 'autocomplete="new-password"' }) +
          "</form>",
        botones: [{ texto: "Salir", valor: "salir" }, { texto: "Guardar", valor: "enviar", estilo: "btn-primario" }],
        validar: function (form) {
          var d = WA.UI.leerFormulario(form);
          var corta = d.nueva.length < 8, distintas = d.nueva !== d.repetida;
          WA.UI.marcarError(form, "nueva", corta ? "Mínimo 8 caracteres." : "");
          WA.UI.marcarError(form, "repetida", !corta && distintas ? "No coinciden." : "");
          return !corta && !distintas;
        },
      });
      if (r.valor !== "enviar") { await WA.Sesion.bloquear(); return; }
      try {
        await WA.Sesion.cambiarMiContrasena(provisional, r.datos.nueva);
        WA.UI.aviso("Contraseña guardada. A partir de ahora, entra con ella.");
      } catch (e) { WA.UI.aviso(e.message, "error"); }
    }
  }
  var provisional = "";
  /** Las iniciales del avatar: «María López» → «ML». */
  function iniciales(nombre) {
    var p = String(nombre || "").trim().split(/\s+/).filter(Boolean);
    return ((p[0] || "").charAt(0) + (p.length > 1 ? p[p.length - 1].charAt(0) : "")).toUpperCase();
  }
  /** La pantalla de acceso deja aquí la contraseña con la que se entró (solo en memoria, para el cambio obligatorio). */
  function recordarProvisional(c) { provisional = c || ""; }

  function iniciar() {
    $("marca").insertAdjacentHTML("afterbegin", WA.Marca.logo("marca-logo", "ABIES"));
    $("marca-movil").insertAdjacentHTML("afterbegin", WA.Marca.logo("marca-logo", ""));
    $("marca-nombre").textContent = "Gestión";
    $("menu-version").textContent = raiz.WA_VERSION || "desarrollo";
    pintarMenu();
    // Si un cargo intenta modificar lo que no le toca, el repositorio lo rechaza: se avisa.
    window.addEventListener("unhandledrejection", function (e) {
      if (e.reason && e.reason.codigo === "PERMISO") { e.preventDefault(); WA.UI.aviso(e.reason.message, "error"); }
    });
    window.addEventListener("hashchange", function () { navegar(); });
    $("btn-menu").addEventListener("click", function () {
      if (document.body.classList.contains("menu-abierto")) cerrarMenuMovil(); else abrirMenuMovil();
    });
    $("velo-menu").addEventListener("click", cerrarMenuMovil);
    $("btn-cerrar-menu").addEventListener("click", function () { cerrarMenuMovil(); $("btn-menu").focus(); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && document.body.classList.contains("menu-abierto")) { cerrarMenuMovil(); $("btn-menu").focus(); }
    });
    $("menu-cuenta").addEventListener("click", abrirMenuCuenta);
    $("menu-lista").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-accion]");
      if (b) accion(b.getAttribute("data-accion"));
    });
    var buscador = $("menu-buscar");
    buscador.addEventListener("input", function () { filtrarMenu(buscador.value); });
    buscador.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        var a = Array.prototype.find.call($("menu-lista").querySelectorAll("li:not([hidden]) a"), function () { return true; });
        if (a) { buscador.value = ""; filtrarMenu(""); location.hash = a.getAttribute("href"); }
      } else if (e.key === "Escape") { buscador.value = ""; filtrarMenu(""); }
    });
    $("btn-franja-copia").addEventListener("click", function () { WA.Copias.descargar(true); });
    $("btn-salir-demo").addEventListener("click", function () { WA.Sesion.bloquear(); });
    ["click", "keydown", "pointermove", "scroll"].forEach(function (ev) {
      document.addEventListener(ev, reiniciarBloqueo, { passive: true });
    });
    window.addEventListener("beforeunload", function (e) {
      if (WA.Sesion.hayGuardadosPendientes()) { e.preventDefault(); e.returnValue = ""; }
    });

    var modoAnterior = null;
    WA.Sesion.alCambiar(function (modo) {
      var cambioDeModo = modo !== modoAnterior;
      modoAnterior = modo;
      actualizarFranjas();
      if (!cambioDeModo) return;
      var abierta = modo !== "cerrada";
      $("app").hidden = !abierta;
      $("acceso").hidden = abierta;
      cerrarMenuCuenta();
      var u = WA.Sesion.usuario;
      $("usuario-actual").textContent = u ? WA.Sesion.firma : "";
      $("menu-cuenta").title = u ? WA.Sesion.firma : "";
      $("avatar").textContent = u ? iniciales(u.nombre) : "";
      $("menu-buscar").value = "";
      pintarMenu();
      if (abierta) {
        reiniciarBloqueo();
        // El acento de la cuenta, antes de pintar la primera página
        acentoGuardado().catch(function () { return ""; }).then(function (c) {
          WA.Tema.acento(c);
          return navegar();
        }).then(exigirCambioDeContrasena);
      } else {
        WA.Tema.acento(null);
        ponerEstado("", "");
        $("principal").innerHTML = ""; document.body.classList.remove("solo-lectura"); provisional = ""; WA.Acceso.mostrar();
      }
    });
  }

  WA.App = { registrar: registrar, iniciar: iniciar, navegar: navegar, repintar: repintar, actualizarFranjas: actualizarFranjas, reiniciarBloqueo: reiniciarBloqueo,
    moduloActual: moduloActual, pintarMenu: pintarMenu, recordarProvisional: recordarProvisional, ponerAcento: ponerAcento, acentoGuardado: acentoGuardado, iniciales: iniciales };
})(typeof self !== "undefined" ? self : this);
</script>
  <script>/* js/modulos/acceso.js */
/*
 * ABIES · Gestión — Pantalla de acceso.
 *
 * Situaciones:
 *   · No hay datos en este navegador → configurar por primera vez (contraseña del
 *     archivo y cuenta ABIES), recuperar una copia o ver la demostración.
 *   · Hay datos de ABIES → entrar con nombre, cargo, contraseña personal y
 *     contraseña del archivo.
 *   · Hay datos de antes de los usuarios (una sola contraseña) → convertirlos.
 *   · Se ha olvidado la contraseña personal → la cuenta ABIES pone una nueva.
 *     Si se pierde la del archivo, no hay forma de recuperar lo cifrado.
 */
(function (raiz) {
  "use strict";
  var WA = raiz.WA, esc = WA.UI.esc;
  var MINIMO = 8;
  var $ = function (id) { return document.getElementById(id); };

  function pintar(html) {
    $("acceso").innerHTML = '<main class="acceso-panel" id="acceso-principal">' +
      '<div class="acceso-marca">' + WA.Marca.logo("acceso-logo", "ABIES") + '<span class="acceso-producto">Gestión</span></div>' + html + "</main>";
    var primero = $("acceso").querySelector("input:not([type=hidden]), button");
    if (primero) primero.focus();
  }

  function error(id, texto) {
    var el = $(id);
    el.textContent = texto || "";
    el.hidden = !texto;
  }

  /** Bloquea el botón mientras se cifra (tarda un segundo) para que no se pulse dos veces. */
  async function ocupado(boton, texto, tarea) {
    var antes = boton.textContent;
    boton.disabled = true;
    boton.textContent = texto;
    try { return await tarea(); }
    finally { boton.disabled = false; boton.textContent = antes; }
  }

  function campo(id, etiqueta, tipo, extra) {
    return '<label for="' + id + '">' + etiqueta + "</label>" +
      '<input id="' + id + '" type="' + (tipo || "text") + '"' + (extra || "") + ">";
  }
  function dosContrasenas(prefijo, etiqueta, ayuda) {
    return campo(prefijo + "-1", etiqueta, "password", ' autocomplete="new-password" required aria-describedby="' + prefijo + '-ayuda"') +
      '<p class="campo-ayuda" id="' + prefijo + '-ayuda">' + ayuda + "</p>" +
      campo(prefijo + "-2", "Repítela", "password", ' autocomplete="new-password" required');
  }
  function leerDos(prefijo, idError, que) {
    var a = $(prefijo + "-1").value, b = $(prefijo + "-2").value;
    if (a.length < MINIMO) { error(idError, que + " necesita al menos " + MINIMO + " caracteres."); return null; }
    if (a !== b) { error(idError, "Las dos veces que has escrito " + que.toLowerCase() + " no coinciden."); return null; }
    return a;
  }

  /** Los cuatro campos para entrar (o para abrir una copia). */
  function camposEntrar(p) {
    var u = WA.Sesion.ultimo || {};
    return '<div class="acceso-pareja">' +
      '<div>' + campo(p + "-nombre", "Nombre", "text", ' autocomplete="username" autocapitalize="words" spellcheck="false" required value="' + esc(u.nombre || "") + '"') + "</div>" +
      '<div>' + campo(p + "-cargo", "Cargo", "text", ' list="lista-cargos" autocomplete="off" required value="' + esc(u.cargo || "") + '"') + "</div></div>" +
      '<datalist id="lista-cargos">' + WA.Permisos.CARGOS.concat([WA.Permisos.CARGO_ADMIN]).map(function (c) { return '<option value="' + esc(c) + '">'; }).join("") + "</datalist>" +
      campo(p + "-pass", "Tu contraseña", "password", ' autocomplete="current-password" required') +
      campo(p + "-archivo", "Contraseña del archivo", "password", ' autocomplete="off" required aria-describedby="' + p + '-archivo-ayuda"') +
      '<p class="campo-ayuda" id="' + p + '-archivo-ayuda">La que comparte toda la junta y protege los datos de ABIES.</p>';
  }
  function leerEntrar(p, idError) {
    var o = { nombre: $(p + "-nombre").value.trim(), cargo: $(p + "-cargo").value.trim(), contrasena: $(p + "-pass").value, contrasenaArchivo: $(p + "-archivo").value };
    if (!o.nombre || !o.cargo || !o.contrasena || !o.contrasenaArchivo) { error(idError, "Rellena los cuatro campos."); return null; }
    return o;
  }

  /** Contraseña del archivo y de la cuenta ABIES: para empezar, convertir o recuperar. */
  function camposConfigurar() {
    return '<fieldset class="acceso-grupo"><legend>Contraseña del archivo</legend>' +
      dosContrasenas("ca", "Contraseña del archivo", "Protege todos los datos. La tendrá toda la junta, además de la suya personal. Si se pierde, los datos no se pueden recuperar.") +
      "</fieldset>" +
      '<fieldset class="acceso-grupo"><legend>Cuenta de administración (' + esc(WA.Permisos.NOMBRE_ADMIN) + " · " + esc(WA.Permisos.CARGO_ADMIN) + ")</legend>" +
      dosContrasenas("cb", "Contraseña de la cuenta ABIES", "Con ella se dan de alta los usuarios de cada cargo y se les pone contraseña si la olvidan. Tiene que ser distinta de la del archivo.") +
      "</fieldset>";
  }
  function leerConfigurar(idError) {
    var archivo = leerDos("ca", idError, "La contraseña del archivo");
    if (!archivo) return null;
    var admin = leerDos("cb", idError, "La contraseña de la cuenta ABIES");
    if (!admin) return null;
    if (archivo === admin) { error(idError, "La contraseña de la cuenta ABIES tiene que ser distinta de la del archivo."); return null; }
    return { contrasenaArchivo: archivo, contrasenaAdmin: admin };
  }

  function despuesDeConfigurar() {
    location.hash = "#/usuarios";
    WA.UI.aviso("Listo. Has entrado como " + WA.Permisos.NOMBRE_ADMIN + ". Da de alta a los usuarios de cada cargo.");
  }

  // ── Sin datos ────────────────────────────────────────────────────────────
  function bienvenida() {
    pintar(
      '<p class="acceso-sub">Gestión interna de la asociación. Cada miembro de la junta entra con su nombre, su cargo y su contraseña.</p>' +
      '<div class="acceso-opciones">' +
      '<button type="button" class="btn btn-primario" id="op-empezar">Configurar por primera vez</button>' +
      '<button type="button" class="btn btn-secundario" id="op-recuperar">Recuperar una copia de seguridad</button>' +
      '<button type="button" class="btn btn-enlace" id="op-demo">Ver la demostración</button>' +
      "</div>" +
      '<p class="acceso-nota">En este navegador todavía no hay datos de ABIES.</p>'
    );
    $("op-empezar").addEventListener("click", configurar);
    $("op-recuperar").addEventListener("click", recuperar);
    $("op-demo").addEventListener("click", demostracion);
  }

  function configurar() {
    pintar(
      "<h1>Configurar ABIES · Gestión</h1>" +
      '<p class="acceso-sub">Dos contraseñas: la del archivo, que compartirá la junta, y la de la cuenta de administración.</p>' +
      '<form id="f-crear" class="acceso-form" novalidate>' + camposConfigurar() +
      '<p class="acceso-error" id="e-crear" role="alert" hidden></p>' +
      '<button type="submit" class="btn btn-primario">Crear y entrar</button>' +
      '<button type="button" class="btn btn-enlace" id="volver">Volver</button></form>'
    );
    $("volver").addEventListener("click", mostrar);
    $("f-crear").addEventListener("submit", async function (e) {
      e.preventDefault();
      error("e-crear", "");
      var o = leerConfigurar("e-crear");
      if (!o) return;
      try {
        await ocupado(this.querySelector("[type=submit]"), "Cifrando…", function () { return WA.Sesion.crear(o); });
        despuesDeConfigurar();
      } catch (err) { error("e-crear", err.message); }
    });
  }

  // ── Entrar ───────────────────────────────────────────────────────────────
  function entrar() {
    pintar(
      '<form id="f-entrar" class="acceso-form" novalidate>' + camposEntrar("d") +
      '<p class="acceso-error" id="e-entrar" role="alert" hidden></p>' +
      '<button type="submit" class="btn btn-primario">Entrar</button></form>' +
      '<details class="acceso-olvido"><summary>¿No puedes entrar?</summary>' +
      "<p><strong>Si has olvidado tu contraseña</strong>, pide a quien lleve la cuenta " + esc(WA.Permisos.NOMBRE_ADMIN) + " que te ponga una provisional.</p>" +
      "<p><strong>Si se ha perdido la contraseña del archivo</strong>, no hay forma de recuperar los datos cifrados. Solo queda una copia de seguridad.</p>" +
      '<div class="acceso-opciones"><button type="button" class="btn btn-secundario" id="op-recuperar">Recuperar una copia de seguridad</button>' +
      '<button type="button" class="btn btn-peligro-suave" id="op-borrar">Borrar los datos de este navegador</button></div></details>' +
      '<p class="acceso-nota"><button type="button" class="btn btn-enlace" id="op-demo">Ver la demostración</button></p>'
    );
    // Si se vuelve tras bloquear, el nombre y el cargo ya están: el foco, a la contraseña.
    if ($("d-nombre").value && $("d-cargo").value) $("d-pass").focus();
    $("f-entrar").addEventListener("submit", async function (e) {
      e.preventDefault();
      error("e-entrar", "");
      var o = leerEntrar("d", "e-entrar");
      if (!o) return;
      try {
        WA.App.recordarProvisional(o.contrasena);
        await ocupado(this.querySelector("[type=submit]"), "Comprobando…", function () { return WA.Sesion.entrar(o); });
      } catch (err) {
        error("e-entrar", err.message);
        $("d-pass").select();
      }
    });
    $("op-recuperar").addEventListener("click", recuperar);
    $("op-demo").addEventListener("click", demostracion);
    $("op-borrar").addEventListener("click", async function () {
      var ok = await WA.UI.confirmar("Se borrarán los datos de ABIES guardados en este navegador. Las copias de seguridad que se hayan descargado no se tocan. No se puede deshacer.",
        { titulo: "Borrar datos de este navegador", aceptar: "Borrar", peligro: true });
      if (!ok) return;
      await WA.Sesion.borrarDelNavegador();
      bienvenida();
    });
  }

  // ── Datos de antes de los usuarios ──────────────────────────────────────
  function actualizarAntigua() {
    pintar(
      "<h1>Nuevo acceso por usuarios</h1>" +
      '<p class="acceso-sub">En este navegador hay datos protegidos con una sola contraseña. A partir de ahora cada cargo tendrá la suya, además de la del archivo.</p>' +
      '<form id="f-act" class="acceso-form" novalidate>' +
      campo("a-vieja", "Contraseña que usabas hasta ahora", "password", ' autocomplete="current-password" required') +
      camposConfigurar() +
      '<p class="acceso-error" id="e-act" role="alert" hidden></p>' +
      '<button type="submit" class="btn btn-primario">Convertir y entrar</button></form>'
    );
    $("f-act").addEventListener("submit", async function (e) {
      e.preventDefault();
      error("e-act", "");
      var vieja = $("a-vieja").value;
      if (!vieja) { error("e-act", "Escribe la contraseña que usabas hasta ahora."); return; }
      var o = leerConfigurar("e-act");
      if (!o) return;
      o.contrasenaAntigua = vieja;
      try {
        await ocupado(this.querySelector("[type=submit]"), "Convirtiendo…", function () { return WA.Sesion.actualizarAntigua(o); });
        despuesDeConfigurar();
      } catch (err) { error("e-act", err.codigo === "CONTRASENA" ? "La contraseña que usabas hasta ahora no es correcta." : err.message); }
    });
  }

  // ── Recuperar una copia ──────────────────────────────────────────────────
  async function recuperar() {
    var archivo = await WA.UI.elegirArchivo(".json,application/json");
    if (!archivo) return;
    var lectura;
    try { lectura = WA.Copia.leer(archivo.texto); }
    catch (e) { WA.UI.aviso(e.message, "error"); return; }
    var hayDatos = (await WA.Sesion.tipoBoveda()) !== "ninguna";
    var fecha = lectura.creada ? " del " + esc(WA.Fechas.corta(lectura.creada.slice(0, 10))) : "";
    var aviso = hayDatos ? '<div class="caja-aviso"><strong>Sustituirá los datos de este navegador.</strong></div>' : "";
    var cuerpo, enviar;
    if (lectura.boveda) {
      cuerpo = '<p class="acceso-sub">Copia de ABIES' + fecha + ". Se abre con tu nombre, tu cargo y las contraseñas de cuando se hizo.</p>" + aviso + camposEntrar("r");
      enviar = function () { var o = leerEntrar("r", "e-rec"); if (o) WA.App.recordarProvisional(o.contrasena); return o; };
    } else if (lectura.cifrada) {
      cuerpo = '<p class="acceso-sub">Copia antigua' + fecha + ", de antes de los usuarios. Al recuperarla se configura el acceso por usuarios.</p>" + aviso +
        campo("r-vieja", "Contraseña de la copia", "password", ' autocomplete="current-password" required') + camposConfigurar();
      enviar = function () {
        var vieja = $("r-vieja").value;
        if (!vieja) { error("e-rec", "Escribe la contraseña de la copia."); return null; }
        var o = leerConfigurar("e-rec");
        if (o) o.contrasenaCopia = vieja;
        return o;
      };
    } else {
      cuerpo = '<p class="acceso-sub">Copia <strong>sin cifrar</strong>' + fecha + ". Al recuperarla se protege con el acceso por usuarios.</p>" + aviso + camposConfigurar();
      enviar = function () { return leerConfigurar("e-rec"); };
    }
    pintar("<h1>Recuperar copia</h1>" + '<form id="f-rec" class="acceso-form" novalidate>' + cuerpo +
      '<p class="acceso-error" id="e-rec" role="alert" hidden></p>' +
      '<button type="submit" class="btn btn-primario">Recuperar y entrar</button>' +
      '<button type="button" class="btn btn-enlace" id="volver">Volver</button></form>');
    $("volver").addEventListener("click", mostrar);
    $("f-rec").addEventListener("submit", async function (e) {
      e.preventDefault();
      error("e-rec", "");
      var o = enviar();
      if (!o) return;
      try {
        var r = await ocupado(this.querySelector("[type=submit]"), "Descifrando…", function () { return WA.Sesion.restaurar(lectura, o); });
        WA.UI.aviso("Copia recuperada" + (r && r.faltan ? ". Faltan " + r.faltan + " adjuntos que no venían en la copia." : "."));
        if (!lectura.boveda) despuesDeConfigurar();
      } catch (err) { error("e-rec", err.codigo === "CONTRASENA" ? "La contraseña de la copia no es correcta." : err.message); }
    });
  }

  // ── Demostración ─────────────────────────────────────────────────────────
  function demostracion() {
    var usuarios = WA.Sesion.usuariosDemo();
    pintar(
      "<h1>Demostración</h1>" +
      '<p class="acceso-sub">Datos inventados que no se guardan. Elige con qué cargo entrar para ver qué puede hacer cada uno.</p>' +
      '<div class="acceso-opciones">' + usuarios.map(function (u) {
        return '<button type="button" class="btn ' + (u.rol === "admin" ? "btn-primario" : "btn-secundario") + '" data-demo="' + esc(u.id) + '">' +
          esc(u.cargo) + ' <span class="detalle">· ' + esc(u.nombre) + "</span></button>";
      }).join("") + "</div>" +
      '<button type="button" class="btn btn-enlace" id="volver">Volver</button>'
    );
    $("volver").addEventListener("click", mostrar);
    Array.prototype.forEach.call(document.querySelectorAll("[data-demo]"), function (b) {
      b.addEventListener("click", function () { WA.Sesion.demostracion(b.getAttribute("data-demo")); });
    });
  }

  async function mostrar() {
    var tipo = await WA.Sesion.tipoBoveda();
    if (tipo === "abies") entrar();
    else if (tipo === "antigua") actualizarAntigua();
    else bienvenida();
  }

  WA.Acceso = { mostrar: mostrar };
})(typeof self !== "undefined" ? self : this);
</script>
  <script>/* js/modulos/inicio.js */
/*
 * webkit_asociaciones — Módulo «Inicio»: el panel de resumen.
 *
 * Arriba, lo que falta por rellenar (solo mientras falte). Después, en bloques:
 *   · Agenda: plazos que vencen, próximas actividades y subvenciones en marcha.
 *   · Dinero: saldo por cuenta, ingresos y gastos del año, presupuesto y su evolución.
 *   · Socios y cuotas: socios activos, altas y bajas, cuotas cobradas y deuda.
 *   · Copia de seguridad y junta.
 * Las cifras las calcula logica/informes.js (panel), que tiene tests.
 */
(function (raiz) {
  "use strict";
  var WA = raiz.WA, UI = WA.UI, esc = UI.esc, F = WA.Fechas, D = WA.Dinero;
  var euros = function (c) { return esc(D.formatear(c)); };
  var eurosRedondos = function (c) { return D.formatear(Math.round(c / 100) * 100).replace(/,00(?=\s*€)/, ""); };

  function tarjeta(id, titulo, cuerpo, enlace, clase) {
    return '<section class="tarjeta' + (clase ? " " + clase : "") + '" aria-labelledby="t-' + id + '"><h3 id="t-' + id + '">' + titulo + "</h3>" + cuerpo +
      (enlace ? '<a class="enlace-flecha" href="' + enlace[0] + '">' + enlace[1] + "</a>" : "") + "</section>";
  }

  async function pintar(cont, datos) {
    var hoy = F.hoy(), anio = +hoy.slice(0, 4);
    var c = await WA.TesUI.cargar(datos);
    var obligaciones = await datos.listar("obligaciones");
    var copia = await datos.estadoCopia();
    var a = c.asociacion, config = c.config;
    var p = WA.Informes.panel(c, hoy);
    var junta = WA.Informes.juntaEn(c.junta, hoy);
    var demo = WA.Sesion.modo === "demostración";

    // ── Para empezar ──
    var pendientes = [];
    if (!a.nombre) pendientes.push('<a href="#/asociacion">Escribe el nombre y los datos de la asociación</a>');
    if (!a.nif) pendientes.push('<a href="#/asociacion">Añade el NIF de la asociación</a>');
    if (!junta.length) pendientes.push('<a href="#/asociacion">Añade la junta directiva</a>');
    if (!(config.tiposSocio || []).some(function (t) { return t.cuota > 0; })) pendientes.push('<a href="#/cuotas/tipos">Pon el importe de la cuota de socio</a>');
    if (!c.socios.length) pendientes.push('<a href="#/socios">Da de alta a los socios (o impórtalos desde una hoja de cálculo)</a>');
    if (!c.documentos.some(function (d) { return d.categoria === "Estatutos"; })) pendientes.push('<a href="#/documentos">Adjunta los estatutos</a>');
    if (!obligaciones.length) pendientes.push('<a href="#/obligaciones">Elige las obligaciones (fiscales, asociativas, renovaciones) que queréis tener con aviso</a>');
    if (!demo && !copia.ultimaCopia) pendientes.push('<a href="#/copias">Descarga tu primera copia de seguridad</a>');

    // ── Agenda ──
    var venc = (await WA.ObligacionesUI.vencimientos(datos, (anio - 1) + "-01-01", F.sumarDias(hoy, 60)))
      .filter(function (v) { return v.estado === "vencida" || v.estado === "proxima"; }).slice(0, 6);
    var vencHtml = tarjeta("venc", "Plazos que vencen", venc.length ? '<ul class="lista-actividades">' + venc.map(function (v) {
      return '<li><a href="' + (v.origen === "subvencion" ? "#/proyectos/ficha/" + encodeURIComponent(v.proyectoId) : "#/obligaciones") + '"><strong>' + esc(v.titulo) + "</strong></a>" +
        '<span class="detalle">' + esc(F.corta(v.fecha)) + (v.etiqueta ? " · " + esc(v.etiqueta) : "") + " · " +
        (v.faltan < 0 ? '<span class="importe-negativo">venció hace ' + (-v.faltan) + " días</span>" : v.faltan === 0 ? "hoy" : "en " + v.faltan + " días") + "</span></li>";
    }).join("") + "</ul>" : '<p class="detalle">Nada en los próximos 60 días.</p>', ["#/obligaciones", "Ver obligaciones"],
      venc.some(function (v) { return v.estado === "vencida"; }) ? "tarjeta-alerta" : "");

    var A = WA.Actividades;
    var proximas = A.ordenar(c.actividades).filter(function (x) { return A.fechaDe(x) >= hoy && x.estado !== "cancelada"; }).slice(0, 4);
    var proximasHtml = tarjeta("act", "Próximas actividades", proximas.length ? '<ul class="lista-actividades">' + proximas.map(function (x) {
      var n = A.ocupadas(x);
      return '<li><a href="#/actividades/ficha/' + encodeURIComponent(x.id) + '"><strong>' + esc(x.titulo) + '</strong></a><span class="detalle">' +
        esc(F.corta(A.fechaDe(x))) + (x.todoElDia ? "" : " · " + esc(String(x.inicio).slice(11, 16))) + " · " + (x.aforo > 0 ? n + "/" + x.aforo + " plazas" : n + " inscritas") + "</span></li>";
    }).join("") + "</ul>" : '<p class="detalle">No hay ninguna prevista.</p>', ["#/actividades", "Ver calendario"]);

    var estados = {};
    WA.Obligaciones.ESTADOS_SUBVENCION.forEach(function (e) { estados[e[0]] = e[1]; });
    var subvHtml = p.subvencionesEnMarcha.length ? tarjeta("subv", "Subvenciones en marcha", '<ul class="lista-actividades">' + p.subvencionesEnMarcha.slice(0, 5).map(function (s) {
      return '<li><a href="#/proyectos/ficha/' + encodeURIComponent(s.id) + '"><strong>' + esc(s.nombre) + '</strong></a><span class="detalle">' + esc(estados[s.estadoSubvencion] || "") +
        (s.importeConcedido ? " · " + euros(s.importeConcedido) : s.importeSolicitado ? " · pedidos " + euros(s.importeSolicitado) : "") + "</span></li>";
    }).join("") + "</ul>", ["#/proyectos", "Ver presupuestos y subvenciones"]) : "";

    // ── Dinero ──
    var cuentasUsadas = config.cuentas.filter(function (k) { return k.activa !== false || p.saldo.porCuenta[k.id]; });
    var saldoHtml = tarjeta("saldo", "Saldo hoy", '<p><span class="cifra">' + euros(p.saldo.total) + "</span></p>" +
      (cuentasUsadas.length > 1 ? '<ul class="lista-cifras">' + cuentasUsadas.map(function (k) {
        return "<li><span>" + esc(k.nombre) + '</span><span class="importe">' + euros(p.saldo.porCuenta[k.id] || 0) + "</span></li>";
      }).join("") + "</ul>" : ""), ["#/tesoreria", "Ver tesorería"]);
    var sinClasificar = c.movimientos.filter(function (m) { return (m.tipo === "ingreso" || m.tipo === "gasto") && !m.categoriaId; }).length;
    var pg = p.presupuestoGastos, pi = p.presupuestoIngresos;
    var anioHtml = tarjeta("anio", "En " + anio,
      '<ul class="lista-cifras"><li><span>Ingresos</span><span class="importe">' + euros(p.ingresos) + "</span></li>" +
      "<li><span>Gastos</span><span class=\"importe\">−" + euros(p.gastos) + "</span></li>" +
      '<li class="total"><span>Resultado</span><span class="importe ' + (p.resultado < 0 ? "importe-negativo" : "") + '">' + euros(p.resultado) + "</span></li></ul>" +
      (sinClasificar ? '<p class="detalle"><a href="#/tesoreria/movimientos">' + sinClasificar + (sinClasificar === 1 ? " movimiento sin clasificar" : " movimientos sin clasificar") + "</a></p>" : ""),
      ["#/informes/cuentas", "Ver cuentas del año"]);
    var presHtml = tarjeta("pres", "Presupuesto " + anio, pg.previsto || pi.previsto

      UI.campo({ nombre: "email", etiqueta: "Correo", tipo: "email", valor: a.email, atributos: 'autocomplete="email"' }) +
      UI.campo({ nombre: "telefono", etiqueta: "Teléfono", tipo: "tel", valor: a.telefono }) +

  function tablaJunta(junta) {
    var orden = WA.Esquema.CARGOS;
    var actuales = junta.filter(vigente).sort(function (a, b) { return orden.indexOf(a.cargo) - orden.indexOf(b.cargo); });
    var anteriores = junta.filter(function (m) { return !vigente(m); }).sort(function (a, b) { return (b.hasta || "").localeCompare(a.hasta || ""); });
    function filas(lista) {
      return lista.map(function (m) {
        return "<tr><th scope=\"row\">" + esc(nombreCargo(m)) + "</th><td>" + esc(m.nombre) + "</td>" +

          "<td>" + esc(F.corta(m.desde)) + (m.hasta ? " – " + esc(F.corta(m.hasta)) : "") + "</td>" +
          '<td class="celda-acciones"><button type="button" class="btn btn-pequeno btn-secundario" data-editar="' + esc(m.id) + '" aria-label="Editar a ' + esc(m.nombre) + '">Editar</button></td></tr>';

    return (actuales.length
      ? '<div class="tabla-envoltorio"><table class="tabla"><caption class="sr">Junta directiva actual</caption>' + cabecera + "<tbody>" + filas(actuales) + "</tbody></table></div>"

      (anteriores.length

        UI.campo({ nombre: "email", etiqueta: "Correo", tipo: "email", valor: m.email }) +
        UI.campo({ nombre: "telefono", etiqueta: "Teléfono", tipo: "tel", valor: m.telefono }) +
        UI.campo({ nombre: "desde", etiqueta: "En el cargo desde", tipo: "date", valor: m.desde, requerido: true }) +

  <script>/* js/modulos/socios.js */
/*
 * webkit_asociaciones — Módulo «Socios»: libro de registro de socios.
 *
 *   #/socios                listado con búsqueda y filtros
 *   #/socios/nuevo          ficha vacía para dar de alta
 *   #/socios/ficha/<id>     ficha de un socio (datos, baja, cuotas)
 *   #/socios/libro          libro de registro para imprimir o guardar en PDF
 *
 * La lógica (estado, edad, filtros, validación, importación) está en
 * logica/socios.js, con tests. Aquí solo hay pantalla.
 */
(function (raiz) {
  "use strict";
  var WA = raiz.WA, UI = WA.UI, esc = UI.esc, F = WA.Fechas, S = WA.Socios, C = WA.Cuotas, D = WA.Dinero;

  // El filtro se recuerda mientras dura la sesión (al volver de una ficha sigue igual).
  var filtro = { texto: "", estado: "activo", tipoSocioId: "", orden: "numero" };

  var ESTADO_TEXTO = { activo: "Activo", baja: "Baja", futuro: "Alta futura" };

  async function cargar(datos) {
    var r = await Promise.all([datos.listar("socios"), datos.listar("cuotas"), datos.leer("config"), datos.leer("asociacion")]);
    return { socios: r[0].map(S.completar), cuotas: r[1], config: r[2], asociacion: r[3] };
  }
  var nombreTipo = function (config, id) {
    var t = (config.tiposSocio || []).filter(function (x) { return x.id === id; })[0];

  // ── Listado ──────────────────────────────────────────────────────────────

      n: lista.length,
      html: lista.map(function (s) {
        var e = S.estado(s);
        var cuota = deuda[s.id] ? '<span class="estado estado-aviso">Debe ' + esc(D.formatear(deuda[s.id])) + "</span>"
          : '<span class="estado estado-ok">Al corriente</span>';

          '<td class="num">' + esc(s.numero) + "</td>" +
          '<th scope="row"><a href="#/socios/ficha/' + encodeURIComponent(s.id) + '">' + esc(S.nombreListado(s) || "(sin nombre)") + "</a>" +
          (S.esMenor(s) ? ' <span class="etiqueta">Menor</span>' : "") + "</th>" +
          "<td>" + esc(nombreTipo(c.config, s.tipoSocioId)) + "</td>" +
          "<td>" + (e === "activo" ? esc(F.corta(s.fechaAlta)) : '<span class="estado estado-neutro">' + esc(ESTADO_TEXTO[e]) + "</span>") + "</td>" +
          "<td>" + cuota + "</td>" +
          '<td class="solo-ancho">' + (s.email ? '<a href="mailto:' + esc(s.email) + '">' + esc(s.email) + "</a>" : "") +
          (s.telefono ? '<br><span class="detalle">' + esc(s.telefono) + "</span>" : "") + "</td></tr>";
      }).join(""),
    };
  }

  async function pintarListado(cont, datos) {
    var c = await cargar(datos);
    var activos = c.socios.filter(function (s) { return S.estado(s) === "activo"; }).length;
    var tipos = [["", "Todos los tipos"]].concat((c.config.tiposSocio || []).map(function (t) { return [t.id, t.nombre]; }));
    cont.innerHTML =
      '<div class="cabecera-pagina"><h1>Socios</h1><a class="btn btn-primario" href="#/socios/nuevo">Nuevo socio</a></div>' +
      '<p class="intro">' + activos + (activos === 1 ? " socio activo" : " socios activos") + " · " + c.socios.length + " en el registro (con las bajas).</p>" +
      '<div class="barra-filtros" role="search">' +
      '<label class="filtro-texto"><span class="sr">Buscar</span><input type="search" id="s-buscar" placeholder="Buscar por nombre, documento, correo, teléfono…" value="' + esc(filtro.texto) + '"></label>' +
      '<label><span class="sr">Estado</span><select id="s-estado">' +
      [["activo", "Activos"], ["baja", "Bajas"], ["todos", "Todos"]].map(function (o) {
        return '<option value="' + o[0] + '"' + (filtro.estado === o[0] ? " selected" : "") + ">" + o[1] + "</option>";
      }).join("") + "</select></label>" +
      '<label><span class="sr">Tipo de socio</span><select id="s-tipo">' + tipos.map(function (o) {
        return '<option value="' + esc(o[0]) + '"' + (filtro.tipoSocioId === o[0] ? " selected" : "") + ">" + esc(o[1]) + "</option>";
      }).join("") + "</select></label>" +
      '<label><span class="sr">Orden</span><select id="s-orden"><option value="numero"' + (filtro.orden === "numero" ? " selected" : "") + '>Por número</option>' +
      '<option value="nombre"' + (filtro.orden === "nombre" ? " selected" : "") + ">Por apellidos</option></select></label>" +
      "</div>" +
      '<p class="detalle" id="s-cuenta" aria-live="polite"></p>' +
      '<div class="tabla-envoltorio"><table class="tabla"><caption class="sr">Socios</caption><thead><tr>' +
      '<th scope="col" class="num">Nº</th><th scope="col">Nombre</th><th scope="col">Tipo</th><th scope="col">Alta</th><th scope="col">Cuotas</th><th scope="col" class="solo-ancho">Contacto</th>' +
      '</tr></thead><tbody id="s-filas"></tbody></table></div>' +
      '<div class="acciones">' +
      '<button type="button" class="btn btn-secundario" id="s-importar">Importar desde CSV…</button>' +
      '<button type="button" class="btn btn-secundario lectura-ok" id="s-exportar">Exportar lista (CSV)</button>' +
      '<a class="btn btn-secundario" href="#/socios/libro">Libro de registro</a>' +
      '<a class="btn btn-secundario" href="#/cuotas/tipos">Tipos de socio y cuotas</a>' +
      "</div>";

    function refrescar() {
      var r = filasListado(c);
      cont.querySelector("#s-filas").innerHTML = r.html;
      cont.querySelector("#s-cuenta").textContent = r.n === 1 ? "1 socio en la lista." : r.n + " socios en la lista.";
    }
    cont.querySelector("#s-buscar").addEventListener("input", function (e) { filtro.texto = e.target.value; refrescar(); });
    cont.querySelector("#s-estado").addEventListener("change", function (e) { filtro.estado = e.target.value; refrescar(); });
    cont.querySelector("#s-tipo").addEventListener("change", function (e) { filtro.tipoSocioId = e.target.value; refrescar(); });
    cont.querySelector("#s-orden").addEventListener("change", function (e) { filtro.orden = e.target.value; refrescar(); });
    cont.querySelector("#s-importar").addEventListener("click", function () { importar(datos, c); });
    cont.querySelector("#s-exportar").addEventListener("click", function () { exportar(c); });
    refrescar();
  }

  // ── Exportar e importar ─────────────────────────────────────────────────
  async function exportar(c) {
    var lista = S.filtrar(c.socios, filtro);
    var ok = await UI.confirmar("El archivo tendrá " + lista.length + " socios con sus datos personales SIN CIFRAR. " +
      "Guárdalo en un lugar seguro y bórralo cuando ya no lo necesites.", { titulo: "Exportar socios", aceptar: "Exportar" });
    if (!ok) return;
    var filas = lista.map(function (s) { return Object.assign({}, s, { _tipoNombre: nombreTipo(c.config, s.tipoSocioId) }); });
    UI.descargar("socios-" + F.hoy() + ".csv", WA.CSV.escribir(S.COLUMNAS_CSV, filas), "text/csv;charset=utf-8");
  }

  async function importar(datos, c) {
    var archivo = await UI.elegirArchivo(".csv,text/csv,text/plain");
    if (!archivo) return;
    var lectura = WA.CSV.leer(archivo.texto);
    var r = S.desdeCSV(lectura, c.config.tiposSocio);
    var reconocidas = Object.keys(r.columnas);
    if (!r.socios.length) {
      UI.aviso("No se ha encontrado ningún socio en el archivo. Revisa que la primera fila tenga los títulos de las columnas (Nombre, Apellidos…).", "error");
      return;
    }
    // ¿Ya existen? (mismo documento o correo)
    var V = WA.Validar;
    var docs = {}, mails = {};
    c.socios.forEach(function (s) {
      if (s.documento) docs[V.normalizar(s.documento)] = true;
      if (s.email) mails[s.email.trim().toLowerCase()] = true;
    });
    var repetido = function (s) { return (s.documento && docs[V.normalizar(s.documento)]) || (s.email && mails[s.email.trim().toLowerCase()]); };
    var nRepetidos = r.socios.filter(repetido).length;

    var res = await UI.dialogo({
      titulo: "Importar socios",
      contenido: "<p>Se han encontrado <strong>" + r.socios.length + " socios</strong> en «" + esc(archivo.nombre) + "».</p>" +
        '<p class="detalle">Columnas reconocidas: ' + esc(reconocidas.join(", ")) + ". Las demás se ignoran.</p>" +
        (r.problemas.length ? '<details class="historico"><summary>' + r.problemas.length + " avisos</summary><ul class=\"lista\">" +
          r.problemas.slice(0, 50).map(function (p) { return "<li>Fila " + p.fila + ": " + esc(p.mensaje) + "</li>"; }).join("") +
          (r.problemas.length > 50 ? "<li>…</li>" : "") + "</ul></details>" : "") +
        "<form>" +
        (nRepetidos ? '<label class="casilla"><input type="checkbox" name="saltar" checked><span>Saltar los ' + nRepetidos +
          " que ya están (mismo documento o correo)</span></label>" : "") +
        '<label class="casilla"><input type="checkbox" name="numeros" checked><span>Respetar el número de socio del archivo cuando no choque con uno existente</span></label>' +
        "</form>",
      botones: [{ texto: "Cancelar", valor: "cancelar" }, { texto: "Importar", valor: "enviar", estilo: "btn-primario" }],
    });
    if (res.valor !== "enviar") return;
    var lista = res.datos.saltar ? r.socios.filter(function (s) { return !repetido(s); }) : r.socios;
    var usados = {};
    c.socios.forEach(function (s) { usados[s.numero] = true; });
    var contador = S.siguienteNumero(c.socios, c.config.siguienteNumeroSocio);
    // Primero los que traen número propio (si está libre), luego el resto a continuación.
    lista.forEach(function (s) {
      if (res.datos.numeros && s.numero && !usados[s.numero]) usados[s.numero] = true;
      else s.numero = null;
    });
    var maxPropio = Math.max.apply(null, [contador - 1].concat(lista.map(function (s) { return s.numero || 0; })));
    contador = maxPropio + 1;
    lista.forEach(function (s) { if (!s.numero) s.numero = contador++; });
    await datos.guardarVarios("socios", lista);
    c.config.siguienteNumeroSocio = contador;
    await datos.escribir("config", c.config);
    UI.aviso(lista.length + " socios importados.");
    WA.App.repintar();
  }

      UI.campo({ nombre: "tutorDocumento", etiqueta: "DNI/NIE", valor: tutor.documento, clase: "col-4", atributos: 'autocapitalize="characters"' }) +

      UI.campo({ nombre: "tipoSocioId", etiqueta: "Tipo de socio", tipo: "select", valor: s.tipoSocioId || (tipos[0] || [""])[0], opciones: tipos, clase: "col-5 col-movil-completo" }) +
      UI.campo({ nombre: "fechaAlta", etiqueta: "Fecha de alta", tipo: "date", valor: s.fechaAlta || F.hoy(), requerido: true, clase: "col-4" }) +
      UI.campo({ nombre: "formaPago", etiqueta: "Forma de pago habitual", tipo: "select", valor: s.formaPago, opciones: S.FORMAS_PAGO, clase: "col-4",
        ayuda: "Se propone al cobrar; cada cuota puede pagarse de otra forma." }) +

      UI.campo({ nombre: "titularCuenta", etiqueta: "Titular de la cuenta", valor: s.titularCuenta, clase: "col-7 col-movil-completo", ayuda: "Si no es el propio socio." }) +
      UI.campo({ nombre: "mandatoReferencia", etiqueta: "Referencia del mandato", valor: s.mandatoReferencia, clase: "col-5" }) +
      UI.campo({ nombre: "mandatoFecha", etiqueta: "Fecha de firma del mandato", tipo: "date", valor: s.mandatoFecha, clase: "col-4" }) +

  function periodicidadTexto(p) {
    return { anual: "al año", semestral: "al semestre", trimestral: "al trimestre", mensual: "al mes" }[p] || "";
  }

  /** Lee el formulario y lo vuelca sobre el socio. */
  function leerFicha(form, s) {
    var d = UI.leerFormulario(form);
    var V = WA.Validar;
    return Object.assign(S.completar(s), {
      nombre: d.nombre, apellidos: d.apellidos, sexo: d.sexo, tipoDocumento: d.tipoDocumento,
      documento: d.tipoDocumento === "Pasaporte" || d.tipoDocumento === "Otro" ? d.documento.toUpperCase() : V.normalizar(d.documento),
      fechaNacimiento: d.fechaNacimiento, ocupacion: d.ocupacion,
      email: d.email, telefono: d.telefono, telefono2: d.telefono2, direccion: WA.FormDireccion.leer(d),
      tutor: { nombre: d.tutorNombre, relacion: d.tutorRelacion, documento: V.normalizar(d.tutorDocumento), telefono: d.tutorTelefono, email: d.tutorEmail },
      tipoSocioId: d.tipoSocioId, fechaAlta: d.fechaAlta, formaPago: d.formaPago, exentoCuota: !!d.exentoCuota,
      iban: V.normalizar(d.iban), titularCuenta: d.titularCuenta, mandatoReferencia: d.mandatoReferencia, mandatoFecha: d.mandatoFecha,
      consentimientos: { proteccionDatos: d.proteccionDatos, imagen: !!d.imagen, comunicaciones: !!d.comunicaciones },
      notas: d.notas,
    });
  }

  var CAMPO_DE = { tutorNombre: "tutorNombre", codigoPostal: "codigoPostal" };

  async function pintarFicha(cont, datos, id) {
    var c = await cargar(datos);
    var s = id ? c.socios.filter(function (x) { return x.id === id; })[0] : S.vacio();
    if (!s) { cont.innerHTML = '<h1>Socio no encontrado</h1><p><a href="#/socios">Volver al listado</a></p>'; return; }
    var nuevo = !s.id;
    if (nuevo) s.formaPago = "Transferencia";
    var e = nuevo ? "activo" : S.estado(s);
    var misCuotas = c.cuotas.filter(function (q) { return q.socioId === s.id; })
      .sort(function (a, b) { return String(b.periodo).localeCompare(String(a.periodo)); });

    cont.innerHTML =
      '<p class="miga"><a href="#/socios">Socios</a> › ' + (nuevo ? "Nuevo" : "N.º " + esc(s.numero)) + "</p>" +
      '<div class="cabecera-pagina"><h1>' + (nuevo ? "Nuevo socio" : esc(S.nombreCompleto(s))) + "</h1>" +
      (!nuevo ? '<span class="estado ' + (e === "baja" ? "estado-neutro" : "estado-ok") + '">' + esc(ESTADO_TEXTO[e]) + "</span>" : "") + "</div>" + WA.UI.firma(s) +
      (e === "baja" ? '<div class="caja-aviso">Dado de baja el <strong>' + esc(F.corta(s.fechaBaja)) + "</strong>" +
        (s.motivoBaja ? " · " + esc(s.motivoBaja) : "") + '. <button type="button" class="btn btn-enlace" id="f-reactivar">Reactivar</button></div>' : "") +
      formularioFicha(s, c) +
      (nuevo ? "" :
        '<section class="tarjeta" aria-labelledby="t-cuotas"><div class="tarjeta-cabecera"><h2 id="t-cuotas">Cuotas</h2></div>' +
        '<div id="f-cuotas">' + WA.CuotasUI.tabla(misCuotas, { conSocio: false }) + "</div></section>" +
        '<section class="tarjeta zona-peligro" aria-labelledby="t-baja"><h2 id="t-baja">Baja y eliminación</h2>' +
        "<p>La <strong>baja</strong> conserva su ficha y su historial en el libro de registro. <strong>Eliminar</strong> borra sus datos personales " +
        "(por ejemplo, si ejerce su derecho de supresión); las cuotas ya pagadas se conservan en la contabilidad con su nombre y número.</p>" +
        '<div class="acciones">' + (e !== "baja" ? '<button type="button" class="btn btn-secundario" id="f-baja">Dar de baja…</button>' : "") +
        '<button type="button" class="btn btn-peligro-suave" id="f-eliminar">Eliminar socio…</button></div></section>');

    var form = cont.querySelector("#f-socio");
    WA.FormDireccion.conectar(form);

    // Mostrar u ocultar lo que depende de otros campos.
    function dependencias() {
      var d = UI.leerFormulario(form);
      var edad = S.edad(d.fechaNacimiento);
      cont.querySelector("#f-edad").textContent = edad !== null ? edad + (edad === 1 ? " año" : " años") : "";
      var menor = edad !== null && edad < S.MAYORIA_EDAD;
      cont.querySelector("#f-tutor").hidden = !menor && !d.tutorNombre;
      cont.querySelector("#f-sepa").hidden = d.formaPago !== "Domiciliación" && !d.iban;
    }
    form.addEventListener("input", dependencias);
    form.addEventListener("change", dependencias);
    dependencias();

    form.addEventListener("submit", async function (ev) {
      ev.preventDefault();
      var socio = leerFicha(form, s);
      var r = S.revisar(socio, c.socios);
      // Limpia y marca errores (impiden guardar) y avisos (no).
      Array.prototype.forEach.call(form.querySelectorAll("[data-campo]"), function (el) { UI.marcarError(form, el.getAttribute("data-campo"), ""); });
      Object.keys(r.avisos).forEach(function (k) { UI.marcarError(form, CAMPO_DE[k] || k, r.avisos[k]); });
      var nAvisos = Object.keys(r.avisos).length + WA.FormDireccion.revisar(form, UI.leerFormulario(form));
      Object.keys(r.errores).forEach(function (k) { UI.marcarError(form, k, r.errores[k]); });
      var errores = Object.keys(r.errores);
      if (errores.length) {
        var primero = form.elements[errores[0]];
        if (primero) primero.focus();
        UI.aviso("Revisa los campos marcados en rojo.", "error");
        return;
      }
      if (nuevo) {
        socio.numero = S.siguienteNumero(c.socios, c.config.siguienteNumeroSocio);
        c.config.siguienteNumeroSocio = socio.numero + 1;
        await datos.escribir("config", c.config);
      }
      var guardado = await datos.guardar("socios", socio);
      UI.aviso((nuevo ? "Alta hecha: socio n.º " + guardado.numero + "." : "Cambios guardados.") +
        (nAvisos ? " Hay avisos en algunos campos; revísalos." : ""), nAvisos ? "info" : "ok");
      if (nuevo) {
        await ofrecerCuotaActual(datos, guardado, c);
        location.hash = "#/socios/ficha/" + encodeURIComponent(guardado.id);
      }
    });

    if (nuevo) return;
    // Tras cobrar o anular una cuota se repinta solo su tabla: así no se pierde lo que se esté editando arriba.
    var zonaCuotas = cont.querySelector("#f-cuotas");
    WA.CuotasUI.conectar(zonaCuotas, datos, async function () {
      var lista = (await datos.listar("cuotas")).filter(function (q) { return q.socioId === s.id; })
        .sort(function (a, b) { return String(b.periodo).localeCompare(String(a.periodo)); });
      zonaCuotas.innerHTML = WA.CuotasUI.tabla(lista, { conSocio: false });
    });
    cont.querySelector("#f-eliminar").addEventListener("click", function () { eliminar(datos, s); });
    var bBaja = cont.querySelector("#f-baja");
    if (bBaja) bBaja.addEventListener("click", function () { darDeBaja(datos, s, c.cuotas); });
    var bReac = cont.querySelector("#f-reactivar");
    if (bReac) bReac.addEventListener("click", async function () {
      if (!(await UI.confirmar("Volverá a figurar como socio activo (se borra la fecha de baja).", { titulo: "Reactivar socio", aceptar: "Reactivar" }))) return;
      await datos.guardar("socios", Object.assign(s, { fechaBaja: "", motivoBaja: "" }));
      UI.aviso("Socio reactivado.");
      WA.App.repintar();
    });
  }

  /** Tras un alta: si ya se emitieron las cuotas del periodo actual, ofrece emitir la suya. */
  async function ofrecerCuotaActual(datos, socio, c) {
    var tipo = (c.config.tiposSocio || []).filter(function (t) { return t.id === socio.tipoSocioId; })[0];
    if (!tipo || !(tipo.cuota > 0) || socio.exentoCuota) return;
    var p = C.periodoDeFecha(tipo.periodicidad, socio.fechaAlta);
    var yaEmitidas = c.cuotas.some(function (q) { return q.periodo === p.clave; });
    if (!yaEmitidas) return;
    var r = C.generar({ periodo: p.clave, socios: [socio], tipos: c.config.tiposSocio, cuotas: c.cuotas });
    if (r.nuevas.length !== 1) return;
    var ok = await UI.confirmar("Las cuotas del " + p.etiqueta + " ya se emitieron. ¿Emitir también la de este socio (" + D.formatear(r.total) + ")?",
      { titulo: "Cuota del periodo actual", aceptar: "Emitir su cuota", cancelar: "Ahora no" });
    if (ok) { await datos.guardar("cuotas", r.nuevas[0]); UI.aviso("Cuota emitida."); }
  }

  async function darDeBaja(datos, s, cuotas) {
    var pendientes = cuotas.filter(function (q) { return q.socioId === s.id && C.debe(q); });
    var r = await UI.dialogo({
      titulo: "Dar de baja a " + S.nombreCompleto(s),
      contenido: '<form class="formulario" novalidate><div class="rejilla">' +
        UI.campo({ nombre: "fechaBaja", etiqueta: "Fecha de baja", tipo: "date", valor: F.hoy(), requerido: true }) +
        UI.campo({ nombre: "motivoBaja", etiqueta: "Motivo", valor: "", lista: ["Voluntaria", "Impago de cuotas", "Fallecimiento", "Expulsión", "Traslado"] }) +
        "</div>" +
        (pendientes.length ? '<label class="casilla"><input type="checkbox" name="anular" checked><span>Anular sus ' + pendientes.length +
          " cuotas pendientes (" + esc(D.formatear(D.sumar(pendientes.map(function (q) { return q.importe; })))) + ")</span></label>" : "") +
        '<p class="detalle">Las causas y el procedimiento de baja los fijan vuestros estatutos.</p></form>',
      botones: [{ texto: "Cancelar", valor: "cancelar" }, { texto: "Dar de baja", valor: "enviar", estilo: "btn-primario" }],
      validar: function (form) {
        var ok = F.esValida(form.elements.fechaBaja.value) && form.elements.fechaBaja.value >= s.fechaAlta;
        UI.marcarError(form, "fechaBaja", ok ? "" : "Pon una fecha válida, posterior al alta.");
        return ok;
      },
    });

  <script>/* js/modulos/cuotas.js */

 */
(function (raiz) {
  "use strict";
  var WA = raiz.WA, UI = WA.UI, esc = UI.esc, F = WA.Fechas, S = WA.Socios, C = WA.Cuotas, D = WA.Dinero;

  var estadoVista = { periodo: null, estado: "todas", texto: "" };

  var CLASE_ESTADO = { pendiente: "estado-aviso", pagada: "estado-ok", devuelta: "estado-error", anulada: "estado-neutro" };
  var PERIODICIDAD_TEXTO = { anual: "al año", semestral: "al semestre", trimestral: "al trimestre", mensual: "al mes" };

  // ── Tabla de cuotas reutilizable ─────────────────────────────────────────
  /**
   * opciones: { conSocio (columna con el socio), seleccionable (casillas para cobrar varias) }

   */
  function tabla(cuotas, opciones) {
    var o = opciones || {};
    if (!cuotas.length) return '<p class="vacio">No hay cuotas.</p>';
    return '<div class="tabla-envoltorio"><table class="tabla"><caption class="sr">Cuotas</caption><thead><tr>' +
      (o.seleccionable ? '<th scope="col" class="celda-casilla"><input type="checkbox" data-todas aria-label="Seleccionar todas las pendientes"></th>' : "") +
      // Con socio (vista de un periodo) el concepto sobra: todas son del mismo periodo.
      (o.conSocio ? '<th scope="col" class="num">Nº</th><th scope="col">Socio</th>' : '<th scope="col">Concepto</th>') +
      '<th scope="col" class="importe">Importe</th><th scope="col">Estado</th><th scope="col">Pago</th>' +
      '<th scope="col"><span class="sr">Acciones</span></th></tr></thead><tbody>' +
      cuotas.map(function (q) {
        var debe = C.debe(q);
        var pago = q.pago ? esc(F.corta(q.pago.fecha)) + " · " + esc(q.pago.forma) : "";
        return "<tr>" +
          (o.seleccionable ? '<td class="celda-casilla">' + (debe ? '<input type="checkbox" data-sel="' + esc(q.id) + '" aria-label="Seleccionar la cuota de ' + esc(q.socioNombre) + '">' : "") + "</td>" : "") +
          (o.conSocio ? '<td class="num">' + esc(q.socioNumero) + '</td><th scope="row">' +
            (q.socioId ? '<a href="#/socios/ficha/' + encodeURIComponent(q.socioId) + '">' + esc(q.socioNombre) + "</a>" : esc(q.socioNombre)) + "</th>"
            : "<td>" + esc(q.concepto) + "</td>") +
          '<td class="importe">' + esc(D.formatear(q.importe)) + "</td>" +
          '<td><span class="estado ' + CLASE_ESTADO[q.estado] + '">' + esc(C.ESTADOS[q.estado]) + "</span></td>" +
          "<td>" + pago + "</td>" +
          '<td class="celda-acciones">' +
          (debe ? '<button type="button" class="btn btn-pequeno btn-primario" data-accion="cobrar" data-id="' + esc(q.id) + '">Cobrar</button> ' : "") +
          '<button type="button" class="btn btn-pequeno btn-secundario" data-accion="mas" data-id="' + esc(q.id) + '" aria-label="Más opciones de la cuota de ' + esc(q.socioNombre) + '">Más…</button>' +
          "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  /** Diálogo de cobro (una o varias cuotas). Devuelve el pago o null. */
  async function pedirPago(cuotas, socio, config) {
    var forma = (socio && socio.formaPago) || "Transferencia";
    var cuentas = (config.cuentas || []).map(function (c) { return [c.id, c.nombre]; });
    var total = D.sumar(cuotas.map(function (q) { return q.importe; }));
    var r = await UI.dialogo({
      titulo: cuotas.length === 1 ? "Cobrar cuota" : "Cobrar " + cuotas.length + " cuotas",
      contenido: "<p>" + (cuotas.length === 1 ? esc(cuotas[0].socioNombre) + " · " + esc(cuotas[0].concepto) : cuotas.length + " cuotas") +
        " · <strong>" + esc(D.formatear(total)) + "</strong></p>" +
        '<form class="formulario" novalidate><div class="rejilla">' +
        UI.campo({ nombre: "fecha", etiqueta: "Fecha del pago", tipo: "date", valor: F.hoy(), requerido: true }) +
        UI.campo({ nombre: "forma", etiqueta: "Forma de pago", tipo: "select", valor: forma, opciones: S.FORMAS_PAGO }) +
        UI.campo({ nombre: "cuentaId", etiqueta: "Dónde entra el dinero", tipo: "select", valor: C.cuentaPorDefecto(forma, config.cuentas), opciones: cuentas }) +
        UI.campo({ nombre: "referencia", etiqueta: "Referencia (opcional)", valor: "", ayuda: "N.º de operación, concepto de la transferencia…" }) +
        "</div></form>",
      botones: [{ texto: "Cancelar", valor: "cancelar" }, { texto: "Marcar como pagada" + (cuotas.length > 1 ? "s" : ""), valor: "enviar", estilo: "btn-primario" }],
      validar: function (form) {
        var ok = F.esValida(form.elements.fecha.value);
        UI.marcarError(form, "fecha", ok ? "" : "Pon la fecha del pago.");
        return ok;
      },
      alAbrir: function (d) {
        // Al cambiar la forma de pago se propone la cuenta que le corresponde (efectivo → caja).
        var f = d.querySelector("form");
        f.elements.forma.addEventListener("change", function () { f.elements.cuentaId.value = C.cuentaPorDefecto(f.elements.forma.value, config.cuentas); });
      },
    });

  }

  /** Menú «Más…» de una cuota: deshacer pago, devuelta, anular, reactivar, cambiar importe, borrar. */
  async function masOpciones(datos, q) {
    var botones = [{ texto: "Cerrar", valor: "cancelar" }];
    if (q.estado === "pagada") botones.unshift({ texto: "Deshacer el pago", valor: "deshacer" }, { texto: "El banco la devolvió", valor: "devolver" });
    if (q.estado === "pendiente" || q.estado === "devuelta") botones.unshift({ texto: "Cambiar importe…", valor: "importe" }, { texto: "Anular", valor: "anular" });
    if (q.estado === "anulada") botones.unshift({ texto: "Volver a pendiente", valor: "reactivar" }, { texto: "Borrar", valor: "borrar" });
    var historial = (q.historial || []).map(function (h) { return "<li>" + esc(F.corta(h.fecha)) + " · " + esc(h.accion) + (h.detalle ? " · " + esc(h.detalle) : "") + "</li>"; }).join("");
    var r = await UI.dialogo({
      titulo: q.concepto,
      contenido: "<p>" + esc(q.socioNombre) + " · " + esc(D.formatear(q.importe)) + " · " + esc(C.ESTADOS[q.estado]) + "</p>" +
        (q.pago ? '<p class="detalle">Pagada el ' + esc(F.corta(q.pago.fecha)) + " por " + esc(q.pago.forma) + (q.pago.referencia ? " · " + esc(q.pago.referencia) : "") + "</p>" : "") +
        (historial ? '<details class="historico"><summary>Historial</summary><ul class="lista">' + historial + "</ul></details>" : ""),
      botones: botones,
    });
    var v = r.valor;
    if (v === "deshacer") await datos.guardar("cuotas", C.deshacerPago(q));
    else if (v === "devolver") await datos.guardar("cuotas", C.devolver(q, F.hoy(), "Devolución bancaria"));
    else if (v === "anular") {
      if (!(await UI.confirmar("La cuota dejará de contar como deuda. Se puede volver a poner como pendiente.", { titulo: "Anular cuota", aceptar: "Anular" }))) return false;
      await datos.guardar("cuotas", C.anular(q, ""));
    } else if (v === "reactivar") await datos.guardar("cuotas", C.reactivar(q));
    else if (v === "borrar") {
      if (!(await UI.confirmar("Se borrará la cuota anulada. Si solo quieres que no cuente, basta con dejarla anulada.", { titulo: "Borrar cuota", aceptar: "Borrar", peligro: true }))) return false;
      await datos.borrar("cuotas", q.id);

        titulo: "Cambiar importe",
        contenido: '<form class="formulario" novalidate>' +
          UI.campo({ nombre: "importe", etiqueta: "Importe (€)", valor: D.formatear(q.importe, { simbolo: false }), atributos: 'inputmode="decimal"',
            ayuda: "Por ejemplo, para prorratear a quien entra a mitad de periodo." }) +
          UI.campo({ nombre: "motivo", etiqueta: "Motivo", valor: "" }) + "</form>",
        botones: [{ texto: "Cancelar", valor: "cancelar" }, { texto: "Guardar", valor: "enviar", estilo: "btn-primario" }],
        validar: function (form) {
          var c = D.desdeTexto(form.elements.importe.value);
          var ok = c !== null && c > 0;

  }

  /** Conecta los botones de una tabla de cuotas. alTerminar() se llama tras cualquier cambio. */
  function conectar(contenedor, datos, alTerminar) {
    contenedor.addEventListener("click", async function (e) {
      var b = e.target.closest("[data-accion]");
      if (!b) return;
      var q = await datos.obtener("cuotas", b.getAttribute("data-id"));
      if (!q) return;
      var cambio = false;
      if (b.getAttribute("data-accion") === "cobrar") {
        var config = await datos.leer("config");
        var socio = q.socioId ? await datos.obtener("socios", q.socioId) : null;
        var pago = await pedirPago([q], socio, config);
        if (pago) {
          try { await datos.guardar("cuotas", C.registrarPago(q, pago)); cambio = true; UI.aviso("Cuota cobrada."); }
          catch (err) { UI.aviso(err.message, "error"); }
        }

  WA.CuotasUI = { tabla: tabla, conectar: conectar };

  // ── Pestañas del módulo ─────────────────────────────────────────────────
  function pestanas(actual) {
    var p = [["", "Cuotas"], ["impagados", "Impagados"], ["tipos", "Tipos de socio"]];
    return '<nav class="pestanas" aria-label="Apartados de cuotas">' + p.map(function (x) {
      return '<a href="#/cuotas' + (x[0] ? "/" + x[0] : "") + '"' + (actual === x[0] ? ' aria-current="page"' : "") + ">" + x[1] + "</a>";
    }).join("") + "</nav>";
  }

  async function cargar(datos) {
    var r = await Promise.all([datos.listar("socios"), datos.listar("cuotas"), datos.leer("config"), datos.listar("remesas")]);
    return { socios: r[0].map(S.completar), cuotas: r[1], config: r[2], remesas: r[3] };
  }

  /** Periodos que tiene sentido ofrecer: los de los tipos de socio activos (año anterior, actual y siguiente) y los que ya tienen cuotas. */
  function periodosDisponibles(c) {
    var anio = +F.hoy().slice(0, 4), claves = {};
    var periodicidades = {};
    (c.config.tiposSocio || []).forEach(function (t) { if (t.activo !== false && t.cuota > 0) periodicidades[t.periodicidad || "anual"] = true; });
    if (!Object.keys(periodicidades).length) periodicidades.anual = true;
    Object.keys(periodicidades).forEach(function (p) {
      [anio - 1, anio, anio + 1].forEach(function (a) { C.periodosDelAnio(p, a).forEach(function (x) { claves[x.clave] = x; }); });
    });
    c.cuotas.forEach(function (q) { var p = C.periodo(q.periodo); if (p) claves[p.clave] = p; });
    // Del año más reciente al más antiguo; dentro de cada año, el año entero primero y luego sus partes en orden.
    var orden = { anual: 0, semestral: 1, trimestral: 2, mensual: 3 };
    return Object.keys(claves).map(function (k) { return claves[k]; }).sort(function (a, b) {
      return b.anio - a.anio || orden[a.periodicidad] - orden[b.periodicidad] || a.inicio.localeCompare(b.inicio);
    });

  function periodoPorDefecto(c) {
    var t = (c.config.tiposSocio || []).filter(function (x) { return x.activo !== false && x.cuota > 0; })[0];

  // ── Cuotas de un periodo ────────────────────────────────────────────────
  async function pintarPeriodo(cont, datos) {
    var c = await cargar(datos);
    var periodos = periodosDisponibles(c);
    if (!estadoVista.periodo) estadoVista.periodo = periodoPorDefecto(c);

    var delPeriodo = c.cuotas.filter(function (q) { return q.periodo === p.clave; })

        return '<option value="' + esc(x.clave) + '"' + (x.clave === p.clave ? " selected" : "") + ">" + esc(x.etiqueta.charAt(0).toUpperCase() + x.etiqueta.slice(1)) + "</option>";
      }).join("") + "</select></label>" +
      '<button type="button" class="btn btn-primario" id="q-emitir"' + (sinCuota ? " disabled" : "") + ">Emitir cuotas de este periodo…</button></div>" +
      '<div class="rejilla-tarjetas cifras">' +
      cifra("Emitido", res.emitido, res.nPagadas + res.nPendientes + " cuotas") +
      cifra("Cobrado", res.cobrado, res.nPagadas + " pagadas") +
      cifra("Pendiente", res.pendiente, res.nPendientes + " sin cobrar") +
      '<section class="tarjeta"><h2>Por forma de pago</h2>' + (Object.keys(res.porForma).length ? '<ul class="lista-cifras">' +
        Object.keys(res.porForma).map(function (f) { return "<li><span>" + esc(f) + "</span><strong>" + esc(D.formatear(res.porForma[f])) + "</strong></li>"; }).join("") + "</ul>"
        : '<p class="detalle">Nada cobrado todavía.</p>') + "</section></div>" +
      '<div class="barra-filtros"><label class="filtro-texto"><span class="sr">Buscar socio</span><input type="search" id="q-buscar" placeholder="Buscar socio…" value="' + esc(estadoVista.texto) + '"></label>' +
      '<label><span class="sr">Estado</span><select id="q-estado">' + [["todas", "Todas"], ["debe", "Sin cobrar"], ["pagada", "Pagadas"], ["anulada", "Anuladas"]].map(function (o) {
        return '<option value="' + o[0] + '"' + (estadoVista.estado === o[0] ? " selected" : "") + ">" + o[1] + "</option>";
      }).join("") + "</select></label>" +
      '<button type="button" class="btn btn-secundario" id="q-cobrar-sel" disabled>Cobrar seleccionadas</button>' +
      '<button type="button" class="btn btn-secundario lectura-ok" id="q-exportar">Exportar (CSV)</button></div>' +
      '<div id="q-tabla"></div>';

    function visibles() {
      var t = estadoVista.texto.trim().toLowerCase();
      return delPeriodo.filter(function (q) {
        if (estadoVista.estado === "debe" && !C.debe(q)) return false;
        if (estadoVista.estado !== "todas" && estadoVista.estado !== "debe" && q.estado !== estadoVista.estado) return false;
        return !t || (q.socioNombre + " " + q.socioNumero).toLowerCase().indexOf(t) >= 0;

    }
    var zona = cont.querySelector("#q-tabla");
    var bSel = cont.querySelector("#q-cobrar-sel");

      zona.innerHTML = delPeriodo.length ? tabla(visibles(), { conSocio: true, seleccionable: true })
