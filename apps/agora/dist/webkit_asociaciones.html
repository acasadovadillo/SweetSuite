        var est = ESTADO[e.estado];
        return "<tr><td>" + esc(F.corta(f.fecha)) + '</td><th scope="row"><a href="#/facturas/ver/' + encodeURIComponent(f.id) + '">' + esc(f.numero || "(borrador)") + "</a></th>" +
          "<td>" + esc((f.tercero || {}).nombre) + '</td><td class="importe solo-ancho">' + esc(D.formatear(tot.base)) + '</td><td class="importe solo-ancho">' + esc(D.formatear(tot.cuota)) + "</td>" +
          '<td class="importe">' + esc(D.formatear(tot.total)) + '</td><td><span class="estado ' + est[0] + '">' + est[1] + "</span></td></tr>";
      });
      cont.querySelector("#f-tabla").innerHTML = !lista.length ? '<p class="vacio">No hay facturas.</p>' :
        '<div class="tabla-envoltorio"><table class="tabla"><caption class="sr">Facturas</caption><thead><tr><th scope="col">Fecha</th><th scope="col">Número</th>' +
        '<th scope="col">' + (tipo === "emitida" ? "Cliente" : "Proveedor") + '</th><th scope="col" class="importe solo-ancho">Base</th><th scope="col" class="importe solo-ancho">IVA</th>' +
        '<th scope="col" class="importe">Total</th><th scope="col">Estado</th></tr></thead><tbody>' + filas.join("") + "</tbody>" +
        '<tfoot><tr><th scope="row" colspan="3">Total (sin borradores ni anuladas)</th><td class="importe solo-ancho">' + esc(D.formatear(sumas.base)) + '</td><td class="importe solo-ancho">' +
        esc(D.formatear(sumas.cuota)) + '</td><td class="importe">' + esc(D.formatear(sumas.total)) + '</td><td class="detalle">Pendiente ' + esc(D.formatear(sumas.pendiente)) + "</td></tr></tfoot></table></div>";
    }
    refrescar();
    cont.querySelector("#f-anio").addEventListener("change", function (e) { vista.anio = e.target.value; refrescar(); });
    cont.querySelector("#f-buscar").addEventListener("input", function (e) { vista.texto = e.target.value; refrescar(); });
  }

  // ── Editor ──────────────────────────────────────────────────────────────
  function facturaNueva(tipo, c) {
    // Se empieza sujeta al 21 %: la categoría (y con ella el IVA habitual) se elige después.
    var trat = "sujeto";
    return { tipo: tipo, estado: tipo === "emitida" ? "borrador" : "emitida", serie: c.config.facturacion.serie || "", numero: "", fecha: F.hoy(), fechaOperacion: "",
      vencimiento: "", tercero: { nombre: "", nif: "", direccion: "", email: "" }, lineas: [Fac.lineaVacia(trat)], retencionPct: 0,
      deducible: !!c.config.iva.presenta, motivoExencion: tipo === "emitida" ? c.config.facturacion.motivoExencion || "" : "",
      categoriaId: tipo === "emitida" ? "" : "", proyectoId: "", notas: "" };
  }

  function filaLinea(l, i, bloqueada) {
    var dis = bloqueada ? " disabled" : "";
    return '<tr data-linea="' + i + '">' +
      '<td><label class="sr" for="l-concepto-' + i + '">Concepto</label><input id="l-concepto-' + i + '" name="concepto-' + i + '" value="' + esc(l.concepto) + '"' + dis + "></td>" +
      '<td class="col-cantidad"><label class="sr" for="l-cantidad-' + i + '">Cantidad</label><input id="l-cantidad-' + i + '" name="cantidad-' + i + '" inputmode="decimal" value="' + esc(String(l.cantidad).replace(".", ",")) + '"' + dis + "></td>" +
      '<td class="col-precio"><label class="sr" for="l-precio-' + i + '">Precio unitario</label><input id="l-precio-' + i + '" name="precio-' + i + '" inputmode="decimal" value="' + esc(D.formatear(l.precio, { simbolo: false })) + '"' + dis + "></td>" +
      '<td><label class="sr" for="l-trat-' + i + '">IVA</label><select id="l-trat-' + i + '" name="tratamiento-' + i + '"' + dis + ">" + Fac.TRATAMIENTOS.map(function (t) {
        return '<option value="' + t[0] + '"' + (l.tratamiento === t[0] ? " selected" : "") + ">" + t[1] + "</option>";
      }).join("") + "</select></td>" +
      '<td class="col-tipo"><label class="sr" for="l-tipo-' + i + '">Tipo de IVA</label><select id="l-tipo-' + i + '" name="tipoIva-' + i + '"' + dis + (l.tratamiento !== "sujeto" ? " hidden" : "") + ">" + Fac.TIPOS_IVA.map(function (t) {
        return '<option value="' + t + '"' + (Number(l.tipoIva) === t ? " selected" : "") + ">" + t + " %</option>";
      }).join("") + "</select></td>" +
      '<td class="importe" data-base-linea>' + esc(D.formatear(Fac.baseLinea(l))) + "</td>" +
      (bloqueada ? "" : '<td><button type="button" class="btn-icono" data-quitar-linea="' + i + '" aria-label="Quitar la línea ' + (i + 1) + '">✕</button></td>') + "</tr>";
  }

  function totalesHtml(f) {
    var t = Fac.totales(f);
    return '<table class="tabla tabla-totales"><tbody>' + t.porTipo.map(function (g) {
      return "<tr><th scope=\"row\">Base " + (g.tratamiento === "sujeto" ? g.tipoIva + " %" : TRAT[g.tratamiento].toLowerCase()) + '</th><td class="importe">' + esc(D.formatear(g.base)) + "</td></tr>" +
        (g.tratamiento === "sujeto" ? "<tr><th scope=\"row\">IVA " + g.tipoIva + ' %</th><td class="importe">' + esc(D.formatear(g.cuota)) + "</td></tr>" : "");
    }).join("") + (t.retencion ? '<tr><th scope="row">Retención IRPF ' + esc(f.retencionPct) + ' %</th><td class="importe">−' + esc(D.formatear(t.retencion)) + "</td></tr>" : "") +
      '<tr class="total"><th scope="row">Total</th><td class="importe">' + esc(D.formatear(t.total)) + "</td></tr></tbody></table>";
  }

  /** Lee el formulario del editor y lo vuelca en la factura. */
  function leerEditor(form, f) {
    var d = UI.leerFormulario(form);
    var lineas = [];
    form.querySelectorAll("[data-linea]").forEach(function (tr) {
      var i = tr.getAttribute("data-linea");
      // «1,5» (coma decimal, con o sin puntos de miles) o «1.5»: las dos valen.
      var textoCant = String(d["cantidad-" + i] || "0").trim();
      var cant = Number(textoCant.indexOf(",") >= 0 ? textoCant.replace(/\./g, "").replace(",", ".") : textoCant);
      lineas.push({ concepto: d["concepto-" + i] || "", cantidad: isFinite(cant) ? cant : 0, precio: D.desdeTexto(d["precio-" + i] || "0") || 0,
        tratamiento: d["tratamiento-" + i] || "sujeto", tipoIva: Number(d["tipoIva-" + i] || 21) });
    });
    return Object.assign(f, {
      fecha: d.fecha, vencimiento: d.vencimiento, numero: f.tipo === "recibida" ? d.numero : f.numero,
      tercero: { nombre: d.terceroNombre, nif: WA.Validar.normalizar(d.terceroNif), direccion: d.terceroDireccion, email: d.terceroEmail },
      lineas: lineas, retencionPct: Number(String(d.retencionPct || "0").replace(",", ".")) || 0, motivoExencion: d.motivoExencion || "",
      categoriaId: d.categoriaId, proyectoId: d.proyectoId, notas: d.notas, deducible: f.tipo === "recibida" ? !!d.deducible : f.deducible,
    });
  }

  async function pintarEditor(cont, datos, f, c) {
    var nueva = !f.id;
    var bloqueada = f.tipo === "emitida" && f.estado !== "borrador" && !f._desbloqueada;
    var esEmitida = f.tipo === "emitida";
    var terceros = {};
    c.facturas.forEach(function (x) { if (x.tipo === f.tipo && x.tercero && x.tercero.nombre) terceros[x.tercero.nombre] = x.tercero; });
    var e = f.id ? Fac.estadoPago(f, c.movimientos, c.anticipos) : null;
    var pagos = f.id ? c.movimientos.filter(function (m) { return m.facturaId === f.id; }) : [];
    var dis = bloqueada ? " disabled" : "";

    cont.innerHTML =
      '<p class="miga"><a href="#/facturas' + (esEmitida ? "" : "/recibidas") + '">Facturas ' + (esEmitida ? "emitidas" : "recibidas") + "</a> › " + esc(f.numero || (nueva ? "Nueva" : "Borrador")) + "</p>" +
      '<div class="cabecera-pagina"><h1>' + (esEmitida ? "Factura " : "Factura recibida ") + esc(f.numero || (esEmitida ? "(borrador)" : "")) + "</h1>" +
      (e ? '<span class="estado ' + ESTADO[e.estado][0] + '">' + ESTADO[e.estado][1] + "</span>" : "") + "</div>" + WA.UI.firma(f) +
      (bloqueada && f.estado === "emitida" ? '<div class="caja-aviso">Factura emitida: está bloqueada. Para corregirla lo habitual es hacer una factura rectificativa (verificar con asesoría).</div>' : "") +
      '<form id="f-editor" class="formulario" novalidate><fieldset' + dis + ">" +
      '<section class="tarjeta"><h2>' + (esEmitida ? "Cliente" : "Proveedor") + '</h2><div class="rejilla-12">' +
      UI.campo({ nombre: "terceroNombre", etiqueta: "Nombre o razón social", valor: f.tercero.nombre, requerido: true, clase: "col-7 col-movil-completo", lista: Object.keys(terceros) }) +
      UI.campo({ nombre: "terceroNif", etiqueta: "NIF", valor: f.tercero.nif, clase: "col-5", atributos: 'autocapitalize="characters"' }) +
      UI.campo({ nombre: "terceroDireccion", etiqueta: "Dirección", valor: f.tercero.direccion, clase: "col-7 col-movil-completo" }) +
      UI.campo({ nombre: "terceroEmail", etiqueta: "Correo", tipo: "email", valor: f.tercero.email, clase: "col-5 col-movil-completo" }) +
      "</div></section>" +
      '<section class="tarjeta"><h2>Datos de la factura</h2><div class="rejilla-12">' +
      (esEmitida ? '<p class="col-4 dato-numero"><span class="detalle">Número</span><strong>' + esc(f.numero || "Se pone al emitir") + "</strong></p>"
        : UI.campo({ nombre: "numero", etiqueta: "Número de la factura", valor: f.numero, requerido: true, clase: "col-4" })) +
      UI.campo({ nombre: "fecha", etiqueta: "Fecha", tipo: "date", valor: f.fecha, requerido: true, clase: "col-4" }) +
      UI.campo({ nombre: "vencimiento", etiqueta: "Vencimiento", tipo: "date", valor: f.vencimiento, clase: "col-4" }) +
      UI.campo({ nombre: "categoriaId", etiqueta: "Categoría", tipo: "select", valor: f.categoriaId, opciones: U.opcionesCategorias(c, esEmitida ? "ingreso" : "gasto"), clase: "col-5 col-movil-completo" }) +
      UI.campo({ nombre: "proyectoId", etiqueta: "Proyecto", tipo: "select", valor: f.proyectoId, opciones: U.opcionesProyectos(c), clase: "col-4" }) +
      UI.campo({ nombre: "retencionPct", etiqueta: "Retención IRPF (%)", valor: f.retencionPct ? String(f.retencionPct).replace(".", ",") : "", clase: "col-3", atributos: 'inputmode="decimal"',
        ayuda: esEmitida ? "" : "Si el proveedor es profesional o autónomo." }) +
      (!esEmitida ? '<div class="col-12">' + '<label class="casilla"><input type="checkbox" name="deducible"' + (f.deducible ? " checked" : "") +
        "><span>Su IVA se deduce en la declaración (solo si la asociación presenta IVA y el gasto está relacionado con actividades sujetas; verificar con asesoría)</span></label></div>" : "") +
      "</div></section>" +
      '<section class="tarjeta"><h2>Líneas</h2><div class="tabla-envoltorio"><table class="tabla tabla-lineas"><thead><tr><th scope="col">Concepto</th><th scope="col">Cantidad</th>' +
      '<th scope="col">Precio (€)</th><th scope="col">IVA</th><th scope="col">Tipo</th><th scope="col" class="importe">Base</th>' + (bloqueada ? "" : '<th scope="col"><span class="sr">Quitar</span></th>') +
      '</tr></thead><tbody id="f-lineas">' + f.lineas.map(function (l, i) { return filaLinea(l, i, bloqueada); }).join("") + "</tbody></table></div>" +
      (bloqueada ? "" : '<button type="button" class="btn btn-secundario btn-pequeno" id="f-linea">Añadir línea</button>') +
      '<div id="f-exencion"' + (f.lineas.some(function (l) { return l.tratamiento === "exento"; }) && esEmitida ? "" : " hidden") + ">" +
      UI.campo({ nombre: "motivoExencion", etiqueta: "Motivo de la exención (aparece en la factura)", valor: f.motivoExencion, ancho: "completo",
        ayuda: "Por ejemplo, el artículo de la Ley del IVA que ampara la exención. Verificar con asesoría." }) + "</div>" +
      U.ayuda("Sujeto: lleva IVA (21, 10, 4 o 0 %). Exento: la ley lo exime (p. ej. ciertas actividades educativas o culturales). No sujeto: queda fuera del IVA (cuotas de socios, donaciones). Qué corresponde a cada ingreso: verificar con asesoría.") +
      '<div id="f-totales">' + totalesHtml(f) + "</div></section>" +
      '<section class="tarjeta"><h2>Notas</h2>' + UI.campo({ nombre: "notas", etiqueta: "Notas internas (no salen en la factura)", tipo: "textarea", valor: f.notas, ancho: "completo" }) + "</section>" +
      "</fieldset>" +
      '<div class="acciones barra-guardar">' +
      (bloqueada ? "" : esEmitida && f.estado === "borrador"
        ? '<button type="submit" class="btn btn-secundario" data-accion="guardar">Guardar borrador</button><button type="submit" class="btn btn-primario" data-accion="emitir">Emitir factura</button>'
        : '<button type="submit" class="btn btn-primario" data-accion="guardar">Guardar' + (esEmitida ? " cambios" : "") + "</button>") +
      (f.id && f.estado !== "borrador" && f.estado !== "anulada" && e && e.pendiente > 0 ? '<button type="button" class="btn btn-secundario" id="f-pago">' + (esEmitida ? "Registrar cobro" : "Registrar pago") + "</button>" : "") +
      (f.id && esEmitida && f.estado !== "borrador" ? '<a class="btn btn-secundario" href="#/facturas/imprimir/' + encodeURIComponent(f.id) + '">Imprimir o PDF</a>' : "") +
      (f.id ? '<button type="button" class="btn btn-peligro-suave" id="f-mas">Más…</button>' : "") +
      "</div></form>" +
      (pagos.length ? '<section class="tarjeta"><h2>' + (esEmitida ? "Cobros" : "Pagos") + '</h2><ul class="lista-cifras">' + pagos.map(function (m) {
        return "<li><span>" + esc(F.corta(m.fecha)) + " · " + esc(U.nombreCuenta(c, m.cuentaId)) + "</span><strong>" + esc(D.formatear(m.importe)) + "</strong></li>";
      }).join("") + "</ul></section>" : "");

    var form = cont.querySelector("#f-editor");
    var tbody = cont.querySelector("#f-lineas");
    function recalcular() {
      leerEditor(form, f);
      cont.querySelector("#f-totales").innerHTML = totalesHtml(f);
      tbody.querySelectorAll("[data-linea]").forEach(function (tr) {
        var l = f.lineas[+tr.getAttribute("data-linea")];
        tr.querySelector("[data-base-linea]").textContent = D.formatear(Fac.baseLinea(l));
        var sel = tr.querySelector("select[name^=tipoIva]");
        if (sel) sel.hidden = l.tratamiento !== "sujeto";
      });
      cont.querySelector("#f-exencion").hidden = !(esEmitida && f.lineas.some(function (l) { return l.tratamiento === "exento"; }));
    }
    form.addEventListener("input", recalcular);
    form.addEventListener("change", function (ev) {
      // Al elegir un cliente o proveedor ya conocido, se rellenan sus datos.
      if (ev.target.name === "terceroNombre" && terceros[ev.target.value]) {
        var t = terceros[ev.target.value];
        form.elements.terceroNif.value = t.nif || ""; form.elements.terceroDireccion.value = t.direccion || ""; form.elements.terceroEmail.value = t.email || "";
      }
      // En las emitidas, al cambiar la categoría se propone el IVA habitual de esa categoría para las líneas vacías.
      if (ev.target.name === "categoriaId" && esEmitida) {
        var cat = U.buscar(c.config.categorias, ev.target.value);
        if (cat && cat.iva) tbody.querySelectorAll("[data-linea]").forEach(function (tr) {
          var i = tr.getAttribute("data-linea");
          if (!form.elements["concepto-" + i].value) form.elements["tratamiento-" + i].value = cat.iva;
        });
      }
      recalcular();
    });
    var bLinea = cont.querySelector("#f-linea");
    if (bLinea) bLinea.addEventListener("click", function () {
      leerEditor(form, f);
      var ultima = f.lineas[f.lineas.length - 1] || {};
      f.lineas.push(Object.assign(Fac.lineaVacia(ultima.tratamiento), { tipoIva: ultima.tipoIva || 21 }));
      tbody.innerHTML = f.lineas.map(function (l, i) { return filaLinea(l, i, false); }).join("");
      recalcular();
      form.elements["concepto-" + (f.lineas.length - 1)].focus();
    });
    tbody.addEventListener("click", function (ev) {
      var b = ev.target.closest("[data-quitar-linea]");
      if (!b) return;
      leerEditor(form, f);
      f.lineas.splice(+b.getAttribute("data-quitar-linea"), 1);
      if (!f.lineas.length) f.lineas.push(Fac.lineaVacia());
      tbody.innerHTML = f.lineas.map(function (l, i) { return filaLinea(l, i, false); }).join("");
      recalcular();
    });

    form.addEventListener("submit", async function (ev) {
      ev.preventDefault();
      var accion = (ev.submitter && ev.submitter.getAttribute("data-accion")) || "guardar";
      leerEditor(form, f);
      f.lineas = f.lineas.filter(function (l) { return l.concepto.trim() || l.precio; });
      if (!f.lineas.length) f.lineas.push(Fac.lineaVacia());
      if (accion === "emitir" || f.tipo === "recibida" || f.estado === "emitida") {
        var problemas = Fac.revisar(f);
        if (problemas.length) {
          await UI.dialogo({ titulo: "Falta algo", contenido: '<ul class="lista">' + problemas.map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") + "</ul>",
            botones: [{ texto: "Entendido", valor: "cancelar", estilo: "btn-primario" }] });
          return;
        }
      }
      if (accion === "emitir") {
        var numero = Fac.siguienteNumero(c.facturas, f.fecha.slice(0, 4), c.config.facturacion.serie);
        var ok = await UI.confirmar("Se emitirá con el número " + numero + " y fecha " + F.corta(f.fecha) + ". Después no se podrá editar.",
          { titulo: "Emitir factura", aceptar: "Emitir" });
        if (!ok) return;
        f.numero = numero; f.estado = "emitida";
      }
      delete f._desbloqueada;
      var g = await datos.guardar("facturas", f);
      UI.aviso(accion === "emitir" ? "Factura " + g.numero + " emitida." : "Factura guardada.");
      if (nueva || accion === "emitir") location.hash = "#/facturas/ver/" + encodeURIComponent(g.id); else WA.App.repintar();
    });

    var bPago = cont.querySelector("#f-pago");
    if (bPago) bPago.addEventListener("click", async function () {
      if (await U.editarMovimiento(datos, c, null, { tipo: esEmitida ? "ingreso" : "gasto", importe: e.pendiente, facturaId: f.id, categoriaId: f.categoriaId,
        proyectoId: f.proyectoId, concepto: (esEmitida ? "Cobro factura " : "Pago factura ") + f.numero + " · " + f.tercero.nombre })) WA.App.repintar();
    });
    var bMas = cont.querySelector("#f-mas");
    if (bMas) bMas.addEventListener("click", async function () {
      var botones = [{ texto: "Cerrar", valor: "cancelar" }];
      if (f.estado === "borrador" || f.tipo === "recibida") botones.unshift({ texto: "Borrar", valor: "borrar", estilo: "btn-peligro-suave" });
      if (esEmitida && f.estado === "emitida") botones.unshift({ texto: "Anular", valor: "anular", estilo: "btn-peligro-suave" }, { texto: "Desbloquear para corregir", valor: "desbloquear" });
      if (esEmitida && f.estado === "emitida") botones.unshift({ texto: "Duplicar como borrador", valor: "duplicar" });
      var r = await UI.dialogo({ titulo: "Factura " + (f.numero || ""), contenido: "<p>¿Qué quieres hacer?</p>", botones: botones });
      if (r.valor === "borrar") {
        if (pagos.length) { UI.aviso("Tiene cobros o pagos enlazados: bórralos antes en Tesorería.", "error"); return; }
        if (!(await UI.confirmar("Se borrará la factura.", { titulo: "Borrar factura", aceptar: "Borrar", peligro: true }))) return;
        await datos.borrar("facturas", f.id);
        location.hash = esEmitida ? "#/facturas" : "#/facturas/recibidas";
      } else if (r.valor === "anular") {
        if (!(await UI.confirmar("La factura quedará anulada: conserva su número (no se reutiliza) y deja de contar para el IVA. Lo habitual es emitir además una factura rectificativa; verificar con asesoría.",
          { titulo: "Anular factura", aceptar: "Anular", peligro: true }))) return;
        f.estado = "anulada";
        await datos.guardar("facturas", f);
        WA.App.repintar();
      } else if (r.valor === "desbloquear") {
        if (!(await UI.confirmar("Cambiar una factura ya emitida (y quizá enviada) puede no ser correcto: lo habitual es una rectificativa. Úsalo solo para corregir un error antes de enviarla.",
          { titulo: "Desbloquear factura", aceptar: "Desbloquear" }))) return;
        f._desbloqueada = true;
        pintarEditor(cont, datos, f, c);
      } else if (r.valor === "duplicar") {
        var copia = JSON.parse(JSON.stringify(f));
        delete copia.id; delete copia.creado; delete copia.modificado;
        Object.assign(copia, { estado: "borrador", numero: "", fecha: F.hoy() });
        var g = await datos.guardar("facturas", copia);
        location.hash = "#/facturas/ver/" + encodeURIComponent(g.id);
      }
    });
  }

  // ── Versión para imprimir ───────────────────────────────────────────────
  async function pintarImprimir(cont, datos, id) {
    var c = await U.cargar(datos);
    var f = U.buscar(c.facturas, id);
    if (!f) { cont.innerHTML = "<h1>No encontrada</h1>"; return; }
    var a = c.asociacion, t = Fac.totales(f), dom = WA.Direccion.formatear(a.domicilio);
    cont.innerHTML =
      '<div class="acciones no-imprimir"><button type="button" class="btn btn-primario lectura-ok" id="i-imprimir">Imprimir o guardar en PDF</button>' +
      '<a class="btn btn-secundario" href="#/facturas/ver/' + encodeURIComponent(f.id) + '">Volver</a></div>' +

  function htmlAsistentes(a) {
    if (!a.asistentes.length) return '<p class="vacio">Sin asistentes anotados.</p>';
    return '<ul class="chips">' + a.asistentes.map(function (x, i) {
      return '<li class="chip">' + esc(x.nombre) + (x.cargo ? ' <span class="detalle">(' + esc(x.cargo) + ")</span>" : "") +
        '<button type="button" class="btn-icono" data-quitar-asistente="' + i + '" aria-label="Quitar a ' + esc(x.nombre) + '">✕</button></li>';
    }).join("") + "</ul>";
  }

  async function elegirAsistentes(c, a) {
    var hoy = F.hoy();
    var junta = c.junta.filter(function (j) { return !j.hasta || j.hasta >= hoy; });
    var socios = c.socios.filter(function (s) { return S.estado(s) === "activo"; }).sort(function (x, y) { return S.nombreListado(x).localeCompare(S.nombreListado(y), "es"); });
    var ya = {};
    a.asistentes.forEach(function (x) { ya[x.socioId || x.nombre] = true; });
    var cargoDe = function (j) { return j.cargo === "Otro" && j.cargoOtro ? j.cargoOtro : j.cargo; };
    var r = await UI.dialogo({
      titulo: "Añadir asistentes",
      contenido: '<form class="formulario" novalidate>' +
        (junta.length ? "<h3>Junta directiva</h3>" + junta.map(function (j, i) {
          return '<label class="casilla"><input type="checkbox" name="j-' + i + '"' + (ya[j.nombre] ? " checked disabled" : "") + "><span>" + esc(j.nombre) + ' <span class="detalle">(' + esc(cargoDe(j)) + ")</span></span></label>";
        }).join("") : "") +
        '<h3>Socios</h3><label class="sr" for="as-buscar">Buscar socio</label><input type="search" id="as-buscar" placeholder="Buscar socio…">' +
        '<div class="lista-marcable">' + socios.map(function (s) {
          return '<label class="casilla" data-nombre="' + esc(S.nombreCompleto(s).toLowerCase()) + '"><input type="checkbox" name="s-' + esc(s.id) + '"' + (ya[s.id] ? " checked disabled" : "") + "><span>" +
            esc(S.nombreListado(s)) + ' <span class="detalle">n.º ' + esc(s.numero) + "</span></span></label>";
        }).join("") + "</div>" +
        UI.campo({ nombre: "otros", etiqueta: "Otras personas (una por línea)", tipo: "textarea", valor: "", ancho: "completo" }) + "</form>",
      botones: [{ texto: "Cancelar", valor: "cancelar" }, { texto: "Añadir", valor: "enviar", estilo: "btn-primario" }],
      alAbrir: function (d) {
        d.querySelector("#as-buscar").addEventListener("input", function (e) {
          var t = e.target.value.trim().toLowerCase();
          d.querySelectorAll(".lista-marcable .casilla").forEach(function (x) { x.hidden = t && x.getAttribute("data-nombre").indexOf(t) < 0; });
        });
      },
    });
    if (r.valor !== "enviar") return false;
    junta.forEach(function (j, i) { if (r.datos["j-" + i] && !ya[j.nombre]) a.asistentes.push({ nombre: j.nombre, socioId: "", cargo: cargoDe(j) }); });
    socios.forEach(function (s) {
      if (r.datos["s-" + s.id] && !ya[s.id] && !a.asistentes.some(function (x) { return x.nombre === S.nombreCompleto(s); })) a.asistentes.push({ nombre: S.nombreCompleto(s), socioId: s.id, cargo: "" });
    });
    String(r.datos.otros || "").split("\n").map(function (x) { return x.trim(); }).filter(Boolean).forEach(function (n) { a.asistentes.push({ nombre: n, socioId: "", cargo: "" }); });
    return true;
  }

  async function pintarFicha(cont, datos, id, organoNuevo) {
    var c = await cargar(datos);
    var a;
    if (id) a = c.actas.filter(function (x) { return x.id === id; })[0];
    else {
      var org = organoDe(c, organoNuevo || (c.config.organos[0] || {}).id);
      a = Ac.vacia(org);
      // Presidencia y secretaría vigentes, para empezar.
      var hoy = F.hoy();
      c.junta.forEach(function (j) {
        if (j.hasta && j.hasta < hoy) return;
        if (j.cargo === "Presidencia" && !a.presidencia) a.presidencia = j.nombre;
        if (j.cargo === "Secretaría" && !a.secretaria) a.secretaria = j.nombre;
      });
    }
    if (!a) { cont.innerHTML = '<h1>Acta no encontrada</h1><p><a href="#/actas">Volver</a></p>'; return; }
    a.asistentes = a.asistentes || []; a.ordenDelDia = a.ordenDelDia || [];
    var nueva = !a.id;
    var personas = c.junta.filter(function (j) { return !j.hasta || j.hasta >= F.hoy(); }).map(function (j) { return j.nombre; });

    cont.innerHTML =
      '<p class="miga"><a href="#/actas">Actas</a> › ' + esc(a.numero || "Nueva") + "</p>" +
      '<div class="cabecera-pagina"><h1>' + (a.numero ? "Acta " + esc(a.numero) : "Nueva acta") + "</h1>" +
      (nueva ? "" : a.estado === "aprobada" ? '<span class="estado estado-ok">Aprobada</span>' : '<span class="estado estado-aviso">Borrador</span>') + "</div>" + WA.UI.firma(a) +
      '<form id="acta" class="formulario" novalidate>' +
      '<section class="tarjeta"><h2>Sesión</h2><div class="rejilla-12">' +
      UI.campo({ nombre: "organoId", etiqueta: "Órgano", tipo: "select", valor: a.organoId, opciones: c.config.organos.map(function (o) { return [o.id, o.nombre]; }), clase: "col-4 col-movil-completo",
        atributos: nueva ? "" : "disabled" }) +
      UI.campo({ nombre: "tipoSesion", etiqueta: "Sesión", tipo: "select", valor: a.tipoSesion, opciones: [["ordinaria", "Ordinaria"], ["extraordinaria", "Extraordinaria"]], clase: "col-4" }) +
      UI.campo({ nombre: "convocatoria", etiqueta: "Convocatoria", tipo: "select", valor: a.convocatoria, opciones: [["", "—"], ["primera", "Primera"], ["segunda", "Segunda"]], clase: "col-4" }) +
      UI.campo({ nombre: "fecha", etiqueta: "Fecha", tipo: "date", valor: a.fecha, requerido: true, clase: "col-4" }) +
      UI.campo({ nombre: "horaInicio", etiqueta: "Empieza", tipo: "time", valor: a.horaInicio, clase: "col-4" }) +
      UI.campo({ nombre: "horaFin", etiqueta: "Termina", tipo: "time", valor: a.horaFin, clase: "col-4" }) +
      UI.campo({ nombre: "lugar", etiqueta: "Lugar", valor: a.lugar, clase: "col-8 col-movil-completo" }) +
      UI.campo({ nombre: "modalidad", etiqueta: "Modalidad", tipo: "select", valor: a.modalidad, opciones: [["presencial", "Presencial"], ["en línea", "En línea"], ["mixta", "Mixta"]], clase: "col-4" }) +
      UI.campo({ nombre: "presidencia", etiqueta: "Preside", valor: a.presidencia, lista: personas, clase: "col-6 col-movil-completo" }) +
      UI.campo({ nombre: "secretaria", etiqueta: "Secretario/a", valor: a.secretaria, lista: personas, clase: "col-6 col-movil-completo" }) +
      "</div></section>" +
      '<section class="tarjeta"><div class="tarjeta-cabecera"><h2>Asistentes <span class="detalle" id="n-asist">(' + a.asistentes.length + ')</span></h2>' +
      '<button type="button" class="btn btn-secundario" id="b-asist">Añadir asistentes</button></div><div id="asistentes">' + htmlAsistentes(a) + "</div>" +
      '<div class="rejilla">' + UI.campo({ nombre: "excusan", etiqueta: "Excusan su asistencia", valor: a.excusan }) + UI.campo({ nombre: "invitados", etiqueta: "Invitados (sin voto)", valor: a.invitados }) + "</div></section>" +
      '<section class="tarjeta"><h2>Orden del día, desarrollo y acuerdos</h2><ol class="puntos" id="puntos">' + htmlPuntos(a) + "</ol>" +
      '<button type="button" class="btn btn-secundario" id="b-punto">Añadir punto</button>' +
      UI.campo({ nombre: "ruegos", etiqueta: "Ruegos y preguntas", tipo: "textarea", valor: a.ruegos, ancho: "completo" }) +
      '<p class="letra-pequena">El contenido de las actas, quién las firma y qué mayorías hacen falta para cada acuerdo los marcan vuestros estatutos (verificar con asesoría). La aplicación solo anota el resultado.</p></section>' +
      '<section class="tarjeta"><h2>Aprobación</h2><div class="rejilla">' +
      UI.campo({ nombre: "estado", etiqueta: "Estado", tipo: "select", valor: a.estado, opciones: [["borrador", "Borrador"], ["aprobada", "Aprobada"]] }) +
      UI.campo({ nombre: "aprobacion", etiqueta: "Aprobada en", valor: a.aprobacion, ayuda: "Por ejemplo: «en la reunión siguiente, acta JD-2026-05»." }) +
      UI.campo({ nombre: "notas", etiqueta: "Notas internas", valor: a.notas, ancho: "completo" }) + "</div></section>" +
      '<div class="acciones barra-guardar"><button type="submit" class="btn btn-primario">Guardar acta</button>' +
      (nueva ? "" : '<a class="btn btn-secundario" href="#/actas/imprimir/' + encodeURIComponent(a.id) + '">Imprimir para firmar</a><button type="button" class="btn btn-secundario lectura-ok" id="b-copiar">Copiar texto</button>') +
      "</div></form>" +
      (nueva ? "" : WA.DocsUI.seccion(c.documentos, { tipo: "acta", id: a.id }, "Acta firmada y anexos")) +
      (nueva || a.estado === "aprobada" ? "" : '<div class="acciones"><button type="button" class="btn btn-peligro-suave" id="b-borrar">Borrar borrador</button></div>');

    var form = cont.querySelector("#acta");
    var lista = cont.querySelector("#puntos");
    var repintarPuntos = function () { lista.innerHTML = htmlPuntos(a); };
    // Cambiar de órgano en un acta nueva: se carga su plantilla (si no se ha escrito nada aún).
    form.elements.organoId.addEventListener("change", function () {
      leer(form, a);
      var vacio = a.ordenDelDia.every(function (p) { return !p.desarrollo && !(p.acuerdos || []).length; });
      if (vacio) { a.ordenDelDia = Ac.plantilla(organoDe(c, form.elements.organoId.value), a.tipoSesion); repintarPuntos(); }
    });
    form.elements.tipoSesion.addEventListener("change", function () {
      leer(form, a);
      var vacio = a.ordenDelDia.every(function (p) { return !p.desarrollo && !(p.acuerdos || []).length; });
      if (nueva && vacio) { a.ordenDelDia = Ac.plantilla(organoDe(c, a.organoId), a.tipoSesion); repintarPuntos(); }
    });
    lista.addEventListener("change", function (e) {
      if (/votacion$/.test(e.target.name)) e.target.closest(".acuerdo-votacion").querySelector(".votos").hidden = e.target.value !== "votacion";
    });
    lista.addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (!b) return;
      leer(form, a);
      var i;
      if (b.hasAttribute("data-acuerdo")) { i = +b.getAttribute("data-acuerdo"); a.ordenDelDia[i].acuerdos.push({ id: Ac.nuevoId(), texto: "", votacion: "", resultado: "" }); }
      else if (b.hasAttribute("data-quitar-acuerdo")) { var p = b.getAttribute("data-quitar-acuerdo").split("-"); a.ordenDelDia[+p[0]].acuerdos.splice(+p[1], 1); }
      else if (b.hasAttribute("data-quitar-punto")) a.ordenDelDia.splice(+b.getAttribute("data-quitar-punto"), 1);
      else if (b.hasAttribute("data-subir")) { i = +b.getAttribute("data-subir"); a.ordenDelDia.splice(i - 1, 0, a.ordenDelDia.splice(i, 1)[0]); }
      else if (b.hasAttribute("data-bajar")) { i = +b.getAttribute("data-bajar"); a.ordenDelDia.splice(i + 1, 0, a.ordenDelDia.splice(i, 1)[0]); }
      else return;
      repintarPuntos();
    });
    cont.querySelector("#b-punto").addEventListener("click", function () {
      leer(form, a);
      a.ordenDelDia.push(Ac.punto(""));
      repintarPuntos();
      form.elements["p-" + (a.ordenDelDia.length - 1) + "-titulo"].focus();
    });
    cont.querySelector("#b-asist").addEventListener("click", async function () {
      leer(form, a);
      if (await elegirAsistentes(c, a)) { cont.querySelector("#asistentes").innerHTML = htmlAsistentes(a); cont.querySelector("#n-asist").textContent = "(" + a.asistentes.length + ")"; }
    });
    cont.querySelector("#asistentes").addEventListener("click", function (e) {
      var b = e.target.closest("[data-quitar-asistente]");
      if (!b) return;
      a.asistentes.splice(+b.getAttribute("data-quitar-asistente"), 1);
      cont.querySelector("#asistentes").innerHTML = htmlAsistentes(a);
      cont.querySelector("#n-asist").textContent = "(" + a.asistentes.length + ")";
    });
    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      leer(form, a);
      if (!F.esValida(a.fecha)) { UI.marcarError(form, "fecha", "Pon la fecha."); return; }
      UI.marcarError(form, "fecha", "");
      if (!a.numero) a.numero = Ac.siguienteNumero(c.actas, organoDe(c, a.organoId), a.fecha.slice(0, 4), c.config.actas.numeracion);
      var problemas = Ac.revisar(a);
      if (a.estado === "aprobada" && problemas.length) {
        await UI.dialogo({ titulo: "Antes de darla por aprobada", contenido: '<ul class="lista">' + problemas.map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") + "</ul>",
          botones: [{ texto: "Entendido", valor: "cancelar", estilo: "btn-primario" }] });
        return;
      }
      var g = await datos.guardar("actas", a);
      UI.aviso("Acta " + g.numero + " guardada." + (problemas.length ? " Falta: " + problemas.join(" ") : ""), problemas.length ? "info" : "ok");
      if (nueva) location.hash = "#/actas/ficha/" + encodeURIComponent(g.id); else WA.App.repintar();
    });
    if (nueva) return;
    WA.DocsUI.conectarSeccion(cont, datos, { tipo: "acta", id: a.id }, "Actas firmadas");
    cont.querySelector("#b-copiar").addEventListener("click", async function () {
      leer(form, a);
      var t = Ac.textoPlano(a, organoDe(c, a.organoId), c.asociacion);
      try { await navigator.clipboard.writeText(t); UI.aviso("Texto del acta copiado."); } catch (err) { UI.aviso("No se ha podido copiar.", "error"); }
    });
    var bBorrar = cont.querySelector("#b-borrar");
    if (bBorrar) bBorrar.addEventListener("click", async function () {
      if (!(await UI.confirmar("Se borrará el borrador del acta " + a.numero + ".", { titulo: "Borrar acta", aceptar: "Borrar", peligro: true }))) return;
      await datos.borrar("actas", a.id);
      location.hash = "#/actas";
    });
  }

  // ── Para firmar ─────────────────────────────────────────────────────────
  async function pintarImprimir(cont, datos, id) {
    var c = await cargar(datos);
    var a = c.actas.filter(function (x) { return x.id === id; })[0];
    if (!a) { cont.innerHTML = "<h1>No encontrada</h1>"; return; }
    var org = organoDe(c, a.organoId), as = c.asociacion;
    var asist = (a.asistentes || []).map(function (x) { return esc(x.nombre) + (x.cargo ? " (" + esc(x.cargo) + ")" : ""); });
    cont.innerHTML =
      '<div class="acciones no-imprimir"><button type="button" class="btn btn-primario lectura-ok" id="i-imprimir">Imprimir o guardar en PDF</button>' +
      '<a class="btn btn-secundario" href="#/actas/ficha/' + encodeURIComponent(a.id) + '">Volver</a></div>' +
      '<article class="documento-impreso">' +
      '<p class="di-entidad">' + esc(as.nombre || "") + (as.nif ? " · NIF " + esc(as.nif) : "") + "</p>" +
      "<h1>Acta " + esc(a.numero) + "</h1><h2>Reunión " + (a.tipoSesion === "extraordinaria" ? "extraordinaria" : "ordinaria") + " de " + esc(org.nombre) + "</h2>" +
      "<p>En " + esc(a.lugar || "…") + (a.modalidad !== "presencial" ? " (modalidad " + esc(a.modalidad) + ")" : "") + ", el " + esc(F.larga(a.fecha)) +
      (a.horaInicio ? ", a las " + esc(a.horaInicio) + " horas" : "") + (a.convocatoria ? ", en " + esc(a.convocatoria) + " convocatoria" : "") +
      ", se reúne " + esc(org.nombre) + ", presidida por <strong>" + esc(a.presidencia || "…") + "</strong> y actuando como secretario/a <strong>" + esc(a.secretaria || "…") + "</strong>.</p>" +
      "<p><strong>Asistentes (" + asist.length + "):</strong> " + (asist.join(", ") || "—") + ".</p>" +
      (a.excusan ? "<p><strong>Excusan su asistencia:</strong> " + esc(a.excusan) + ".</p>" : "") +
      (a.invitados ? "<p><strong>Invitados:</strong> " + esc(a.invitados) + ".</p>" : "") +
      "<h3>Orden del día</h3><ol>" + a.ordenDelDia.map(function (p) { return "<li>" + esc(p.titulo) + "</li>"; }).join("") + "</ol>" +
      "<h3>Desarrollo de la sesión y acuerdos</h3>" + a.ordenDelDia.map(function (p, i) {
        return "<h4>" + (i + 1) + ". " + esc(p.titulo) + "</h4>" + (p.desarrollo ? "<p>" + esc(p.desarrollo).replace(/\n/g, "<br>") + "</p>" : "") +
          (p.acuerdos || []).filter(function (x) { return String(x.texto || "").trim(); }).map(function (ac, k) {
            var v = Ac.textoVotacion(ac);
            return '<p class="di-acuerdo"><strong>Acuerdo ' + (i + 1) + "." + (k + 1) + ":</strong> " + esc(ac.texto) + (v ? " <em>(" + esc(v) + ")</em>" : "") + "</p>";
          }).join("");
      }).join("") +
      (a.ruegos ? "<h4>Ruegos y preguntas</h4><p>" + esc(a.ruegos).replace(/\n/g, "<br>") + "</p>" : "") +
      "<p>Y no habiendo más asuntos que tratar, se levanta la sesión" + (a.horaFin ? " a las " + esc(a.horaFin) + " horas" : "") + ", de lo que como secretario/a doy fe, con el visto bueno de la presidencia.</p>" +
      '<div class="di-firmas"><div><p>Vº Bº La Presidencia</p><div class="di-firma"></div><p>' + esc(a.presidencia) + "</p></div>" +
      "<div><p>La Secretaría</p><div class=\"di-firma\"></div><p>" + esc(a.secretaria) + "</p></div></div>" +
      "</article>" + '<p class="detalle no-imprimir">Revisad que el acta incluye lo que piden vuestros estatutos (verificar con asesoría).</p>';
    cont.querySelector("#i-imprimir").addEventListener("click", function () { window.print(); });
  }

  // ── Libro de acuerdos ───────────────────────────────────────────────────
  var textoAcuerdos = "";
  async function pintarAcuerdos(cont, datos) {
    var c = await cargar(datos);
    var todos = Ac.acuerdos(c.actas, c.config.organos);
    cont.innerHTML = '<div class="cabecera-pagina"><h1>Actas</h1></div>' + pestanas("acuerdos") +
      '<div class="barra-filtros"><label class="filtro-texto"><span class="sr">Buscar</span><input type="search" id="b-acuerdo" placeholder="Buscar acuerdo…" value="' + esc(textoAcuerdos) + '"></label></div>' +
      '<div id="t-acuerdos"></div>';
    function refrescar() {
      var t = textoAcuerdos.trim().toLowerCase();
      var lista = todos.filter(function (x) { return !t || (x.texto + " " + x.tituloPunto + " " + x.numero).toLowerCase().indexOf(t) >= 0; });
      cont.querySelector("#t-acuerdos").innerHTML = !lista.length ? '<p class="vacio">No hay acuerdos.</p>' :
        '<div class="tabla-envoltorio"><table class="tabla"><thead><tr><th scope="col">Fecha</th><th scope="col">Acta</th><th scope="col">Acuerdo</th><th scope="col" class="solo-ancho">Votación</th></tr></thead><tbody>' +
        lista.map(function (x) {
          return "<tr><td>" + esc(F.corta(x.fecha)) + '</td><td><a href="#/actas/ficha/' + encodeURIComponent(x.actaId) + '">' + esc(x.numero) + '</a><br><span class="detalle">' + esc(x.organo) + "</span></td>" +
            "<td>" + esc(x.texto) + '<br><span class="detalle">Punto ' + x.punto + ": " + esc(x.tituloPunto) + '</span></td><td class="solo-ancho">' + esc(x.votacion) + "</td></tr>";
        }).join("") + "</tbody></table></div>";
    }
    refrescar();
    cont.querySelector("#b-acuerdo").addEventListener("input", function (e) { textoAcuerdos = e.target.value; refrescar(); });
  }

  // ── Órganos ─────────────────────────────────────────────────────────────
  async function pintarOrganos(cont, datos) {
    var c = await cargar(datos);
    var usados = {};
    c.actas.forEach(function (a) { usados[a.organoId] = (usados[a.organoId] || 0) + 1; });
    var tipoTxt = {};
    Ac.TIPOS_ORGANO.forEach(function (t) { tipoTxt[t[0]] = t[1]; });
    cont.innerHTML = '<div class="cabecera-pagina"><h1>Actas</h1><button type="button" class="btn btn-primario" id="o-nuevo">Añadir órgano</button></div>' + pestanas("organos") +
      '<p class="intro">Los órganos que levantan actas. Añade un órgano por cada departamento que se reúna.</p>' +
      '<div class="tabla-envoltorio"><table class="tabla"><tbody>' + c.config.organos.map(function (o) {
        return '<tr><th scope="row">' + esc(o.nombre) + '<br><span class="detalle">' + esc(tipoTxt[o.tipo] || "") + "</span></th><td>Prefijo " + esc(o.prefijo) + "</td><td>" + (usados[o.id] || 0) + " actas</td>" +
          '<td class="celda-acciones"><button type="button" class="btn btn-pequeno btn-secundario" data-organo="' + esc(o.id) + '">Editar</button></td></tr>';
      }).join("") + "</tbody></table></div>" +
      '<section class="tarjeta"><h2>Numeración</h2><form id="o-num" class="formulario" novalidate>' +
      UI.campo({ nombre: "numeracion", etiqueta: "Las actas se numeran", tipo: "select", valor: c.config.actas.numeracion,
        opciones: [["anual", "Por año: JD-2026-01, JD-2026-02…"], ["correlativa", "Correlativa: JD-1, JD-2… (sin reiniciar)"]] }) +
      '<div class="acciones"><button type="submit" class="btn btn-primario">Guardar</button></div></form></section>';
    async function editar(o) {
      var x = o || { id: Ac.nuevoId(), nombre: "", prefijo: "", tipo: "departamento" };
      var r = await UI.dialogo({
        titulo: o ? "Editar órgano" : "Nuevo órgano",

  async function editar(datos, ficha) {
    var r = await UI.dialogo({
      titulo: "Documento",

        '<form class="formulario" novalidate><div class="rejilla">' +
        UI.campo({ nombre: "nombre", etiqueta: "Nombre", valor: ficha.nombre, requerido: true, ancho: "completo" }) +
        UI.campo({ nombre: "categoria", etiqueta: "Categoría", tipo: "select", valor: ficha.categoria, opciones: CATEGORIAS }) +

  function conectarSeccion(cont, datos, vinculo, categoriaPorDefecto) {

      (!hayEstatutos ? '<div class="caja-aviso">Todavía no habéis adjuntado los <strong>estatutos</strong>. Son la referencia para los fines, los cargos, las asambleas y las cuotas.</div>' : "") +
      '<div class="barra-filtros"><label><span class="sr">Categoría</span><select id="d-cat"><option value="">Todas las categorías</option>' +
      CATEGORIAS.map(function (c2) { return '<option value="' + esc(c2) + '"' + (filtro.categoria === c2 ? " selected" : "") + ">" + esc(c2) + "</option>"; }).join("") + "</select></label>" +
      '<label class="filtro-texto"><span class="sr">Buscar</span><input type="search" id="d-buscar" placeholder="Buscar documento…" value="' + esc(filtro.texto) + '"></label></div>' +
      '<div id="d-lista"></div>' +
      '<p class="detalle">' + docs.length + " documentos · " + esc(tamanoTexto(total)) +
      (esp && esp.quota ? " · espacio del navegador usado: " + esc(tamanoTexto(esp.usage)) + " de " + esc(tamanoTexto(esp.quota)) : "") + "</p>";
    function visibles() {
      var t = filtro.texto.trim().toLowerCase();
      return docs.filter(function (d) { return (!filtro.categoria || d.categoria === filtro.categoria) && (!t || (d.nombre + " " + d.descripcion).toLowerCase().indexOf(t) >= 0); })
        .sort(function (a, b) { return String(b.fecha || "").localeCompare(String(a.fecha || "")); });

    var refrescar = function () { zona.innerHTML = filas(visibles()); };
    refrescar();
    conectar(zona, datos, function () { return docs; }, function () { WA.App.repintar(); });
    cont.querySelector("#d-cat").addEventListener("change", function (e) { filtro.categoria = e.target.value; refrescar(); });
    cont.querySelector("#d-buscar").addEventListener("input", function (e) { filtro.texto = e.target.value; refrescar(); });
    cont.querySelector("#d-nuevo").addEventListener("click", async function () { if (await adjuntar(datos, null, filtro.categoria)) WA.App.repintar(); });

  <script>/* js/modulos/usuarios.js */
/*

 */
(function (raiz) {
  "use strict";
  var WA = raiz.WA, UI = WA.UI, esc = UI.esc, P = WA.Permisos, F = WA.Fechas;

  function casillasPermisos(marcadas) {
    return '<fieldset class="grupo-permisos"><legend>Puede modificar</legend><p class="campo-ayuda">Todos ven todo. Marca lo que puede cambiar.</p>' +
      P.SECCIONES.map(function (s) {
        return '<label class="casilla"><input type="checkbox" name="perm-' + s[0] + '"' + (marcadas.indexOf(s[0]) >= 0 ? " checked" : "") + "><span>" + esc(s[1]) + "</span></label>";
      }).join("") + "</fieldset>";
  }
  var leerPermisos = function (form) { return P.IDS.filter(function (id) { return form.elements["perm-" + id].checked; }); };
  var listaCargos = '<datalist id="u-cargos">' + P.CARGOS.map(function (c) { return '<option value="' + esc(c) + '">'; }).join("") + "</datalist>";

  function camposProvisional() {
    return UI.campo({ nombre: "pass", etiqueta: "Contraseña provisional", tipo: "password", requerido: true,
      ayuda: "Mínimo 8 caracteres. Díselo en persona o por un canal distinto al de la contraseña del archivo. La cambiará al entrar.", atributos: 'autocomplete="new-password"' }) +
      UI.campo({ nombre: "pass2", etiqueta: "Repítela", tipo: "password", requerido: true, atributos: 'autocomplete="new-password"' });
  }
  function validarProvisional(form) {
    var d = UI.leerFormulario(form), corta = d.pass.length < 8, distintas = d.pass !== d.pass2;

  }

  async function editar(u) {
    var nuevo = !u;
    var marcadas = nuevo ? [] : u.permisos;
    var r = await UI.dialogo({
      titulo: nuevo ? "Nuevo usuario" : "Editar a " + u.nombre,

        UI.campo({ nombre: "cargo", etiqueta: "Cargo", valor: nuevo ? "" : u.cargo, requerido: true, atributos: 'list="u-cargos" autocomplete="off"' }) +
        "</div>" + listaCargos + (nuevo ? camposProvisional() : "") + casillasPermisos(marcadas) + "</form>",
      botones: [{ texto: "Cancelar", valor: "cancelar" }, { texto: nuevo ? "Dar de alta" : "Guardar", valor: "enviar", estilo: "btn-primario" }],

        UI.campo({ nombre: "pass", etiqueta: "Nueva contraseña del archivo", tipo: "password", requerido: true, ayuda: "Mínimo 8 caracteres.", atributos: 'autocomplete="new-password"' }) +
        UI.campo({ nombre: "pass2", etiqueta: "Repítela", tipo: "password", requerido: true, atributos: 'autocomplete="new-password"' }) +

  function pintar(cont) {

      '<label>Dónde <select id="r-donde"><option value="">Todo</option>' + Object.keys(sitios).sort().map(function (d) {

  <script>/* js/modulos/copias.js */
/*
 * ABIES · Gestión — Módulo «Copia de seguridad».
 *
 * La copia cifrada es la bóveda tal cual: se abre con nombre, cargo y las dos
 * contraseñas, así que la puede descargar cualquier usuario. La copia sin
 * cifrar y recuperar copias son solo de la cuenta de administración.
 *
 * La copia de seguridad es lo más importante de la aplicación: los datos viven
 * en un navegador, y un navegador se puede borrar, cambiar o estropear. Una
 * copia descargada (y guardada en otro sitio) es lo único que lo protege.
 */
(function (raiz) {
  "use strict";
  var WA = raiz.WA, esc = WA.UI.esc;

  /** Descarga una copia. cifrada = true (normal) o false (legible, con aviso). */
  async function descargar(cifrada) {
    var sesion = WA.Sesion;
    if (sesion.modo === "demostración" && cifrada) cifrada = false;
    var sobre = await sesion.contenidoCopia(cifrada);
    var nombre = WA.Copia.nombreArchivo("ABIES", WA.Fechas.hoy(), cifrada);
    WA.UI.descargar(nombre, JSON.stringify(sobre, null, cifrada ? 0 : 2), "application/json");
    if (cifrada && sesion.modo === "abierta") await sesion.datos.marcarCopiaHecha();
    WA.UI.aviso("Copia descargada: " + nombre + ". Guárdala fuera de este ordenador.");
    WA.App.actualizarFranjas();
  }

  async function descargarSinCifrar() {
    var ok = await WA.UI.confirmar(
      "El archivo contendrá todos los datos en claro (nombres, correos, teléfonos…). Cualquiera que lo abra podrá leerlos. " +
      "Úsalo solo para revisarlos o pasarlos a otro programa, y bórralo después.",
      { titulo: "Copia SIN cifrar", aceptar: "Descargar sin cifrar", peligro: true });
    if (ok) await descargar(false);
  }

  async function restaurar() {
    var archivo = await WA.UI.elegirArchivo(".json,application/json");
    if (!archivo) return;
    var lectura;
    try { lectura = WA.Copia.leer(archivo.texto); }
    catch (e) { WA.UI.aviso(e.message, "error"); return; }
    var UI = WA.UI, fecha = lectura.creada ? " del " + esc(WA.Fechas.corta(lectura.creada.slice(0, 10))) : "";

      texto = "<p>Copia de ABIES" + fecha + ". Sustituye <strong>todo</strong>, también los usuarios: se abre con el nombre, el cargo y las contraseñas de cuando se hizo.</p>";
      campos = '<div class="rejilla">' + UI.campo({ nombre: "nombre", etiqueta: "Nombre", requerido: true }) +
        UI.campo({ nombre: "cargo", etiqueta: "Cargo", requerido: true }) + "</div>" +
        UI.campo({ nombre: "contrasena", etiqueta: "Contraseña personal", tipo: "password", requerido: true, atributos: 'autocomplete="off"' }) +
        UI.campo({ nombre: "contrasenaArchivo", etiqueta: "Contraseña del archivo", tipo: "password", requerido: true, atributos: 'autocomplete="off"' });
    } else {
      texto = "<p>Copia " + (lectura.cifrada ? "antigua" : "<strong>sin cifrar</strong>") + fecha + ". Sustituye los datos; los usuarios y las contraseñas de ahora se mantienen.</p>";

    }

      titulo: "Recuperar copia",
      contenido: texto + '<div class="caja-aviso"><strong>Sustituirá los datos actuales.</strong> Si no estás seguro, descarga antes una copia de lo que tienes ahora.</div>' +
        '<form class="formulario" novalidate>' + campos + "</form>",
      botones: [{ texto: "Cancelar", valor: "cancelar" }, { texto: "Recuperar", valor: "enviar", estilo: "btn-primario" }],
    });

    try {
      var res = await WA.Sesion.restaurar(lectura, r.datos);
      WA.UI.aviso("Copia recuperada" + (res && res.faltan ? ". Faltan " + res.faltan + " adjuntos que no venían en la copia." : "."));

    var demo = WA.Sesion.modo === "demostración", admin = WA.Sesion.esAdmin;

    cont.innerHTML =
      "<h1>Copia de seguridad</h1>" +
      '<p class="intro">Tus datos solo están en este navegador. Descarga una copia cada vez que hagas cambios importantes y guárdala en otro sitio (un pendrive, la nube de la asociación…).</p>' +

      '<section class="tarjeta" aria-labelledby="t-descargar"><h2 id="t-descargar">Descargar copia</h2>' +

      "<p>La copia va <strong>cifrada</strong>: se abre con un nombre, un cargo y las dos contraseñas (la personal y la del archivo). Sin ellas no sirve de nada.</p>" +
      (docs.length ? '<p class="detalle">Incluye ' + docs.length + (docs.length === 1 ? " documento adjunto" : " documentos adjuntos") + " (" + esc(WA.DocsUI.tamanoTexto(pesoDocs)) + "): el archivo de copia ocupará algo más.</p>" : "") +
      '<div class="acciones"><button type="button" class="btn btn-primario" id="c-descargar">Descargar copia cifrada</button>' +
      (admin || demo ? '<button type="button" class="btn btn-secundario" id="c-claro">Descargar sin cifrar…</button>' : "") + "</div></section>" +
      (admin ? '<section class="tarjeta" aria-labelledby="t-recuperar"><h2 id="t-recuperar">Recuperar una copia</h2>' +
        "<p>Abre un archivo de copia para seguir trabajando con él en este navegador.</p>" +
        '<div class="acciones"><button type="button" class="btn btn-secundario" id="c-recuperar">Elegir archivo de copia…</button></div></section>'
        : '<p class="detalle">La copia sin cifrar y recuperar copias son cosa de la cuenta ' + esc(WA.Permisos.NOMBRE_ADMIN) + ".</p>") +
      '<section class="tarjeta" aria-labelledby="t-buenas"><h2 id="t-buenas">Buenas prácticas</h2><ul class="lista">' +
      "<li>Guarda al menos dos copias en sitios distintos, y alguna fuera de este ordenador.</li>" +
      "<li>Guarda las contraseñas aparte de las copias (por ejemplo, en un gestor de contraseñas). Sin ellas, la copia no sirve.</li>" +
      "<li>Las copias contienen datos personales de socios: compártelas solo con quien lleve la gestión.</li>" +
      "<li>Las copias sin cifrar, bórralas en cuanto termines de usarlas.</li>" +
      "</ul><p class=\"detalle\">Se guarda en este navegador con " + esc(tipo) + ".</p></section>";
    cont.querySelector("#c-descargar").addEventListener("click", function () { descargar(true).then(function () { WA.App.repintar(); }); });
    var claro = cont.querySelector("#c-claro"), rec = cont.querySelector("#c-recuperar");

    icono: '<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>',
  });

      "<h3>Color de acento</h3>" +
      '<div class="filas"><div class="muestras" role="group" aria-label="Color de acento">' +
      muestra("", "ABIES (el de siempre)", !acento) +
      WA.Tema.ACENTOS.map(function (x) { return muestra(x.color, x.nombre, x.color === acento); }).join("") +
      '<label class="muestra' + (propio ? " elegida" : "") + '" style="--c:' + (propio ? acento : "conic-gradient(#ff5c5c, #f6b94b, #50c99c, #599cf3, #a78bf7, #ff5c5c)") + '" title="Otro color">' +
      (propio ? MARCA : "") + '<input type="color" id="a-acento-propio" value="' + (propio ? acento : "#3fb0a0") + '" aria-label="Otro color"></label>' +
      "</div></div>" +
      '<p class="campo-ayuda">El acento es tuyo: va con tu usuario en los datos cifrados. La pantalla de acceso sale siempre en el verde de ABIES.</p>';
  }

  function seguridad(p, demo) {
    var opciones = [["5", "5 minutos"], ["15", "15 minutos"], ["30", "30 minutos"], ["60", "1 hora"], ["0", "Nunca"]];
    return (demo ? '<p class="detalle">En la demostración no hay contraseña ni datos guardados.</p>' : "") +
      '<form id="f-seguridad" class="formulario" novalidate><div class="filas">' +
      fila("Bloquear tras un rato sin usarla", "Pide otra vez la contraseña. Los datos siguen guardados.",
        '<select name="bloqueoMinutos" aria-label="Bloquear tras un rato sin usarla">' + opciones.map(function (o) {
          return '<option value="' + o[0] + '"' + (String(p.bloqueoMinutos) === o[0] ? " selected" : "") + ">" + o[1] + "</option>";
        }).join("") + "</select>") +
      fila("Borrar los datos al cerrar la sesión", "Para ordenadores compartidos. Al pulsar «Cerrar sesión» te pedirá descargar la copia si hay cambios, y después borrará los datos de este navegador. Si cierras la pestaña sin más, los datos se quedan guardados (cifrados).",
        '<input type="checkbox" class="conmutador" name="borrarAlSalir" aria-label="Borrar los datos al cerrar la sesión"' + (p.borrarAlSalir ? " checked" : "") + ">") +
      "</div></form>";
  }

  function privacidad() {
    return "<p>Esta aplicación <strong>no envía nada a ningún servidor</strong>: ni nube, ni analítica. Los datos solo están en este navegador (cifrados con la contraseña del archivo y la de cada usuario) y en las copias que se descarguen.</p>" +
      "<p>Aun así, la asociación es responsable de los datos personales de sus socios. Algunas buenas prácticas:</p><ul class=\"lista\">" +
      "<li>Cada miembro de la junta, con su propio usuario: así queda registrado quién hace cada cambio. Cuando alguien deja la junta, desactívalo en Usuarios.</li>" +
      "<li>Contraseñas largas. Nunca envíes la contraseña del archivo por el mismo canal que la copia de seguridad o que una contraseña personal.</li>" +
      "<li>Guarda las copias cifradas. Las copias sin cifrar, bórralas en cuanto termines.</li>" +
      "<li>Recoge solo los datos que necesitas e informa a los socios de para qué se usan.</li>" +
      "<li>Cuando alguien se da de baja, revisa cuánto tiempo debes conservar sus datos.</li>" +
      "</ul>" +
      '<p class="detalle">Estas recomendaciones son orientativas y no son asesoramiento legal. Las obligaciones concretas del RGPD y de la LOPDGDD para tu asociación (registro de actividades de tratamiento, información a los socios, plazos de conservación) conviene verificarlas con asesoría o con la guía de la Agencia Española de Protección de Datos.</p>';
  }

  function acerca() {
    return '<div class="filas">' + fila("ABIES · Gestión", "© 2026 Alberto Casado Vadillo. Todos los derechos reservados.",
      '<code id="a-version">' + esc(raiz.WA_VERSION || "desarrollo") + "</code>") + "</div>";
  }

  async function pintar(cont, datos, ruta) {
    var sec = SECCIONES.find(function (x) { return x.id === (ruta && ruta[0]); }) || SECCIONES[0];
    var p = WA.Preferencias.leer();
    var demo = WA.Sesion.modo === "demostración";
    var u = WA.Sesion.usuario;
    var cuerpo = sec.id === "cuenta" ? cuenta(u, demo)
      : sec.id === "apariencia" ? apariencia(WA.Tema.actual(), await WA.App.acentoGuardado())
      : sec.id === "seguridad" ? seguridad(p, demo)
      : sec.id === "privacidad" ? privacidad() : acerca();
    cont.innerHTML =
      '<h1>Ajustes</h1><p class="intro">Tu cuenta, cómo se ve la aplicación y cómo se protege en este ordenador.</p>' +
      '<div class="aj-layout"><nav class="aj-nav" aria-label="Secciones de Ajustes">' +
      SECCIONES.map(function (x) {
        return '<a class="aj-tab" href="#/ajustes/' + x.id + '"' + (x === sec ? ' aria-current="page"' : "") + ">" + x.titulo + "</a>";
      }).join("") + "</nav>" +
      '<section class="aj-body" aria-labelledby="aj-titulo"><h2 id="aj-titulo">' + sec.titulo + "</h2><p>" + sec.sub + "</p>" + cuerpo + "</section></div>" +
      '<p class="version-pie">ABIES · Gestión ' + esc(raiz.WA_VERSION || "desarrollo") + "</p>";

    // En el móvil las secciones son una fila que se desliza: que se vea la elegida
    var activa = cont.querySelector(".aj-tab[aria-current]");
    if (activa && activa.scrollIntoView && window.matchMedia("(max-width: 720px)").matches) activa.scrollIntoView({ block: "nearest", inline: "center" });

    cont.querySelectorAll('input[name="tema"]').forEach(function (r) {
      r.addEventListener("change", function () { WA.Tema.poner(r.value); });
    });
    var elegir = async function (color) {
      try {
        await WA.App.ponerAcento(color);
        await WA.App.repintar();
        UI.aviso("Color de acento guardado.");
      } catch (e) { UI.aviso(e.message, "error"); }
    };
    cont.querySelectorAll("button[data-acento]").forEach(function (b) {
      b.addEventListener("click", function () { elegir(b.getAttribute("data-acento")); });
    });
    var propio = cont.querySelector("#a-acento-propio");
    if (propio) propio.addEventListener("change", function () { elegir(propio.value); });
    var f = cont.querySelector("#f-seguridad");
    if (f) f.addEventListener("change", function () {
      var d = UI.leerFormulario(f);
      WA.Preferencias.poner({ bloqueoMinutos: parseInt(d.bloqueoMinutos, 10) || 0, borrarAlSalir: !!d.borrarAlSalir });
      WA.App.reiniciarBloqueo();
      UI.aviso("Ajuste guardado en este ordenador.");
    });
    var bp = cont.querySelector("#a-pass");
    if (bp) bp.addEventListener("click", cambiarMiContrasena);
  }

  WA.Ajustes = { cambiarMiContrasena: cambiarMiContrasena };
  WA.App.registrar({
    id: "ajustes", titulo: "Ajustes", orden: 100, pintar: pintar,
    icono: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>',
  });
})(typeof self !== "undefined" ? self : this);
</script>
