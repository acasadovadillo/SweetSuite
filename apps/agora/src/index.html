  <!-- La aplicación, visible solo con la sesión abierta. La estructura es la de
       Ironrack y Solvento: barra lateral (en el móvil, un cajón), barra de
       arriba solo en el móvil y cinco pestañas abajo en el teléfono. -->
  <div id="app" class="app" hidden>
    <aside id="menu-lateral" class="menu" aria-label="Menú">
      <div class="menu-cab">
        <a class="marca" href="#/inicio" id="marca" aria-label="Agora, inicio"></a>
        <button type="button" id="btn-cerrar-menu" class="menu-cerrar" aria-label="Cerrar el menú" title="Cerrar">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
        </button>
      </div>
      <div class="menu-titulo">ABIES</div>
      <!-- Quién ha entrado: abre el menú de la cuenta (Ajustes, Inicio de SweetSuite, Bloquear, Cerrar sesión) -->
      <button type="button" id="menu-cuenta" class="menu-cuenta" aria-haspopup="true">
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <span class="menu-cuenta-nombre" id="usuario-actual"></span>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <label class="menu-buscar">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="menu-buscar" placeholder="Buscar en ABIES…" autocomplete="off" aria-label="Buscar una sección">
      </label>
      <nav aria-label="Secciones"><ul id="menu-lista"></ul></nav>
      <div class="menu-pie"><button type="button" id="estado-copia" class="estado-copia"></button><span class="version" id="menu-version"></span></div>
    </aside>
    <div id="velo-menu" class="velo" aria-hidden="true"></div>

    <div class="contenido">
      <header class="cabecera">
        <button type="button" id="btn-menu" class="btn-icono" aria-expanded="false" aria-controls="menu-lateral" aria-label="Abrir el menú">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <a class="marca-movil" href="#/inicio" id="marca-movil" aria-label="Agora, inicio"><span id="marca-nombre"></span></a>
        <button type="button" id="btn-apps" class="btn-icono cabecera-apps" aria-label="Ir a otra app" title="Ir a otra app">
