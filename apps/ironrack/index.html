<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ironrack</title>
  <meta name="description" content="Registro de entrenos de gimnasio: ejercicios, series, repeticiones y kilos.">
  <meta name="theme-color" content="#0e1015">
  <link rel="icon" href="img/icono.svg" type="image/svg+xml">
  <!-- Albert Sans, como en Solvento: la usa la pantalla de entrada -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="src/css/app.css">
</head>
<body>
  <div id="login" hidden></div>

  <div id="app" hidden>
    <!-- La barra lateral, con la misma estructura que la de Solvento: marca,
         título, cuenta, buscador, secciones y, abajo, el estado y la versión.
         En el ordenador está siempre; en el móvil es un cajón que se abre con
         la hamburguesa. Sus secciones se copian de las pestañas (app.js). -->
    <aside class="lateral" id="lateral" aria-label="Menú">
      <div class="lateral-cab">
        <a href="#entrenar" class="lateral-marca" id="marca-lateral"><span>Ironrack</span></a>
        <button type="button" class="lateral-cerrar" data-a="cerrarLateral" aria-label="Cerrar el menú" title="Cerrar">
          <svg viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
        </button>
      </div>
      <div class="lateral-titulo">Gimnasio</div>
      <button type="button" class="lateral-cuenta" data-a="menuCuenta" aria-haspopup="true">
        <span class="avatar" id="avatar" aria-hidden="true"></span>
        <span class="lateral-cuenta-nombre" id="nombre-usuario"></span>
        <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <label class="lateral-buscar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="buscar-lateral" placeholder="Buscar ejercicios…" autocomplete="off" aria-label="Buscar ejercicios" data-on="buscarLateral">
      </label>
      <nav class="lateral-nav" id="nav-lateral"></nav>
      <div class="lateral-seccion">Cuenta</div>
      <nav class="lateral-nav">
        <a href="#ajustes" data-tab="ajustes"><svg viewBox="0 0 24 24"><use href="#i-ajustes"/></svg>Ajustes</a>
        <a href="#" data-a="volverSuite"><svg viewBox="0 0 24 24"><use href="#i-suite"/></svg>Volver a SweetSuite</a>
        <a href="#" data-a="bloquear"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Bloquear</a>
      </nav>
      <div class="lateral-pie">
        <button type="button" id="estado-lateral" class="estado-texto" data-a="irSincronizacion"></button>
        <span class="version mono" id="version"></span>
      </div>
    </aside>
    <div class="lateral-velo" id="lateral-velo" data-a="cerrarLateral" hidden></div>

    <!-- Arriba en el móvil, como en Solvento: hamburguesa, logo y la cuenta -->
    <header class="barra-sup">
      <button type="button" class="hamburguesa" data-a="abrirLateral" aria-label="Abrir el menú" aria-controls="lateral" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a href="#entrenar" class="marca" id="marca"><span id="marca-nombre">Ironrack</span></a>
      <button type="button" class="hamburguesa" data-a="volverSuite" aria-label="Volver a SweetSuite" title="Volver a SweetSuite">
        <svg viewBox="0 0 24 24"><use href="#i-suite"/></svg>
      </button>
    </header>

    <main id="vista"></main>

    <div id="descanso" class="descanso" hidden></div>

    <nav class="tabs">
      <a href="#entrenar" data-tab="entrenar"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>Entrenar</a>
      <a href="#historial" data-tab="historial"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Historial</a>
      <a href="#progreso" data-tab="progreso"><svg viewBox="0 0 24 24"><path d="M4 20h16M5 16l4.5-4.5 3.5 3.5L19 8"/><path d="M15 8h4v4"/></svg>Progreso</a>
      <a href="#rutinas" data-tab="rutinas"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>Rutinas</a>
      <a href="#ejercicios" data-tab="ejercicios"><svg viewBox="0 0 24 24"><path d="M5 4.5h10.5A3.5 3.5 0 0 1 19 8v11.5H8.5A3.5 3.5 0 0 1 5 16V4.5Z"/><path d="M5 16a3.5 3.5 0 0 1 3.5-3.5H19"/></svg>Ejercicios</a>
    </nav>
  </div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-suite" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-ajustes" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  </svg>

  <div id="velo" class="velo" hidden data-a="_cerrarVelo"></div>
  <div id="hoja" class="hoja" role="dialog" aria-modal="true" hidden></div>
  <div id="aviso" class="aviso" role="status" hidden></div>

  <script src="src/js/suite-puente.js"></script>
  <script src="src/js/util.js"></script>
  <script src="src/js/tema.js"></script>
  <script src="src/js/cripto.js"></script>
  <script src="src/js/github.js"></script>
  <script src="src/js/almacen.js"></script>
  <script src="src/js/biblioteca.js"></script>
  <script src="src/js/analisis.js"></script>
  <script src="src/js/ui.js"></script>
  <script src="src/js/descanso.js"></script>
  <script src="src/js/entrenar.js"></script>
  <script src="src/js/rutinas.js"></script>
  <script src="src/js/historial.js"></script>
  <script src="src/js/progreso.js"></script>
  <script src="src/js/ejercicios.js"></script>
  <script src="src/js/app.js"></script>
</body>
</html>
